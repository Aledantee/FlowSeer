# Model registry. Written by the `tune` skill; read by `delegate`.
# Prices are USD per million tokens (input, output) at the vendor's list rate;
# a prepaid pool makes them irrelevant below its cap. `pool: null` marks a
# model no signed-in pool serves: it stays because a plan ledger may name it,
# and it is in no fit set. `refusal_cyber` is the tune skill's measured
# or reported likelihood that a safety classifier declines security tooling
# work. Sources and dates live in `.claude/models/evidence.md`.
as_of: 2026-09-22  # calibrations 2026-09-09 and 2026-09-19/20: Merge task, see evidence.md; Sonnet 5 execute re-calibrated at xhigh 2026-09-18; catalogue re-pulled 2026-09-19 19:50Z, which priced the synthetic pool and took the five ids Synthetic does not answer back off it

pools:
  claude: {cli: claude, pin: orca-model, meter: requests}
  codex: {cli: codex, pin: orca-model, meter: requests}
  google: {cli: agy, pin: launch-flag, meter: requests}
  synthetic: {cli: opencode, pin: launch-flag, meter: requests}  # rolling five-hour request limit and weekly credit limit, both read from GET api.synthetic.new/v2/quotas
  zen: {cli: opencode, pin: launch-flag, meter: per-token, overflow_only: true}

models:
