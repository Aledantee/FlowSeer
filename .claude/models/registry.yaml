  glm-5.2: {pool: null, vendor: zai, price: [1.4, 4.4], context: 1000000, effort: [], refusal_cyber: low, open_weights: true}
  qwen3.8-max: {pool: null, vendor: alibaba, price: [2, 6], context: 1000000, effort: [], refusal_cyber: low, terminal_bench: 86.6, local: {review-unit: {found_known_bug: false, extra_valid: 1, wall_s: 1669, cost_usd: 0.63}}}
  deepseek-v4-flash: {pool: null, vendor: deepseek, price: [0.15, 0.6], context: 1000000, effort: [], refusal_cyber: low, open_weights: true}  # DeepSeek's row moved from [0.14, 0.28] when V4.1 Flash shipped 2026-09-10; 0.14/0.28 is now only NVIDIA's hosted copy
  deepseek-v4-pro: {pool: null, vendor: deepseek, price: [0.435, 0.87], context: 1000000, effort: [], refusal_cyber: low, terminal_bench: 87.9, open_weights: true}  # 0813 checkpoint; DeepSeek routes its traffic to V4.1 Flash from 2026-09-14, so the id survives its own weights; no calibration, in no fit set
  qwen3.8-flash: {pool: null, vendor: alibaba, price: [0.15, 0.47], context: 1000000, effort: [], refusal_cyber: low, terminal_bench: null}  # no calibration yet, in no fit set
  grok-4.6: {pool: null, vendor: xai, price: [2, 6], context: 500000, effort: [], refusal_cyber: low, terminal_bench: null}  # no calibration yet, in no fit set

# A role names what a piece of delegated work needs. `fit` lists the models
# that do it, in no order: `delegate` picks by pool headroom. `effort` is the
# level passed where the model supports one; a model whose `effort` list lacks
# the level gets the highest level it lists. A `local` result carries the
# effort it was measured at when that differs from the role's: `default`
# means the CLI's own default, because `bench.sh` dropped `--effort` on the
# `claude` lanes until 2026-09-18. Such a result says nothing about the
# model at the role's level, and every `local` result is one run.
roles:
  lookup: {effort: low, fit: [claude-haiku-4-5, gemini-3.8-flash]}  # deepseek-v4-flash left with the go pool 2026-09-19
  research: {effort: medium, fit: [claude-sonnet-5, gemini-3.8-flash, glm-5.3-flash]}  # deepseek-v4-flash left with the go pool 2026-09-19
  execute: {effort: xhigh, fit: [gemini-3.8-flash, gpt-5.6-sol, kimi-k3, deepseek-v4.1-flash]}  # deepseek-v4.1-flash added 2026-09-22 on its 7/7 of 2026-09-20 (one run, no -race, base bd9e0862); claude-sonnet-5 removed 2026-09-18 (6/7, 6/7, 5/7 across default and xhigh, same deadlock). glm-5.3 was removed 2026-09-09 on a lane that opencode cut at its 32,000-token output cap: that result is void, and whether glm-5.3 belongs here is unmeasured, not settled
  execute-sensitive: {effort: high, fit: [gpt-5.6-sol, kimi-k3], exclude: [claude-opus-5, claude-fable-5-1, gpt-6-astra]}
  review-unit: {effort: xhigh, fit: [gemini-3.8-flash, gpt-5.6-sol, claude-opus-5], vendor_differs_from: executor}  # sonnet, qwen3.8-max missed the calibration bug 2026-09-09
  review-seam: {effort: high, fit: [claude-opus-5, gpt-5.6-sol]}
  judge: {effort: max, fit: [claude-fable-5-1, gpt-6-astra], never_sensitive: true}
  critique: {effort: high, fit: [gemini-3.8-flash, kimi-k3]}  # minimax-m3 left with the go pool 2026-09-19; Synthetic answers 404 for it

# Paths whose units carry the `sensitive` tag: security classifiers on the
# top tier decline work here, and a decline inside Claude Code is a silent
# model swap, not an error.
sensitive_paths:
  - src/edge/netpen/**
  - src/common/internal/netpenguard/**
  - src/modules/localnet/**
  - src/protocol/snmp/**

# opencode lanes run the default agent with the model on the launch line
# (`opencode --model <pool_id>`), the same way `claude` and `codex` take
# `--model`. There are no agent profiles: a profile that pins a model gets no
# system prompt, and on 2026-09-19 that left one model reasoning for 32K
# tokens without a tool call and another answering nothing, while both
# answered in seconds on the default agent.
