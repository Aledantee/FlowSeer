# A role names what a piece of delegated work needs. `fit` lists entries
# best-first and `delegate` takes the first whose pool has room. An entry
# `<model>@<level>` launches at the level `tune` measured as that model's
# cheapest passing one for the role. A bare entry launches at the role's
# `effort`, the level for a model not yet swept, and a model whose `effort`
# list lacks it gets the highest level it lists. `min_effort` is a floor
# under both. A `judgment: true` role (planning, research, verdicts,
# adversarial reads) is ordered by the review task's result before cost and
# is graded on that task, since it has none of its own. Other roles are
# ordered by cost, wall time deciding costs within 25%.
#
# `local.<role>.<level>` holds a calibration result keyed by the level it
# ran at: `none` for a model with no levels, `default` for the CLI's own
# default (`bench.sh` dropped `--effort` on `claude` lanes until
# 2026-09-18), `unrecorded` for a result from before levels were recorded
# (`evidence.md`, calibration 2026-09-09: Gemini and Sol ran at `high`, no
# base was recorded). Each result carries its `runs` and `base` commit, with
# per-run lists when `runs` is above 1. A result without `runs` is one run.
roles:
  lookup: {effort: low, fit: [claude-haiku-4-5, gemini-3.8-flash]}  # deepseek-v4-flash left with the go pool 2026-09-19
  research: {effort: high, min_effort: high, judgment: true, fit: [claude-opus-5-5, gpt-6-sol, gemini-3.8-flash]}  # 2026-09-28 on the user's approval: review-unit's calibrated order, the models that found the known bug; sonnet-5 (missed it) and glm-5.3-flash (0/7 execute) left
  plan: {effort: xhigh, min_effort: high, judgment: true, fit: [claude-opus-5-5, gpt-6-sol, gemini-3.8-flash]}  # added 2026-09-28 for writing and re-planning plans (drive re-plan ran on `execute`); review-unit's calibrated order, approved by the user 2026-09-28
  execute: {effort: xhigh, fit: [gpt-5.6-luna@xhigh, gpt-6-sol@xhigh, gemini-3.8-flash, claude-sonnet-5-5@high, deepseek-v4.1-flash]}  # 2026-09-29 on the user's approval: reordered behind the integration tier. deepseek-v4.1-flash dropped from the lead to last because it fails integration (0/5) although it clears simple (1/1) and complex (6/6); it stays as the cheap option for simpler units. gpt-5.6-luna and gpt-6-sol lead (both 5/5 integration); claude-sonnet-5-5@high also 5/5. Earlier orders in evidence.md
  execute-sensitive: {effort: high, fit: [gpt-5.6-sol, deepseek-v4.1-flash, kimi-k3, gemini-3.8-flash], exclude: [claude-opus-5, claude-opus-5-5, claude-sonnet-5-5, claude-fable-5-1, gpt-6-astra], last_resort: [claude-opus-4-8]}  # 2026-09-29: sensitive netpen task, all four passed 1/1 clean with no refusal or downgrade (gpt-5.6-sol 283 s, deepseek 390 s $0.17 via omp, kimi 390 s $0.86 via omp, gemini 615 s). exclude-claude validated by the run: claude-sonnet-5-5 hard-refused and fell back to sonnet-5, claude-opus-5-5 silently ran partly as opus-4-8. gpt-6-astra failed the task (0/1). Opus 4.8 kept as last_resort (1/1 clean)
  review-unit: {effort: xhigh, fit: [claude-opus-5-5, gpt-6-sol, gemini-3.8-flash], vendor_differs_from: executor}  # 2026-09-23 calibration, best-first; sonnet-5, gpt-6-luna, haiku missed the bug
  review-seam: {effort: high, judgment: true, fit: [gpt-6-sol, claude-opus-5-5]}  # field order applied 2026-09-28 on the user's approval: both 100% accepted on 6+ graded runs, gpt-6-sol 1511 s $3.08 median against 2650 s $5.79; calibration was at xhigh on review-unit 2026-09-23
  judge: {effort: max, judgment: true, fit: [claude-opus-5-5, gpt-6-astra], never_sensitive: true}  # Opus 5.5 over Fable 5.1 by the user's preference 2026-09-23; not calibrated
  critique: {effort: high, min_effort: high, judgment: true, fit: [gemini-3.8-flash, kimi-k3]}  # minimax-m3 left with the go pool 2026-09-19; Synthetic answers 404 for it

# opencode agent name per role on the `synthetic` and `zen` pools. Each agent
# in `~/.config/opencode/opencode.json` is named after its model and pins only
# the model; the role, effort, and permissions come from the brief. A role
# whose fit set holds no model from those pools has no agent.
opencode_agents:
  research: glm-5.3-flash
  execute: deepseek-v4.1-flash
  execute-sensitive: deepseek-v4.1-flash
  critique: kimi-k3
  overflow: claude-sonnet-5
