# Project override of the machine-wide model registry at
# `~/.claude/models/registry.yaml`, which the `tune` skill writes. An entry
# here replaces the machine-wide entry of the same name under `pools`,
# `models`, `roles`, and `opencode_agents`; any other top-level key replaces
# the machine-wide key whole. Keep only what is specific to this repository.

# Paths whose units carry the `sensitive` tag: security classifiers on the
# top tier decline work here, and a decline inside Claude Code is a silent
# model swap, not an error.
sensitive_paths:
  - src/edge/netpen/**
  - src/common/internal/netpenguard/**
  - src/modules/localnet/**
  - src/protocol/snmp/**
