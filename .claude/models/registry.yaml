  codex: {cli: codex, pin: orca-model, meter: requests}
  google: {cli: agy, pin: launch-flag, meter: requests}
  synthetic: {cli: opencode, pin: agent-name, meter: requests}  # rolling five-hour request limit and weekly credit limit, both read from GET api.synthetic.new/v2/quotas
  zen: {cli: opencode, pin: agent-name, meter: per-token, overflow_only: true}

