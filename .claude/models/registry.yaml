  claude-opus-5: {pool: claude, vendor: anthropic, price: [5, 25], context: 1000000, effort: [low, medium, high, xhigh, max], refusal_cyber: medium, local: {review-seam: {effort: default, found_known_bug: true, extra_valid: 1, wall_s: 148, cost_usd: 0.66}}}
  claude-sonnet-5: {pool: claude, vendor: anthropic, price: [2, 10], context: 1000000, effort: [low, medium, high, xhigh, max], refusal_cyber: low, local: {execute: {effort: xhigh, runs: 2, base: bd9e0862, pass: [6/7, 5/7], wall_s: [591, 580], cost_usd: [1.58, 1.39], note: deadlock on source error in both runs; same failure at default effort 2026-09-09 (6/7)}, review-unit: {effort: default, found_known_bug: false, wall_s: 140, cost_usd: 0.31}}}
  claude-haiku-4-5: {pool: claude, vendor: anthropic, price: [1, 5], context: 200000, effort: [], refusal_cyber: low}
  gpt-6-astra: {pool: codex, vendor: openai, price: [10, 50], context: 1050000, effort: [low, medium, high, xhigh, max], refusal_cyber: high}
  gpt-5.6-sol: {pool: codex, vendor: openai, price: [4, 20], context: 1050000, effort: [low, medium, high, xhigh, max], refusal_cyber: low, terminal_bench: null, local: {execute: {pass: 7/7, wall_s: '>6600 (global codex plugin self-review)', cost_usd: null}, review-unit: {found_known_bug: true, extra_valid: 4, wall_s: 530, cost_usd: 3.5}}}
  gpt-5.6-luna: {pool: codex, vendor: openai, price: [0.2, 1.2], context: 1050000, effort: [low, medium, high], refusal_cyber: low}
  gemini-3.8-flash: {pool: google, vendor: google, price: [0.75, 3.75], context: 1048576, effort: [low, medium, high], refusal_cyber: medium, id_format: "gemini-3.8-flash-<effort>", local: {execute: {pass: 7/7, wall_s: 201, cost_usd: 0.56}, review-unit: {found_known_bug: true, extra_valid: 4, wall_s: 275, cost_usd: 0.48}}}
  glm-5.3: {pool: null, vendor: zai, price: [1.4, 4.4], context: 1000000, effort: [], refusal_cyber: low, terminal_bench: 88.2, open_weights: true, local: {execute: {pass: void, wall_s: 902, cost_usd: 0.17, note: "recorded 0/7 on 2026-09-09 for 32K reasoning then finish=length with no tool call; that is opencode's default output cap, so the lane measured the harness. Was removed from the execute fit set on this result"}}}
  glm-5.3-flashx: {pool: null, vendor: zai, price: [0.37, 1.25], context: 1000000, effort: [], refusal_cyber: low, open_weights: true}  # GLM-5.3-Flash's weights on a faster serving stack, 2026-09-18; no new evaluation, and Synthetic does not serve it
  glm-5.3-flash: {pool: synthetic, pool_id: "synthetic/hf:zai-org/GLM-5.3-Flash", vendor: zai, price: [0.15, 0.5], context: 524288, effort: [], refusal_cyber: low, open_weights: true, local: {execute: {base: bd9e0862, pass: void, runs: 3, wall_s: [469, 423, 775], cost_usd: [0.018, 0.019, 0.017], note: "every run ends finish=length at exactly 32,000 output tokens with no tool call and no file: through an agent profile, through the same profile with a per-model limit override, and on the default agent with no profile. Synthetic serves 33,100 tokens to a direct call and opencode publishes 65,536 for the model, so the ceiling is opencode's and the model reasons past it on this brief. Not a score; unusable for execute through opencode until that ceiling moves"}}}  # [0.07, 0.25] was a launch promotion that ended 2026-09-09; Z.ai serves 1M context, Synthetic 512K
  kimi-k3: {pool: synthetic, pool_id: "synthetic/hf:moonshotai/Kimi-K3", vendor: moonshotai, price: [3, 15], context: 524288, effort: [], refusal_cyber: low, terminal_bench: 88.3, open_weights: true, local: {execute: {runs: 2, base: [unrecorded, bd9e0862], pass: [7/7, 6/7], wall_s: [1235, 460], cost_usd: [0.82, 0.026], race: [true, false], note: "run 1 on the go pool 2026-09-09 at the vendor's 1M context, with -race; run 2 on synthetic 2026-09-19 at 512K on the default agent, without -race (no C compiler on the host), failing TestMergeAcceptSourceErrorPropagates, the source-error deadlock Sonnet 5 also had; its own tests pass"}}}
