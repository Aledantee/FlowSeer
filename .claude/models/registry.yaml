  deepseek-v4.1-flash: {pool: synthetic, pool_id: "synthetic/hf:deepseek-ai/DeepSeek-V4.1-Flash", vendor: deepseek, price: [0.6, 1.2], context: 524288, effort: [], refusal_cyber: low, terminal_bench: null, open_weights: true, local: {execute: {base: bd9e0862, pass: 7/7, wall_s: 332, cost_usd: 0.002, race: false, note: "default agent; its own tests pass; graded without -race, this host has no C compiler. Entered execute 2026-09-22 on this run"}}}  # DeepSeek reports Terminal-Bench 2.1 90.6 on its own harness, not comparable with this column
  nemotron-3-super: {pool: synthetic, pool_id: "synthetic/hf:nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4", vendor: nvidia, price: [0.3, 1.0], context: 262144, effort: [], refusal_cyber: low, terminal_bench: null, open_weights: true, local: {execute: {base: bd9e0862, pass: 1/7, wall_s: 3600, cost_usd: null, race: false, note: "cut off at the harness's 3,600 s ceiling mid-turn with both files on disk and staged; what existed compiles and passes only TestMergeAcceptZeroSourcesCompletes; cost unrecorded, the lane's record was lost to a bench.sh edit during the run; graded without -race"}}}
  gpt-oss-120b: {pool: synthetic, pool_id: "synthetic/hf:openai/gpt-oss-120b", vendor: openai, price: [0.1, 0.1], context: 131072, effort: [], refusal_cyber: low, open_weights: true, local: {execute: {base: bd9e0862, pass: 6/7, wall_s: 282, cost_usd: 0.004, race: false, note: "default agent; fails TestMergeAcceptContextCancelPropagates; its own tests pass; graded without -race, this host has no C compiler"}}}  # returned nothing through a custom agent profile, which is why profiles are gone; smallest context in the registry
