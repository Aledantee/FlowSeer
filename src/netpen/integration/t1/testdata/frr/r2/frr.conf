! FRR config for t1 r2 (OSPF adjacency playground).
frr version 10.1
frr defaults traditional
hostname r2
log syslog debugging
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 ip ospf area 0
!
router ospf
 ospf router-id 10.99.0.12
 passive-interface default
 no passive-interface eth0
!
