! FRR config for t1 OSPF adjacency playground.
! Both routers share area 0 on the 10.99.0.0/24 link; r1 (10.99.0.11)
! and r2 (10.99.0.12) form an OSPF adjacency that netpen's OSPF injection
! attacks. The injected LSA claims 10.99.99.0/24 via a router-LSA.
!
! r1 config (applied to both; the config is interface-name agnostic
! because FRR auto-detects the connected subnet).
frr version 10.1
frr defaults traditional
hostname r1
log syslog debugging
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 ip ospf area 0
!
router ospf
 ospf router-id 10.99.0.11
 passive-interface default
 no passive-interface eth0
!
