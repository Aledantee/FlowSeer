###############################################################################
# FlowSeer SNMP integration T1 — Net-SNMP reference agent configuration
#
# This file is consumed inside a Docker container built from the sibling
# Dockerfile. It is reseeded on every container start; no host-side
# state persists.
#
# Provides:
#   - SNMPv2c read-only community "public" for smoke / GetBulk tests.
#   - SNMPv3 USM users covering every (AuthProtocol, PrivProtocol) pair
#     supported by both common/snmp/usm.go AND gosnmp v1.43.2's
#     gsAuthProtocol / gsPrivProtocol mappings. The full matrix
#     is enumerated in t1_usm_matrix_test.go; this file is the
#     wire-side ground truth.
#
#   - pass-script registrations under .1.3.6.1.4.1.99999.* for the
#     forged-edge cases real switches cannot produce on demand.
#
# Intentional omissions:
#   - Priv3DES: rejected at gosnmp.Dial (see backend/gosnmp/backend.go
#     ::gsPrivProtocol). T1's USM matrix asserts that rejection at the
#     library level rather than provisioning a usable 3DES user here.
#   - AES-192C / AES-256C ("Cisco-extended" key-derivation variants):
#     net-snmp does not implement Reeder/Blumenthal key extension as a
#     distinct keyword; configuring AES-192 / AES-256 here is the
#     closest the agent supports. T1's matrix uses these for the AES
#     wide-key paths; the C-variant distinction surfaces only in the
#     library's USM key-derivation logic, not on the wire.
###############################################################################

agentaddress udp:161,udp6:[::]:161
sysLocation flowseer-integration-t1
sysContact integration@flowseer.local
sysServices 76

###############################################################################
# SNMPv2c
###############################################################################

rocommunity public default

###############################################################################
# SNMPv3 USM users
#
# Naming: <auth>-<priv> in lowercase. Passphrases are non-secret
# integration-test values pinned here so library-side tests can
# reproduce them deterministically. Every passphrase is at least
# 8 characters (RFC 3414 USM requirement).
###############################################################################

# NoAuth, NoPriv — the floor of the matrix; the library's MinSecurity
# default rejects this combination at Dial, so T1's matrix uses it
# only to assert the library's gate, not for a real session.
createUser noauth-nopriv

# Auth-only (NoPriv) — one user per supported AuthProtocol.
createUser md5-nopriv     MD5     "auth-md5-passphrase"
createUser sha-nopriv     SHA     "auth-sha-passphrase"
createUser sha224-nopriv  SHA-224 "auth-sha224-passphrase"
createUser sha256-nopriv  SHA-256 "auth-sha256-passphrase"
createUser sha384-nopriv  SHA-384 "auth-sha384-passphrase"
createUser sha512-nopriv  SHA-512 "auth-sha512-passphrase"

# AuthPriv with DES — paired with MD5 and SHA only; DES is legacy.
createUser md5-des        MD5  "auth-md5-passphrase"  DES "priv-des-passphrase"
createUser sha-des        SHA  "auth-sha-passphrase"  DES "priv-des-passphrase"

# AuthPriv with AES-128 (universal).
createUser md5-aes        MD5     "auth-md5-passphrase"     AES "priv-aes-passphrase"
createUser sha-aes        SHA     "auth-sha-passphrase"     AES "priv-aes-passphrase"
createUser sha256-aes     SHA-256 "auth-sha256-passphrase"  AES "priv-aes-passphrase"
createUser sha384-aes     SHA-384 "auth-sha384-passphrase"  AES "priv-aes-passphrase"
createUser sha512-aes     SHA-512 "auth-sha512-passphrase"  AES "priv-aes-passphrase"

# AuthPriv with AES-192 / AES-256 (RFC 3826 + Blumenthal extension).
# These keywords require net-snmp 5.9+ with the AES wide-key build option.
createUser sha256-aes192  SHA-256 "auth-sha256-passphrase"  AES-192 "priv-aes192-passphrase"
createUser sha256-aes256  SHA-256 "auth-sha256-passphrase"  AES-256 "priv-aes256-passphrase"
createUser sha384-aes256  SHA-384 "auth-sha384-passphrase"  AES-256 "priv-aes256-passphrase"
createUser sha512-aes256  SHA-512 "auth-sha512-passphrase"  AES-256 "priv-aes256-passphrase"

# AuthPriv with 3DES-EDE (draft-reeder). Rejected at gosnmp.Dial, so this
# user is exercised only by the NATIVE backend's T1 matrix. net-snmp
# spells the keyword "DES3" / "3DES" depending on build; "DES3EDE" is the
# canonical token in recent builds.
createUser sha-3des       SHA     "auth-sha-passphrase"     DES3 "priv-3des-passphrase"

# Grants — one rouser per createUser, mapped to the matching security level.
rouser noauth-nopriv  noauth
rouser md5-nopriv     auth
rouser sha-nopriv     auth
rouser sha224-nopriv  auth
rouser sha256-nopriv  auth
rouser sha384-nopriv  auth
rouser sha512-nopriv  auth
rouser md5-des        priv
rouser sha-des        priv
rouser md5-aes        priv
rouser sha-aes        priv
rouser sha256-aes     priv
rouser sha384-aes     priv
rouser sha512-aes     priv
rouser sha256-aes192  priv
rouser sha256-aes256  priv
rouser sha384-aes256  priv
rouser sha512-aes256  priv
rouser sha-3des       priv

###############################################################################
# Forged-edge pass-script registrations
#
# Each script emits the canonical Net-SNMP pass-protocol response that
# coerces snmpd into producing the desired wire shape. Subtree OIDs
# are under FlowSeer's experimental .1.3.6.1.4.1.99999 enterprise space
# so they do not collide with real registered MIB modules.
###############################################################################

pass .1.3.6.1.4.1.99999.1 /usr/local/share/snmp-pass/nosuchinstance.sh
pass .1.3.6.1.4.1.99999.2 /usr/local/share/snmp-pass/endofmibview.sh
pass .1.3.6.1.4.1.99999.3 /usr/local/share/snmp-pass/counter32-wrap.sh
pass .1.3.6.1.4.1.99999.4 /usr/local/share/snmp-pass/malformed-dateandtime.sh
pass .1.3.6.1.4.1.99999.5 /usr/local/share/snmp-pass/oversized-octetstring.sh
pass .1.3.6.1.4.1.99999.6 /usr/local/share/snmp-pass/mid-table-truncation.sh
