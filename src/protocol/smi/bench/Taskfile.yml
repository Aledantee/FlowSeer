# SMI parser performance suite (src/protocol/smi/bench/).
#
# Every `go` invocation here runs inside the standalone bench module (its
# own go.mod), so run this Taskfile from this directory:
#
#   task -t Taskfile.yml gate
#
# The main module never sees these targets.

version: '3'

vars:
  # Repetitions benchstat needs to say anything about significance.
  # Override with `task micro COUNT=20`.
  COUNT: '10'

tasks:
  micro:
    desc: 'The full stage ladder — lex, frame, parse, recover, load, end-to-end.'
    summary: |
      Reports ns/op, MB/s, B/op and allocs/op for every stage separately
      and for the compositions above them, so a regression names the
      stage it came from rather than moving one whole-parser average.

      The unexported resolution pass cannot be timed directly here.
      Comparing Load with Pipeline also includes module discovery and
      loading imports, so the difference only approximates resolution.
    cmds:
      - go test -bench . -benchmem -run '^$' -count={{.COUNT}}

  stat:
    desc: 'Summarize the committed baseline with benchstat.'
    cmds:
      - benchstat testdata/baseline-micro.txt

  gate:
    desc: 'Perf-gate: benchstat a fresh run against the committed baseline; hard-fail on allocs/op + B/op.'
    summary: |
      Turns testdata/baseline-micro.txt into an enforced invariant. Wall
      time is advisory unless GATE_NS=1, and an allocation delta under
      MIN_DELTA percent is reported and not acted on, because a gate that
      false-trips on a busy machine is a gate somebody switches off.

        task gate                     # full suite, COUNT=10
        task gate COUNT=6              # faster, noisier
        BENCH=Recovery task gate       # gate one benchmark
        GATE_NS=1 task gate            # hard-fail wall time too (local)
        MIN_DELTA=0.5 task gate        # tighten the effect-size floor

      Refresh the baseline deliberately: re-run `task micro
      COUNT=10`, keep the preamble and the benchmark rows, commit the new
      testdata/baseline-micro.txt. The gate never rewrites it.
    cmds:
      - COUNT={{.COUNT}} BENCH={{.BENCH | default "."}} GATE_NS={{.GATE_NS | default "0"}} MIN_DELTA={{.MIN_DELTA | default "1"}} sh bench-gate.sh

  test:
    desc: 'The suite''s own tests: the fixture pins, the recovery corpus, and the gate script.'
    cmds:
      - go test ./...

  profile:
    desc: 'Emit mem + cpu profiles so an allocation is attributable to a function before anybody touches it.'
    summary: |
      Never optimize a site you have not first seen in a profile. Writes
      mem.prof + cpu.prof and the test binary (for symbol resolution and
      `list`) to the gitignored profiles/ dir.

        task profile                              # whole-file parse
        task profile BENCH=Load/fixture=lancom-oids
        task profile BENCH=Recovery

      Then attribute:

        go tool pprof -top -alloc_objects profiles/bench.test profiles/mem.prof
        go tool pprof -http=: profiles/bench.test profiles/cpu.prof
    vars:
      OUT: 'profiles'
      BENCH: '{{.BENCH | default "ParseFile/fixture=lancom-oids"}}'
    cmds:
      - mkdir -p {{.OUT}}
      - go test -run '^$' -bench '{{.BENCH}}' -benchmem -count=1 -benchtime=2s -memprofile {{.OUT}}/mem.prof -cpuprofile {{.OUT}}/cpu.prof -o {{.OUT}}/bench.test
      - 'echo "Profiles in {{.OUT}}/. Top allocation sites:"'
      - go tool pprof -top -nodecount=12 -alloc_objects {{.OUT}}/bench.test {{.OUT}}/mem.prof
