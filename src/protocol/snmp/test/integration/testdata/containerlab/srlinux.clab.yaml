# FlowSeer SNMP integration T2 — single-node Nokia SR Linux lab.
#
# Deployed by the t2 tier's TestMain via the testenv.StartSRLinux
# wrapper. Cleanup happens through `containerlab destroy --cleanup`
# either at test-process exit or when StartSRLinux's readiness probe
# fails partway through.
#
# Image: ghcr.io/nokia/srlinux at release 26.7.2, pinned by the digest of
# its multi-arch index (linux/amd64 and linux/arm64). This
# image is publicly pullable without a Nokia account. If Nokia changes
# that policy, swap the kind/image to another containerlab-supported
# NOS (the harness reaches only through the public SNMP surface, so
# the swap is mechanical).
#
# Startup-config: ../srlinux/startup.cli — provisions the v3 USM
# user [testenv.SRLinuxUSMConfig] uses for readiness probing.

name: flowseer-t2

topology:
  nodes:
    srl1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2@sha256:0096fe3ebcafabb7253492e2060425fe027a168e0e066766d1e85efbb0b48be8
      type: ixrd2
      startup-config: ../srlinux/startup.cli
