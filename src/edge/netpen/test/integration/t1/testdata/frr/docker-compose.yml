# Two FRR nodes form an OSPF adjacency on a shared bridge. The integration
# suite starts this fixture, but the image does not include the netpen binary
# that the command-execution tests require. The separate ring fixture has no
# executing protocol assertions.

services:
  frr-r1:
    image: quay.io/frrouting/frr:10.1.0
    container_name: netpen-t1-frr-r1
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    networks:
      netpen-t1-lab:
        ipv4_address: 10.99.0.11
    volumes:
      - ./r1/daemons:/etc/frr/daemons:ro
      - ./r1/frr.conf:/etc/frr/frr.conf:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/lib/frr/frrinit.sh start
        sleep infinity
    sysctls:
      - net.ipv4.ip_forward=1
    privileged: true

  frr-r2:
    image: quay.io/frrouting/frr:10.1.0
    container_name: netpen-t1-frr-r2
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    networks:
      netpen-t1-lab:
        ipv4_address: 10.99.0.12
    volumes:
      - ./r2/daemons:/etc/frr/daemons:ro
      - ./r2/frr.conf:/etc/frr/frr.conf:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/lib/frr/frrinit.sh start
        sleep infinity
    sysctls:
      - net.ipv4.ip_forward=1
    privileged: true

networks:
  netpen-t1-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24
