# This fixture defines two netpen containers on a shared bridge. Neither has
# a command for crafting or decoding packets; the default entrypoint prints
# usage and exits. TestMain does not start this fixture, and it provides no
# automated wire-shape or vendor-behavior assertions.

services:
  netpen-crafter:
    image: netpen:local
    build:
      context: ../../../../../../../..
      dockerfile: src/edge/netpen/test/integration/t1/testdata/netpen-ring/Dockerfile
    container_name: netpen-t1-crafter
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      netpen-t1-ring:
        ipv4_address: 10.99.1.11
    privileged: true

  netpen-decoder:
    image: netpen:local
    build:
      context: ../../../../../../../..
      dockerfile: src/edge/netpen/test/integration/t1/testdata/netpen-ring/Dockerfile
    container_name: netpen-t1-decoder
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      netpen-t1-ring:
        ipv4_address: 10.99.1.12
    privileged: true

networks:
  netpen-t1-ring:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.1.0/24
