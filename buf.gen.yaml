version: v2

# Go output covers all proto modules — Ruckus telemetry (edge-side ingestion)
# and FlowSeer-owned protos (web↔API surface) both compile to Go.
managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
    - file_option: go_package_prefix
      module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: go.aledante.io/FlowSeer/generated/go/proto

plugins:
  - remote: buf.build/protocolbuffers/go
    out: generated/go/proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: generated/go/proto
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.10.0
    # TS bindings land inside the web workspace package so they consume
    # `@bufbuild/protobuf` via that package's own dependency graph —
    # no root-level pnpm hoisting required. Go output still lives under
    # generated/go/ at repo root; only the TS leg moved into the web tree.
    out: frontend/web/generated/proto
    opt: target=ts
    # Emit TS bindings for transitive imports (protovalidate's
    # `buf/validate/validate.proto`) so generated files can resolve
    # their `import "../../../buf/validate/validate_pb"` statements at
    # compile time. The Go plugin handles equivalents via Go module
    # paths; the TS plugin requires explicit `include_imports`.
    include_imports: true
