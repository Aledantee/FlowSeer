edition = "2024";

// Proto2-equivalent feature pins: these files were published by Ruckus as
// proto2; the pins keep wire format and semantics identical under edition 2024.
option features.enum_type = CLOSED;
option features.repeated_field_encoding = EXPANDED;
option features.utf8_validation = NONE;
option features.json_format = LEGACY_BEST_EFFORT;
option features.enforce_naming_style = STYLE_LEGACY;

option java_package = "com.ruckuswireless.scg.protobuf.sci";

option java_outer_classname = "SciProtocolMessage";
import "ruckus/ap/ap_status.proto";
import "ruckus/ap/ap_report.proto";
import "ruckus/ap/ap_client.proto";
import "ruckus/ap/ap_mesh.proto";
import "ruckus/ap/ap_rogue.proto";
import "ruckus/sci/sci-event.proto";
import "ruckus/sci/sci-configuration.proto";
import "ruckus/ap/ap_avc.proto";
import "ruckus/ap/ap_avc_all.proto";
import "ruckus/sci/sci-alarm.proto";
import "ruckus/ap/ap_wired_client.proto";
import "ruckus/ap/ap_hccd_report.proto";
import "ruckus/sci/sci-pci.proto";
import "ruckus/icx/switch_all.proto";
import "ruckus/icx/switches.proto";
import "ruckus/sci/sci-rogue.proto";
import "ruckus/ap/ap_peerlist.proto";
import "ruckus/scg/session_manager.proto";

message SciMessage {

    extensions 1001 to 3000;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description protocol version.
     * @since 3.5
     */
    string version = 1;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description Message identifier for duplication detection.
     * @since 3.5
     */
    bytes uuid = 3;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description Sent time in milliseconds.
     * @since 3.5
     */
    int64 sentTimeMs = 4;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description SCI System identifier.
     * @since 3.5
     */
    string sciSystemId = 5;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description APStatus from Routine AP Statistic Report.
     * @since 3.5
     */
    APStatus apStatus = 101;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description APReportStats from Routine AP Statistic Report.
     * @since 3.5
     */
    APReportStats apReport = 102;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description APClientStats from Routine AP Statistic Report.
     * @since 3.5
     */
    APClientStats apClient = 103;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description APMeshStats from Routine AP Statistic Report.
     * @since 3.5
     */
    APMeshStats apMesh = 104;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description RogueAPStats from Routine AP Statistic Report.
     * @since 3.5
     */
    RogueAPStats apRogue = 105;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description Event message which has been applied to be sent to outer service.
     * @since 3.5
     */
    EventMessage eventMessage = 106;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description SZ overall configuration message sent out every 15 minutes.
     * @since 3.5
     */
    ConfigurationMessage configurationMessage = 107;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description Alarm message will be sent out when the alarm happens.
     * @since 3.5.1
     */
    AlarmMessage alarmMessage = 108;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description APWiredClientStats from Routine AP Statistic Report.
     * @since 3.5.1
     */
    APWiredClientStats apWiredClient = 109;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description PCI Compliance Report which will be sent out every 15 minutes.
     * @since 5.0.0
     */
    PciReportMessage pciReportMessage = 110;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description ApHccdReportMessage from Routine AP Statistic Report.
     * @since 5.0.0
     */
    ApHccdReportMessage apHccdReportMessage = 111;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description SwitchMessage from ICX Statistic Report.
     * @since 5.1.1
     */
    com.ruckuswireless.scg.protobuf.icx.SwitchMessage switchMessage = 112;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description SciRogueMessage from AP rogue AP report which have been classified by rogue AP policy of SZ.
     * @since 5.1.1
     */
    SciRogueMessage sciRogueMessage = 113;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description SessionManagerClientData from Session Manager's client auth/deauth or connect/disconnect event.
     * @since 5.2
     */
    SessionManagerClientData sessionManagerClientData = 114;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description ArcMessage is from Routine AP Statistic Report which will be sent out every 5 minutes.
     * @since 3.5
     */
    repeated ArcMessage arcMessage = 206;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description APAVCStats contains a series of ArcMessage..
     * @since 5.1.1
     */
    APAVCStats apAvc = 207;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description Switch overall configuration message sent out every 15 minutes.
     * @since 5.1.2
     */
    com.ruckuswireless.scg.protobuf.icx.SwitchConfigurationMessage switchConfigurationMessage = 300;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description Switch realtime status.
     * @since 5.1.2
     */
    com.ruckuswireless.scg.protobuf.icx.RealtimeSwitchStatus realtimeSwitchStatus = 301;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description APPeerReport for on-demand API.
     * @since 5.2.0
     */
    APPeerReport apPeer = 302;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description The list of attached switch detail
     * @since 5.2
     */
    com.ruckuswireless.scg.protobuf.icx.SwitchDetailMessage switchDetailMessage = 303;
}
