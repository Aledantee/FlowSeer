edition = "2024";

// Proto2-equivalent feature pins: these files were published by Ruckus as
// proto2; the pins keep wire format and semantics identical under edition 2024.
option features.enum_type = CLOSED;
option features.repeated_field_encoding = EXPANDED;
option features.utf8_validation = NONE;
option features.json_format = LEGACY_BEST_EFFORT;
option features.enforce_naming_style = STYLE_LEGACY;

/**
 * Copyright 2013 Ruckus Wireless, Inc. All rights reserved.
 *
 * RUCKUS WIRELESS, INC. CONFIDENTIAL - 
 * This is an unpublished, proprietary work of Ruckus Wireless, Inc., and is 
 * fully protected under copyright and trade secret laws. You may not view, 
 * use, disclose, copy, or distribute this file or any information contained 
 * herein except pursuant to a valid license from Ruckus. 
 *
 * 2016/07/01 Created By Frankie Chao
 * JsonMessage GPB format is used to transfer the JSON messages accros 
 * applications which includes the version, message content and message 
 * content type attributes.
 */
option java_package = "com.ruckuswireless.scg.protobuf.sci";

message EventMessage {
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description GPB version
	 * @since 3.5
	 */
	uint32 version = 1 [features.field_presence = LEGACY_REQUIRED];
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event code
	 * @since 3.5
	 */
	uint32 eventCode = 2;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event type
	 * @since 3.5
	 */
	string eventType = 3;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event main category
	 * @since 3.5
	 */
	string mainCategory = 4;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event sub category
	 * @since 3.5
	 */
	string subCategory = 5;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Domain UUID
	 * @since 3.5
	 */
	string domainId = 6;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Zone UUID. Unique zone ID (for example, b381206b-2e5d-43dc-b249-e36ffae9855c) assigned by the controller.
	 * @since 3.5
	 */
	string zoneId = 7;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description AP Group identifier
	 * @since 3.5
	 */
	string apGroupId = 8;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Access Point  MAC address
	 * @since 3.5
	 */
	string apMac = 9;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description UE/Client MAC address if the events are related to client
	 * @since 3.5
	 */
	string clientMac = 10;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event timestamp (UTC time)
	 * @since 3.5
	 */
	uint64 timestamp = 11;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Additional event attributes.
	 * @since 3.5
	 */
	repeated MessageEntry attributes = 12;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Event severity
	 * @since 3.5
	 */
	string severity = 13;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Reason for the event to occur.
	 * @since 3.5
	 */
	string reason = 14;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Domain name.
	 * @since 3.5
	 */
	string domainName = 15;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Zone name. Zone name assigned by the controller . The admin configures the Zone name via the contoller's user interface. The controller passes it to the AP.  AP retains the zone name.
	 * @since 3.5
	 */
	string zoneName = 16;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description AP Group name
	 * @since 3.5
	 */
	string apGroupName = 17;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description IPv4 address of the AP
	 * @since 3.5
	 */
	string apIpAddress = 18;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description IPv6 address of the AP
	 * @since 3.5
	 */
	string apIpv6Address = 19;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description description of the event
	 * @since 3.5
	 */
	string description = 20;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description disconnectReason of the event
	 * @since 3.5
	 */
	string disconnectReason = 21;
	/**
	 * @property snapshot
     	 * @aggregation NULL
     	 * @description The tenant id of switch
     	 * @since 6.0
     	 */
	string tenantId = 22;
	/**
     	 * @property snapshot
     	 * @aggregation NULL
	 * @description Switch id
     	 * @since 6.0
     	 */
    	string switchId = 23;
    	/**
     	 * @property snapshot
     	 * @aggregation NULL
     	 * @description switch unit id
     	 * @since 6.0
     	 */
    	string switchUnitId = 24;
    	/**
     	 * @property snapshot
     	 * @aggregation NULL
     	 * @description Group identifier of switch.
     	 * @since 6.0
     	 */
    	string switchGroupId = 25;
   	/**
     	 * @property snapshot
     	 * @aggregation NULL
     	 * @description Level 1 identifier of switch group.
     	 * @since 6.0
     	 */
    	string switchGroupLevelOneId = 26;
    	/**
     	 * @property snapshot
     	 * @aggregation NULL
     	 * @description Level 2 identifier of switch group.
     	 * @since 6.0
     	 */
    	string switchGroupLevelTwoId = 27;
    	/**
     	 * @property snapshot
     	 * @aggregation NULL
     	 * @description Radio
     	 * @since 6.1
     	 */
    	string radio = 28;
        /**
         * @property snapshot
         * @aggregation NULL
         * @description Rssi
         * @since 6.1
         */
        string rssi = 29;
        /**
         * @property snapshot
         * @aggregation NULL
         * @description Band
         * @since 6.1.1
         */
        string band = 30;
        /**
         * @property snapshot
         * @aggregation NULL
         * @description Channel
         * @since 6.1.1
         */
        string channel = 31;
        /**
         * @property snapshot
         * @aggregation NULL
         * @description rfband
         * @since 6.1.2
         */
        string rfband = 32;
}

message MessageEntry {
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Message key
	 * @since 3.5
	 */
	string key = 1;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Message content
	 * @since 3.5
	 */
	string value = 2;
}
