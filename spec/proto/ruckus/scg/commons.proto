edition = "2024";

package com.ruckuswireless.scg.protobuf.storage;

// Proto2-equivalent feature pins: these files were published by Ruckus as
// proto2; the pins keep wire format and semantics identical under edition 2024.
option features.enum_type = CLOSED;
option features.repeated_field_encoding = EXPANDED;
option features.utf8_validation = NONE;
option features.json_format = LEGACY_BEST_EFFORT;
option features.enforce_naming_style = STYLE_LEGACY;

/*
 * Common used message across all users.
 */

// for common used messages
message IdList {
    repeated string id = 1;
}

// for query related messages
message ListModel {
    int64 index = 1 [features.field_presence = LEGACY_REQUIRED];
    int64 size = 2 [features.field_presence = LEGACY_REQUIRED];
    extensions 1000 to max;
}

message QueryCriteria {
    repeated Filter filters = 1;
    repeated Filter extraFilters = 2;
    repeated Filter extraNotFilters = 3;
    repeated Filter matchFilters = 4;
    TimeRange extraTimeRange = 5;
    FullTextSearch fullTextSearch = 6;
    Sorter sorter = 7;
    Page page = 8;
    QueryScopeInfo queryScopeInfo = 9;
    repeated string attributes = 10;
}

message Filter {
    string type = 1 [features.field_presence = LEGACY_REQUIRED];
    string value = 2 [features.field_presence = LEGACY_REQUIRED];
}

message TimeRange {
    int64 start = 1;
    int64 end = 2;
    int64 interval = 3;
    string field = 4 [features.field_presence = LEGACY_REQUIRED];
}

message FullTextSearch {
    repeated string fields = 1;
    SearchType searchType = 2 [features.field_presence = LEGACY_REQUIRED];
    string text = 3 [features.field_presence = LEGACY_REQUIRED];
    MatchType matchType = 4;
}

enum MatchType {
    BEST_FIELDS = 1;
    MOST_FIELDS = 2;
    CROSS_FIELDS = 3;
    PHRASE = 4;
    PHRASE_PREFIX = 5;
}

enum SearchType {
    AND = 1;
    OR = 2;
}

message Sorter {
    Order order = 1 [features.field_presence = LEGACY_REQUIRED];
    string field = 2 [features.field_presence = LEGACY_REQUIRED];
}

enum Order {
    ASC = 1;
    DESC = 2;
}

message Page {
    int64 index = 1 [features.field_presence = LEGACY_REQUIRED];
    int64 size = 2 [features.field_presence = LEGACY_REQUIRED];
}

// RBAC related
message QueryScopeInfo {
    string targetResourceType = 1;
    repeated ScopeAndPermissions scopeAndPermissions = 2;
    repeated PermittedScopeAndResourceIds permittedScopeAndResourceIds = 3;
}

message PermittedScopeAndResourceIds {
    string groupType = 1 [features.field_presence = LEGACY_REQUIRED];
    repeated string resourceIds = 2;
}

message ScopeAndPermissions {
    ResourceScope resourceScope = 1 [features.field_presence = LEGACY_REQUIRED];
    repeated CategoryPermissions categoryPermissions = 2;
}

message ResourceScope {
    string tenantId = 1;
    string domainId = 2;
    string zoneId = 3;
}

// resourceType: "WLAN_CATEGORY", operationType: "FULL_ACCESS"
message CategoryPermissions {
    string resourceType = 1 [features.field_presence = LEGACY_REQUIRED];
    string operationType = 2 [features.field_presence = LEGACY_REQUIRED];
}

// Aggregation
enum AggregationType {
    AVG = 1;
    CARDINALITY = 2;
    COUNT = 3;
    HISTOGRAM = 4;
    MAX = 5;
    MIN = 6;
    SUM = 7;
    TERM = 8;
    DATE_HISTOGRAM = 9;
}

message AggregationRequest {
    QueryCriteria queryCriteria = 1 [features.field_presence = LEGACY_REQUIRED];
    Aggregation aggregation = 2 [features.field_presence = LEGACY_REQUIRED];
}

message Aggregation {
    string field = 1 [features.field_presence = LEGACY_REQUIRED];
    AggregationType type = 2 [features.field_presence = LEGACY_REQUIRED];
    // for date histogram aggregation
    int64 startTimestamp = 3;
    int64 endTimestamp = 4;
    int64 interval = 5;
    // for terms aggregation
    int32 size = 6;
    repeated SubAggregation subAggregations = 7;
}

message SubAggregation {
    string field = 1 [features.field_presence = LEGACY_REQUIRED];
    AggregationType type = 2 [features.field_presence = LEGACY_REQUIRED];
}

message AggregationResult {
    repeated AggregationBucket buckets = 1;
}

message AggregationBucket {
    string name = 1 [features.field_presence = LEGACY_REQUIRED];
    bool hasValue = 2 [features.field_presence = LEGACY_REQUIRED];
    string literalValue = 3;
    double numericValue = 4;
    repeated AggregationBucket subBuckets = 5;
}
