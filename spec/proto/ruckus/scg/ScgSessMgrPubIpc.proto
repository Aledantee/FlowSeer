enum GBP_SESSMGR_DPSK_OP_TYPE
{
   GBP_SESSMGR_DPSK_OP_TYPE_ADD = 1;
   GBP_SESSMGR_DPSK_OP_TYPE_MOD = 2; 
   GBP_SESSMGR_DPSK_OP_TYPE_DEL = 3;
   GBP_SESSMGR_DPSK_OP_TYPE_DEL_SHM = 4;
}

/**
 * @internal
 **/
enum GBP_SESSMGR_PUBS_DPSK_EXPIRATION_START_POINT 
{ 
    FROM_CREATION = 1; 
    FROM_FIRST_USE = 2; 
} 

/**
 * @internal
 **/
message GBP_SESSMGR_PUBS_DPSK_ENTRY
{
   GBP_SESSMGR_DPSK_OP_TYPE opType = 1;
   string key = 2; // uuid
   uint64 ueMac = 3;
   string dpsk = 4;
   string prevDpsk = 5;
   uint32 bounded = 6;
   uint32 vlanId = 7;
   uint32 wlanId = 8;
   string zoneId = 9;
   string tenantId = 10;
   string userRoleId = 11; 
   string utpId = 12;
   string userName = 13;
   GBP_SESSMGR_PUBS_DPSK_EXPIRATION_START_POINT expirationStartPoint = 14; 
   uint64 expirationStartTime = 15; // Creation time or first use time of this DPSK entry. epoch time in millisec. When FROM_FIRST_USE, filled in by SessManager. 
   uint64 ttl = 16; // Unit: Minutes; 0 means Never Expired. 
   uint32 maxDevice = 17; // For unbound case that one DPSK can be shared by multiple device.
   uint32 deviceCounting = 18; // For unbound case; indicate how many device is using this DPSK
   string pmk = 19;
}

/**
 * @internal
 **/
message GBP_SESSMGR_PUBS_MULTIPLE_DPSK_ENTRIES 
{ 
   repeated GBP_SESSMGR_PUBS_DPSK_ENTRY dpsks = 1; 
} 

