   uint64 ueMac = 3;
   string dpsk = 4;
   string prevDpsk = 5;
   uint32 vlanId = 6;
   uint32 wlanId = 7;
   string zoneId = 8;
   string tenantId = 9;
   string userRoleId = 10; 
   uint32 utpId = 11;  // 0~63 UTP ID
   string userName = 12;
   /**
    * @internal
    **/
   enum GBP_IDM_DPSK_EXPIRATION_START_POINT
   { 
       FROM_CREATION = 1; 
       FROM_FIRST_USE = 2; 
   } 
   GBP_IDM_DPSK_EXPIRATION_START_POINT expirationStartPoint = 13; 
   uint64 expirationStartTime = 14; // Creation time or first use time of this DPSK entry. epoch time in millisec. When FROM_FIRST_USE, filled in by SessManager. 
