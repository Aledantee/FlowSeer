option java_package = "com.ruckuswireless.scg.protobuf";

message ApHccdClientReportConnection {
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Client MAC address
   * @since 3.6
   */
  string client_mac = 1;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Timestamp for starting to record this client session
   * @since 3.6
   */
  uint64 timestamp = 2;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Client session connection status (success or failure)
   * @since 3.6
   */
  int32 connection_status = 3;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Message ID to indicate what failures step in whole connection
   * @since 3.6
   */
  int32 failed_msg_id = 4;
  /**
   * @property Serialization
   * @aggregation NULL
   * @description A sequence of message ID are recorded for this client session
   * @since 3.6
   */
  repeated int32 message_ids = 5;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description WLAN Id that is connected by client
   * @since 3.6
   */
  uint32 wlan_id = 6;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Radio Id that is connected by client
   * @since 3.6
   */
  uint32 radio_id = 7;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description SSID that is connected by client
   * @since 3.6
   */
  string ssid = 8;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Wlan type (open, WPA, etc) - not used now
   * @since 3.6
   */
  string wlanType = 9;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Client lastest frame SNR value - not used now
   * @since 3.6
   */
  float snr = 10;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Classify this failure client session belong to which failure case(auth, assoc, eap, radio, dhcp)
   * @since 3.6
   */
  int32 failure_type = 11;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Vlan ID is used by client
   * @since 3.6
   */
  int32 vlan = 12;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Reason code for deauth/disassoc frame
   * @since 3.6
   */
  int32 reason_code = 13;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Client session disconnection description
   * @since 3.6
   */
  string info = 14;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description the time is spent for this failure connection
   * @since 5.1.1
   */
  uint64 TTF = 15;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description a flag to indicate this connection session is roaming or new join
   * @since 5.1.1
   */
  int32 isRoaming = 16;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description CCD packet capture file name
   * @since 5.2
   */
  string pktCapName = 17;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description mld mac address of the MLO client
   * @since 7.1
   */
  string mld_addr = 18;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description add terminated reason for RAI
   * @since 7.1
   */
  int32 terminated_reason = 19;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description wlan encryption type
   * @since 7.2
   */
  string wlan_encryption = 20;
}

message ApHccdReportMessage {
  /**
   * @property snapshot
   * @aggregation NULL
   * @description AP HCCD version
   * @since 3.6
   */
  uint32 version = 1;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description AP MAC address
   * @since 3.6
   */
  string ap_mac = 2;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Timestamp to generate this stats report
   * @since 3.6
   */
  uint64 timestamp = 3;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Sequence number to identify this stats report
   * @since 3.6
   */
  uint64 seqNumber = 4;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Zone UUID
   * @since 3.6
   */
  string zone_id = 5;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description  AP gorup UUID
   * @since 3.6
   */
  string apgroup_id = 6;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Cluster UUID
   * @since 3.6
   */
  string cluster_id = 7;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Domain UUID
   * @since 3.6
   */
  string domain_id = 8;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description AP tenant UUID
   * @since 3.6
   */
  string aptenant_id = 9;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description MAP UUID
   * @since 3.6
   */
  string map_id = 10;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description AP device name
   * @since 3.6
   */
  string deviceName = 11;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description AP tenant name
   * @since 3.6
   */
  string aptenant_name = 12;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Zone name
   * @since 3.6
   */
  string zone_name = 13;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description AP group name
   * @since 3.6
   */
  string apgroup_name = 14;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Domain name
   * @since 3.6
   */
  string domain_name = 15;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Timestamp for generating this report
   * @since 3.6
   */
  uint64 sampleTime = 16;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Interval time for aggregrating stats data
   * @since 3.6
   */
  uint32 aggregationInterval = 17;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description AP IPv4 address
   * @since 3.6
   */
  string apIpAddress = 18;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description AP IPv6 address
   * @since 3.6
   */
  string apIpv6Address = 19;
  /**
   * @property Serialization
   * @aggregation NULL
   * @description serialization data for failure client session record
   * @since 3.6
   */
  repeated ApHccdClientReportConnection apHccdClients = 20 [(nanopb).type = FT_POINTER];
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Indicate AP all radio band deploy
   * @since 6.1
   */
  string apRadioDeploy = 21;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description ideal stats required for ACX APs
   * @since 6.1
   */
  AttributeMap ideal_stats_required = 22;
}
