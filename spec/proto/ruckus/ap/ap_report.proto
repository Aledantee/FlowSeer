   * @since 3.5
   */
  uint64 time = 2;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Bin start time. The start timestamp of each Bin. For example it is 00:00:00 in Bin1(00:00~00:15), and it is 00:15:00 in Bin2(00:15~00:30)...
