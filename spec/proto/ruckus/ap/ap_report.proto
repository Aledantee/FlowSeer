  /**
   * @property delta
   * @aggregation SUM
   * @description Client DNS RTT count (delta)
   * @since 7.1.2
   */
  uint32 dns_rtt_count_r = 83;

  /**
   * @property delta
   * @aggregation AVG
   * @description Client ARP RTT average in milliseconds (delta)
   * @since 7.1.2
   */
  uint32 arp_rtt_average_msec_r = 84;
  /**
   * @property delta
   * @aggregation SUM
   * @description Client ARP RTT count (delta)
   * @since 7.1.2
   */
  uint32 arp_rtt_count_r = 85;
  /**
   * @property delta
   * @aggregation SUM
   * @description PowerFlex histogram data for client-level performance stats
   * @since 7.1.2
   */
  PowerFlexHistogram powerflexHist = 86;
}

message HccdConnMessage {
  /**
   * @property snapshot
   * @aggregation NULL
   * @description the time for each message(packet) observed
   * @since 3.6
   */
  uint64 timestamp = 1;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description message identity for each packet
   * @since 3.6
   */
  int32 message_id = 2;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description message(packet) source module (like as client, AP, Cblade,...etc)
   * @since 3.6
   */
  int32 source = 3;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description message(packet) destination module
   * @since 3.6
   */
  int32 destination = 4;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description message status (success or failure)
   * @since 3.6
   */
  int32 status_code = 5;
}

message HccdClientConnection {
  /**
   * @property snapshot
   * @aggregation NULL
   * @description client mac for each connection
   * @since 3.6
   */
  string client_mac = 1;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description the time for each connection started
   * @since 3.6
   */
  uint64 timestamp = 2;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description this connection session status is success or failure
   * @since 3.6
   */
  int32 connection_status = 3;

  /* remove client_sm_map */

  /**
   * @property snapshot
   * @aggregation NULL
   * @description the failure message ID for this connection
   * @since 3.6
   */
  int32 failed_msg_id = 5;
  /**
   * @property Serialization
   * @aggregation NULL
   * @description serialization data for all of message ID in this client session
   * @since 3.6
   */
  repeated HccdConnMessage hccdConnMessages = 6;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description wlan_id for this client association
   * @since 3.6
   */
  uint32 wlan_id = 7;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description radio_id for this client association
   * @since 3.6
   */
  uint32 radio_id = 8;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description ssid for this client association
   * @since 3.6
   */
  string ssid = 9;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description wlan type are used on this wlan
   * @since 3.6
   */
  string wlanType = 10;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description client snr (not implemented yet)
   * @since 3.6
   */
  float snr = 11;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description what's category for this connection failure (auth/assoc/eap/radius/dhcp failure)
   * @since 3.6
   */
  int32 failure_type = 12;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description vlan ID value for this client
   * @since 3.6
   */
  int32 vlan = 13;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description disconnection reason code
   * @since 3.6
   */
  int32 reason_code = 14;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description disconnection reason
   * @since 3.6
   */
  string info = 15;
}

message APReportBin {
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Bin data number xxx. AP devides 24hours into 96 bins, ie 1 bin is 15 minutes. Bin1 time period is 00:00~00:15, Bin2 time period is 00:15~00:30 and so on. It is an number from 1~96. Then one can see the stats time period according to this value.
   * @since 3.5
   */
  int32 bin = 1 [features.field_presence = LEGACY_REQUIRED];
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Uptime in one report duration Example: AP boots up at 10:08, so the uptime_r is 420 seconds (10:15 - 10:08) in Bin(10:00~10:15).  If AP keeps work well, and now is 11:02, then uptime_r is 900 seconds in Bin(10:45~11:00)
   * @since 3.5
   */
  int32 uptime_r = 2;
}

