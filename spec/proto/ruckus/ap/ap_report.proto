message APReportPerDnsServer {
  /**
   * @property snapshot
   * @aggregation NULL
   * @description DNS IP address
   * @since 5.1.1
   */
  string ipAddress = 1;

  /**
   * @property snapshot
   * @aggregation NULL
   * @description DNS Request Counter
   * @since 5.1.1
   */
  uint64 req_cnt = 2;

  /**
   * @property snapshot
   * @aggregation NULL
   * @description DNS Response Counter
   * @since 5.1.1
   */
  uint64 resp_cnt = 3;
}

message APReportDnsStats {
  /**
   * @property snapshot
   * @aggregation NULL
   * @description DNS Server Count per wlan
   * @since 5.1.1
   */
  uint32 server_cnt = 1;

  /**
   * @property snapshot
   * @aggregation NULL
   * @description Per DNS Server Statistics
   * @since 5.1.1
   */
  repeated APReportPerDnsServer perDnsServer = 2;
}

message AuthFailReasonCnt {
  uint32 auth_fail_undefined = 1;
  uint32 auth_fail_tcm = 2;
  uint32 auth_fail_acl = 3;
  uint32 auth_fail_rssi_thr = 4;
}

message AssocFailReasonCnt {
