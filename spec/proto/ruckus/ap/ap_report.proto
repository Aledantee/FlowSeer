   * @since 3.5
   */
  string map_id = 16;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description AP tenant name.
   * @since 3.5
   */
  string aptenant_name = 17;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description Zone name.
   * @since 3.5
   */
  string zone_name = 18;
  /**
   * @property snapshot
   * @aggregation NULL
   * @description AP Group name
   * @since 3.5
