}

message EapFailReasonCnt {
  uint32 eap_fail_undefined = 1;
}

message RadiusFailReasonCnt {
  uint32 radius_fail_undefined = 1;
}

message DhcpFailReasonCnt {
  uint32 dhcp_fail_undefined = 1;
}

