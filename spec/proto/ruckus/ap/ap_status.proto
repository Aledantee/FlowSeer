message GeoLocation {
    enum GeoocationSource {
    	  NO_LOCATION = 0;
        MOBILE_APP = 1;
        GPS = 2;
        GEO_LOCATOR = 3;
    }
    enum HeightType {
    	  UNDEFINED = 0;
        AGL = 1;
        AMSL = 2;
    }
    float longitude = 1;
    float latitude = 2;
    float height = 3;
    float lateral_uncertainty = 4;
    float vertical_uncertainty=5;
    GeoocationSource source = 6;
    HeightType height_type = 7;
}

message AFCRespCfiEirp {
    uint32 opclass = 1 [features.field_presence = LEGACY_REQUIRED];
    uint32 cfi = 2 [features.field_presence = LEGACY_REQUIRED];
    uint32 eirp = 3 [features.field_presence = LEGACY_REQUIRED];
}

message AFCInfo {
    enum PowerMode{
    	  LOW_POWER = 0;
        STANDARD_POWER = 1;
    }
    enum AFCStatus{
        AFC_NOT_REQUIRED = 0;
        WAIT_FOR_LOCATION = 1;
        WAIT_FOR_RESPONSE = 2;
        AFC_SERVER_FAILURE = 3;
        REJECTED = 4;
        PASSED = 5;
    }
    GeoLocation geo_location = 1;
    PowerMode power_mode = 2;
    AFCStatus afc_status = 3;
    uint32 available_channel = 4;
    uint32 max_power_dbm = 5;
    uint32 min_power_dbm = 6;
    repeated uint32 available_channels = 7;
    repeated AFCRespCfiEirp resp_cfi_eirp = 8;
}

enum PowerMode {
	UNDEFINED = 0;
	LOW_POWER = 1;
	STANDARD_POWER = 2;
	VERY_LOW_POWER = 3;
}

message Radio6gInfo {
	PowerMode power_mode = 1;
}
