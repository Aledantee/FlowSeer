message APStatusTunnel {
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Application name
	 * @since 3.5
	 */
	string gw = 1;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Current tunnel index
	 * @since 3.5
	 */
	int32 index = 2;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Tunnel type
	 * @since 3.5
	 */
	int32 type = 3;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Current tunnel state (active or inactive)
	 * @since 3.5
	 */
	int32 isActive = 4;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Number of keepalive packets sent
	 * @since 3.5
	 */
	uint64 cICMP = 5;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Number of keepalive packets lost
	 * @since 3.5
	 */
	uint64 cNonICMP = 6;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Number of SoftGRE sessions terminated
	 * @since 3.5
	 */
	uint64 cDisconnect = 7;
	/**
	 * @property snapshot
	 * @aggregation SUM
	 * @description Total bytes received
	 * @since 3.5
	 */
	uint64 rxBytes = 8;
	/**
	 * @property snapshot
	 * @aggregation SUM
	 * @description Total packets received
	 * @since 3.5
	 */
	uint64 rxPkts = 9;
	/**
	 * @property snapshot
	 * @aggregation SUM
	 * @description No space in linux buffers. The AP received a frame completely, and AP has to allocate a memory for this frame. Then pass to next handler who interested to this frame. The AP drop the frame if it has no enough memory. The counter plus one if this case happen.
	 * @since 3.5
	 */
	uint64 rxDropPkts = 10;
	/**
	 * @property snapshot
	 * @aggregation SUM
	 * @description Number of bad packets received
	 * @since 3.5
	 */
	uint64 rxErrPkts = 11;
	/**
	 * @property snapshot
	 * @aggregation SUM
	 * @description Total bytes transmitted
	 * @since 3.5
	 */
	uint64 txBytes = 12;
	/**
	 * @property snapshot
	 * @aggregation SUM
	 * @description Total packets transmitted
	 * @since 3.5
	 */
	uint64 txPkts = 13;
	/**
	 * @property snapshot
	 * @aggregation SUM
	 * @description No space available in linux. AP has to allocate a memory to store the packet that AP plans to transmit to client. The AP may drop it if AP has no enough memory. Then the counter plus one.
	 * @since 3.5
	 */
	uint64 txDropPkts = 14;
	/**
	 * @property snapshot
	 * @aggregation SUM
	 * @description Packet transmit problems. The AP plans to transmiet packet to client. But somehow AP can't transmit to client successfully, and AP drops the packets at the end. Then the counter plus one.
	 * @since 3.5
	 */
	uint64 txErrPkts = 15;
	/**
	 * @property snapshot
	 * @aggregation SUM
	 * @description Total fragmented Tx packets
	 * @since 3.5
	 */
	uint64 txFragPkts = 16;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Tunnel uptime
	 * @since 5.1.1
	 */
    	string uptime = 17;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Number of tunnel reestablishment
	 * @since 5.1.1
	 */
    	uint64 reEstablishment = 18;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Keep alive retry count
	 * @since 5.1.1
	 */
    	uint64 kaRetryCnt = 19;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Number of keep alive sent
	 * @since 5.1.1
	 */
    	uint64 kaSentCnt = 20;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Number of keep alive lost
	 * @since 5.1.1
	 */
    	uint64 kaLostCnt = 21;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Reason for last re-connection
	 * @since 5.1.1
	 */
    	string reason = 22;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Suggestion for last connect fail
	 * @since 5.1.1
	 */
    	string suggest = 23;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description DP key
	 * @since 5.2.1
	 */
    	string dpKey = 24;
}

message APStatusIPSecStats {
	enum IPsecTunnelType {
		/**
		 * @description Tunnel type possible value
		 * @since 6.1.2
		 */
		RUCKUSGRE = 0;
		/**
		 * @description Tunnel type possible value
		 * @since 6.1.2
		 */
		SOFTGRE = 1;
	}
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Session time
	 * @since 3.5
	 */
	uint64 ipsecSessionTime = 1;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Total packets transmitted
	 * @since 3.5
	 */
	uint64 ipsecTxPkts = 2;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Total packets received
	 * @since 3.5
	 */
	uint64 ipsecRxPkts = 3;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Total bytes transmitted
	 * @since 3.5
	 */
	uint64 ipsecTxBytes = 4;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Total bytes received
	 * @since 3.5
	 */
	uint64 ipsecRxBytes = 5;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Total Tx packets dropped
	 * @since 3.5
	 */
	uint64 ipsecTxDropPkts = 6;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Total Rx packets dropped
	 * @since 3.5
	 */
	uint64 ipsecRxDropPkts = 7;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Tx idle time
	 * @since 3.5
	 */
	uint64 ipsecTxIdleTime = 8;
	/**
	 * @property snapshot
	 * @aggregation MAX
	 * @description Rx idle time
	 * @since 3.5
	 */
	uint64 ipsecRxIdleTime = 9;
	/**
	 * @property snapshot
	 * @aggregation NULL
	 * @description Tunnel type
	 * @since 6.1.2
	 */
	IPsecTunnelType ipsecTunnelType = 10;
}

