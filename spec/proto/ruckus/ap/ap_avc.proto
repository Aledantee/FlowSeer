     * @since 3.5
     */
    string domain_id = 7;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description AP tenant identifier
     * @since 3.5
     */
    string aptenant_id = 8;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description MAP identifier
     * @since 3.5
     */
    string map_id = 9;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description AP tenant name
     * @since 3.5
     */
    string aptenant_name = 10;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Zone name
     * @since 3.5
     */
    string zone_name = 11;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description AP group name
     * @since 3.5
     */
    string apgroup_name = 12;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Domain name
     * @since 3.5
     */
    string domain_name = 13;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description AVC data sampling timestamp
     * @since 3.5
     */
    uint64 sampleTime = 14;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Stats aggregation interval
     * @since 3.5
     */
    uint32 aggregationInterval = 15;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description AP MAC address
     * @since 3.5
     */
