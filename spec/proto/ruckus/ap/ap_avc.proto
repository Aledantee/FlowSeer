    /**
     * @property snapshot
     * @aggregation NULL
     * @description Page Download Time 
     * @since 6.1.1
     */
    float page_download_time = 4;
}

message ApplicationData {
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Application identifier 
     * @since 6.1.1
     */
    uint32 app_id = 1 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Server Information 
     * @since 6.1.1
     */
    repeated ServerInfo server_info = 2 [(nanopb).type = FT_POINTER];
}

message ClientInfo {
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Client IP address 
     * @since 6.1.1
     */
    string client_ip = 1 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property snapshot
     * @aggregation NULL
