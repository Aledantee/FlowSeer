import "ruckus/nanopb/nanopb.proto";

message FlowMessage {
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Application name
     * @since 3.5
     */
    string app = 1 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Application destination port number
     * @since 3.5
     */
    uint32 port = 2 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Destination MAC address
     * @since 3.5
     */
    string client_mac = 3 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property snapshot
     * @aggregation NULL
     * @description AP MAC address
     * @since 3.5
     */
    string ap_mac = 4 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WLAN SSID
     * @since 3.5
     */
    string ssid = 5 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property delta
     * @aggregation SUM
     * @description Rx bytes for this application
     * @since 3.5
     */
    uint64 uplink = 6 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property delta
     * @aggregation SUM
     * @description Tx bytes for this application
     * @since 3.5
     */
    uint64 downlink = 7 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property delta
     * @aggregation SUM
     * @description Tx + rx bytes for the application
     * @since 3.5
     */
    uint64 total = 8 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Application category
     * @since 3.5
     */
    string category = 9;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WLAN group identifier
     * @since 3.5
     */
    string wlangroup_id = 10;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WSG WLAN identifier 
     * @since 3.5
     */
    uint32 wsgwlan_id = 11;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WLAN tenant identifier
     * @since 3.5
     */
    string wlantenant_id = 12;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Radio mode for the radio interface
     * @since 3.5
     */
    uint32 apradiotype_id = 13;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WLAN group name
     * @since 3.5
     */
    string wlangroup_name = 14;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WLAN tenant name
     * @since 3.5
     */
    string wlantenant_name = 15;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WLAN radio id
     * @since 3.5
     */
    uint32 radio_id = 16;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Clients IPv4 address
     * @since 3.5
     */
    string client_ipv4 = 17;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Clients IPv6 Address
     * @since 3.5.1
     */
    string client_ipv6 = 18;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Clients host name
     * @since 3.5
     */
    string client_hostname = 19;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description App_Id
     * @since 7.0
     */
    uint32 app_id = 20;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description MLD MAC address for MLO clients
     * @since 7.2
     */
    string mld_mac = 21;
}

message UrlFilteringMsg {
    enum Action {
        /**
         * @description Web Reputation action value Allow
         * @since 6.1
        */
        Allow = 1;
        /**
         * @description Web Reputation action value Block
         * @since 6.1
        */
        Block = 2;
    }
    /**
     * @property snapshot
     * @aggregation NULL
     * @description client access URL
     * @since 3.6
     */
    string url = 1;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description URL's category ID
     * @since 3.6
     */
    uint32 cat_id = 2;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description URL's category Name
     * @since 3.6
     */
    string cat_name = 3;
    /**
     * @property snapshot
     * @aggregation SUM
     * @description Count number of client access the URL
     * @since 3.6
     */
    uint32 num_hits = 4;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Clients mac address
     * @since 3.6
     */
    string client_mac = 5;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description AP mac address
     * avoid using this. Use the outside apMac
     * kept for backward compatibility
     * @since 3.6
     */
    string ap_mac = 6;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description wlan SSID where clients is connected
     * @since 3.6
     */
    string ssid = 7;
    /**
     * @property delta
     * @aggregation SUM
     * @description uplink bytes sent from client
     * @since 3.6
     */
    uint64 uplink = 8;
    /**
     * @property delta
     * @aggregation SUM
     * @description Downlink bytes received by client
     * @since 3.6
     */
    uint64 downlink = 9;
    /**
     * @property delta
     * @aggregation SUM
     * @description Total of sent and received bytes by the client 
     * @since 3.6
     */
    uint64 total = 10;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WLAN group identifier 
     * @since 3.6
     */
    string wlangroup_id = 11;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WSG WLAN identifier 
     * @since 3.6
     */
    uint32 wsgwlan_id = 12;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WLAN tenant identifier 
     * @since 3.6
     */
    string wlantenant_id = 13;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description radio mode of the radio interface 
     * @since 3.6
     */
    uint32 apradiotype_id = 14;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WLAN group name 
     * @since 3.6
     */
    string wlangroup_name = 15;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description WLAN tenant name 
     * @since 3.6
     */
    string wlantenant_name = 16;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description radio interface identifier 
     * @since 3.6
     */
    uint32 radio_id = 17;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Clients IPv4 address 
     * @since 3.6
     */
    string client_ipv4 = 18;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Clients IPv6 address 
     * @since 3.6
     */
    string client_ipv6 = 19;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Clients hostname 
     * @since 3.6
     */
    string client_hostname = 20;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description URL Filtering session start timestamp 
     * @since 5.1.1
     */
    uint64 session_start = 21;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description URL Filtering session start timestamp 
     * @since 5.1.1
     */
    uint64 session_stop = 22;

    /**
     * @property snapshot
     * @aggregation NULL
     * @description URL's web reputation score
     * @since 6.1
     */
    uint32 web_reputation_score = 23;
    /**
     * @property snapshot
     * @aggregation SUM
     * @description Web reputation Action of the URL
     * @since 6.1
     */
    Action web_reputation_action = 24;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description MLD MAC address for MLO clients
     * @since 7.2
     */
    string mld_mac = 25;
}
    
/**
    * Accumulated call quality score histogram within a report interval
    * @since 5.2
    */
message WFCCallQualityMsg
{
    /* Epoch timestamp in miliseconds */ 
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Epoch timestamp in milisecond
     * @since 5.2
     */
    uint64 timestamp = 1;

    /* Call Quality Score. 
     * Range [1 - 100]. Lower the value, better call quality 
     */
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Accumulated call quality score histogram within a report interval
     * @since 5.2
     */
    uint32 score = 2;
}

