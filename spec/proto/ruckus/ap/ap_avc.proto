message ServerInfo {
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Server IP address
     * @since 6.1.1
     */
    string server_ip = 1 [features.field_presence = LEGACY_REQUIRED];
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Lan latency 
     * @since 6.1.1
     */
    float lan_latency = 2;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Wan latency
     * @since 6.1.1
     */
