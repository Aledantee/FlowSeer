message ApplicationMetrics {
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Client information contains App data 
     * @since 6.1.1
     */
    repeated ClientInfo client_info = 1 [(nanopb).type = FT_POINTER];
}

message ArcMessage {
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Arc data verion number
     * @since 3.5
     */
