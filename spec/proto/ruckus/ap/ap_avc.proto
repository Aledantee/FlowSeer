    /**
     * @property snapshot
     * @aggregation NULL
     * @description Indicate AP all radio band deploy
     * @since 6.1
     */
     string apRadioDeploy = 19;
    /**
     * @property snapshot
     * @aggregation NULL
     * @description Application QOE score
     * @since 6.1.1
     */
     ApplicationMetrics app_metrics = 20;
}
