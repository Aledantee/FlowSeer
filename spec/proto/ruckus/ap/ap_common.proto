option java_package = "com.ruckuswireless.scg.protobuf";

message AttributeMap {
  repeated AttributeEntry map_entries = 1;
}

message AttributeMapWlan {
  repeated AttributeEntry map_entries = 1;
}

message AttributeEntry {
  string key = 1;

  string value = 2;
}
