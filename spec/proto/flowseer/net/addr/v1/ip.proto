edition = "2024";

package flowseer.net.addr.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

// A Differentiated Services Code Point from the six-bit IPv4 DS field or
// IPv6 Traffic Class field. Integers map directly to RFC 2474 code points;
// unnamed values from 0 through 63 remain meaningful registry values. Zero
// is a real registry value, so consumers must check field presence before
// reading a generated getter.
enum IpDscp {
  // Best Effort / Class Selector 0.
  IP_DSCP_CS0 = 0;
  // Lower Effort per-Hop Behavior.
  IP_DSCP_LE = 1;
  // Class Selector 1.
  IP_DSCP_CS1 = 8;
  // Assured Forwarding class 1, low drop precedence.
  IP_DSCP_AF11 = 10;
  // Assured Forwarding class 1, medium drop precedence.
  IP_DSCP_AF12 = 12;
  // Assured Forwarding class 1, high drop precedence.
  IP_DSCP_AF13 = 14;
  // Class Selector 2.
  IP_DSCP_CS2 = 16;
  // Assured Forwarding class 2, low drop precedence.
  IP_DSCP_AF21 = 18;
  // Assured Forwarding class 2, medium drop precedence.
  IP_DSCP_AF22 = 20;
  // Assured Forwarding class 2, high drop precedence.
  IP_DSCP_AF23 = 22;
  // Class Selector 3.
  IP_DSCP_CS3 = 24;
  // Assured Forwarding class 3, low drop precedence.
  IP_DSCP_AF31 = 26;
  // Assured Forwarding class 3, medium drop precedence.
  IP_DSCP_AF32 = 28;
  // Assured Forwarding class 3, high drop precedence.
  IP_DSCP_AF33 = 30;
  // Class Selector 4.
  IP_DSCP_CS4 = 32;
  // Assured Forwarding class 4, low drop precedence.
  IP_DSCP_AF41 = 34;
  // Assured Forwarding class 4, medium drop precedence.
  IP_DSCP_AF42 = 36;
  // Assured Forwarding class 4, high drop precedence.
  IP_DSCP_AF43 = 38;
  // Class Selector 5.
  IP_DSCP_CS5 = 40;
  // Voice-Admit traffic.
  IP_DSCP_VOICE_ADMIT = 44;
  // Non-Queue-Building per-Hop Behavior.
  IP_DSCP_NQB = 45;
  // Expedited Forwarding traffic.
  IP_DSCP_EF = 46;
  // Class Selector 6.
  IP_DSCP_CS6 = 48;
  // Class Selector 7.
  IP_DSCP_CS7 = 56;
}

// The Explicit Congestion Notification bits from the IPv4 DS field or IPv6
// Traffic Class field. Integers map directly to the RFC 3168 bit patterns.
// Zero is a real registry value, so consumers must check field presence before
// reading a generated getter.
enum IpEcn {
  // Endpoints are not using ECN (binary 00).
  IP_ECN_NON_ECT = 0;
  // ECN-Capable Transport, code point 1 (binary 01); available for
  // experimental use under RFC 8311.
  IP_ECN_ECT_ONE = 1;
  // ECN-Capable Transport, code point 0 (binary 10).
  IP_ECN_ECT_ZERO = 2;
  // Congestion Experienced (binary 11).
  IP_ECN_CE = 3;
}

// The payload protocol of an IP datagram. Integers map directly to the IANA
// Assigned Internet Protocol Numbers registry; unnamed values remain valid.
// Zero is a real registry value, so consumers must check field presence before
// reading a generated getter.
enum IpProtocol {
  // IPv6 Hop-by-Hop Option.
  IP_PROTOCOL_HOPOPT = 0;
  // Internet Control Message Protocol for IPv4.
  IP_PROTOCOL_ICMP = 1;
  // Internet Group Management Protocol.
  IP_PROTOCOL_IGMP = 2;
  // IPv4 encapsulation. The IANA registry keyword for value 4 is IPv4;
  // IPIP is a distinct assignment at value 94.
  IP_PROTOCOL_IPV4 = 4;
  // Transmission Control Protocol.
  IP_PROTOCOL_TCP = 6;
  // User Datagram Protocol.
  IP_PROTOCOL_UDP = 17;
  // IPv6 encapsulation.
  IP_PROTOCOL_IPV6_ENCAP = 41;
  // Generic Routing Encapsulation.
  IP_PROTOCOL_GRE = 47;
  // Encapsulating Security Payload.
  IP_PROTOCOL_ESP = 50;
  // Authentication Header.
  IP_PROTOCOL_AH = 51;
  // Internet Control Message Protocol for IPv6.
  IP_PROTOCOL_ICMPV6 = 58;
  // Open Shortest Path First.
  IP_PROTOCOL_OSPF = 89;
  // Stream Control Transmission Protocol.
  IP_PROTOCOL_SCTP = 132;
}

// A coarse FlowSeer classification of an IP address. This combines address
// kinds such as loopback and multicast with common topology scopes; it is not
// the family-specific scope field defined by an IP wire protocol.
enum IpScope {
  // The scope is absent or has not been classified.
  IP_SCOPE_UNSPECIFIED = 0;
  // The address remains on the local host.
  IP_SCOPE_LOOPBACK = 1;
  // The address remains on one link.
  IP_SCOPE_LINK_LOCAL = 2;
  // The address is routable within an administrative domain but not globally.
  IP_SCOPE_UNIQUE_LOCAL = 3;
  // The address is globally routable.
  IP_SCOPE_GLOBAL = 4;
  // The address identifies a multicast group.
  IP_SCOPE_MULTICAST = 5;
}

// An IP address family without a concrete address. Integers map directly to
// the IANA Address Family Numbers registry.
enum IpVersion {
  // IANA address family 0 is reserved; absence is preferred when no family
  // was observed.
  IP_VERSION_UNSPECIFIED = 0;
  // IPv4, IANA address family 1.
  IP_VERSION_V4 = 1;
  // IPv6, IANA address family 2.
  IP_VERSION_V6 = 2;
}

// An IPv4 address.
message Ipv4Address {
  // The 4 address octets in network byte order. Absent is invalid; omit the
  // containing field instead.
  bytes octets = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 4
  ];
}

// An IPv6 address. There is no zone field: a link-local address is scoped by
// the interface column of whichever table carries it.
message Ipv6Address {
  // The 16 address octets in network byte order. Absent is invalid; omit the
  // containing field instead.
  bytes octets = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 16
  ];
}

// An IP address of either family. The arm is the family: consumers switch on
// it rather than inferring it from a payload length.
message IpAddress {
  oneof family {
    option (buf.validate.oneof).required = true;

    Ipv4Address v4 = 1;
    Ipv6Address v6 = 2;
  }
}

// A canonical IPv4 network prefix. Every host bit beyond the prefix length is
// zero.
message Ipv4Prefix {
  reserved 3;

  // Hex formatting preserves network bit order while exposing boundary
  // nibbles to CEL, which cannot index bytes directly.
  option (buf.validate.message).cel = {
    id: "ipv4_prefix.masked"
    message: "address must have zero host bits beyond length"
    expression:
      "!has(this.address) || !has(this.length) || "
      "!has(this.address.octets) || this.address.octets.size() != 4 || this.length > 32u || "
      "("
      "'%x'.format([this.address.octets]).substring(int((this.length + 3u) / 4u)).matches('^0*$') && "
      "("
      "this.length % 4u == 0u || "
      "this.length % 4u == 1u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[08]$') || "
      "this.length % 4u == 2u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[048c]$') || "
      "this.length % 4u == 3u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[02468ace]$')"
      ")"
      ")"
  };

  // The masked network address. It must be present.
  Ipv4Address address = 1 [(buf.validate.field).required = true];
  // The prefix length in bits. It must be present; zero denotes the default
  // route.
  uint32 length = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 32
  ];
}

// A canonical IPv6 network prefix. Every host bit beyond the prefix length is
// zero.
message Ipv6Prefix {
  reserved 3;

  // Hex formatting preserves network bit order while exposing boundary
  // nibbles to CEL, which cannot index bytes directly.
  option (buf.validate.message).cel = {
    id: "ipv6_prefix.masked"
    message: "address must have zero host bits beyond length"
    expression:
      "!has(this.address) || !has(this.length) || "
      "!has(this.address.octets) || this.address.octets.size() != 16 || this.length > 128u || "
      "("
      "'%x'.format([this.address.octets]).substring(int((this.length + 3u) / 4u)).matches('^0*$') && "
      "("
      "this.length % 4u == 0u || "
      "this.length % 4u == 1u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[08]$') || "
      "this.length % 4u == 2u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[048c]$') || "
      "this.length % 4u == 3u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[02468ace]$')"
      ")"
      ")"
  };

  // The masked network address. It must be present.
  Ipv6Address address = 1 [(buf.validate.field).required = true];
  // The prefix length in bits. It must be present; zero denotes the default
  // route.
  uint32 length = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 128
  ];
}

// A canonical IP network prefix of either family. Each arm bounds its own
// length and requires every host bit to be zero.
message IpPrefix {
  oneof family {
    option (buf.validate.oneof).required = true;

    Ipv4Prefix v4 = 1;
    Ipv6Prefix v6 = 2;
  }
}

// An inclusive range of IPv4 addresses. Start must not follow end.
message Ipv4Range {
  option (buf.validate.message).cel = {
    id: "ipv4_range.start_le_end"
    message: "start must not follow end"
    expression: "!has(this.start) || !has(this.end) || this.start.octets <= this.end.octets"
  };

  // The inclusive lower bound. Absent is invalid; omit the containing field
  // instead.
  Ipv4Address start = 1 [(buf.validate.field).required = true];
  // The inclusive upper bound. Absent is invalid; omit the containing field
  // instead.
  Ipv4Address end = 2 [(buf.validate.field).required = true];
}

// An inclusive range of IPv6 addresses. Start must not follow end.
message Ipv6Range {
  option (buf.validate.message).cel = {
    id: "ipv6_range.start_le_end"
    message: "start must not follow end"
    expression: "!has(this.start) || !has(this.end) || this.start.octets <= this.end.octets"
  };

  // The inclusive lower bound. Absent is invalid; omit the containing field
  // instead.
  Ipv6Address start = 1 [(buf.validate.field).required = true];
  // The inclusive upper bound. Absent is invalid; omit the containing field
  // instead.
  Ipv6Address end = 2 [(buf.validate.field).required = true];
}

// An inclusive IP address range. The arm makes a mixed-family range
// unrepresentable.
message IpRange {
  oneof family {
    option (buf.validate.oneof).required = true;

    Ipv4Range v4 = 1;
    Ipv6Range v6 = 2;
  }
}

// The preferred and valid lifetimes of an address acquired through SLAAC or
// DHCP. A present duration is an unsigned 32-bit whole-second protocol value;
// the reserved 0xffffffff sentinel maps to absence and means infinite.
// An empty message therefore means both lifetimes are infinite; omit the
// containing IpLifetime field when no lifetime was observed. A protocol with
// only one finite lease duration sets both fields to that duration.
message IpLifetime {
  option (buf.validate.message).cel = {
    id: "ip_lifetime.preferred_le_valid"
    message: "preferred lifetime must not exceed valid lifetime"
    expression: "!has(this.valid) || (has(this.preferred) && this.preferred <= this.valid)"
  };

  // The preferred-use duration. Once elapsed, the address is deprecated but
  // remains usable by existing flows. Absent means infinite.
  google.protobuf.Duration preferred = 1 [
    (buf.validate.field).duration.gte = {seconds: 0},
    (buf.validate.field).duration.lte = {seconds: 4294967294},
    (buf.validate.field).cel = {
      id: "ip_lifetime.preferred_whole_seconds"
      message: "preferred lifetime must be a whole number of seconds"
      expression: "this == duration(string(this.getSeconds()) + 's')"
    }
  ];
  // The duration until the address becomes invalid and is removed. Absent
  // means infinite.
  google.protobuf.Duration valid = 2 [
    (buf.validate.field).duration.gte = {seconds: 0},
    (buf.validate.field).duration.lte = {seconds: 4294967294},
    (buf.validate.field).cel = {
      id: "ip_lifetime.valid_whole_seconds"
      message: "valid lifetime must be a whole number of seconds"
      expression: "this == duration(string(this.getSeconds()) + 's')"
    }
  ];
}
