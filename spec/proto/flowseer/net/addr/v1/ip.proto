edition = "2024";

package flowseer.net.addr.v1;

import "google/protobuf/duration.proto";
import option "buf/validate/validate.proto";

// A coarse FlowSeer classification of an IP address. This combines address
// kinds such as loopback and multicast with common topology scopes; it is not
// the family-specific scope field defined by an IP wire protocol. The values
// are FlowSeer-normalized, not assignments from any external registry.
enum IpScope {
  // The scope is absent or has not been classified.
  IP_SCOPE_UNSPECIFIED = 0;
  // The address remains on the local host.
  IP_SCOPE_LOOPBACK = 1;
  // The address remains on one link.
  IP_SCOPE_LINK_LOCAL = 2;
  // The address is routable within an administrative domain but not globally.
  IP_SCOPE_UNIQUE_LOCAL = 3;
  // The address is globally routable.
  IP_SCOPE_GLOBAL = 4;
  // The address identifies a multicast group.
  IP_SCOPE_MULTICAST = 5;
}

// An IP address family without a concrete address. Integers map directly to
// the IANA Address Family Numbers registry. See
// https://www.iana.org/assignments/address-family-numbers.
enum IpVersion {
  // Address family number 0 is reserved; absence is preferred when no
  // family was observed.
  IP_VERSION_UNSPECIFIED = 0;
  // IPv4, address family number 1.
  IP_VERSION_V4 = 1;
  // IPv6, address family number 2.
  IP_VERSION_V6 = 2;
}

// An IPv4 address.
message Ipv4Address {
  // The 4 address octets in network byte order. Must be present; omit the
  // containing field instead.
  bytes octets = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 4
  ];
}

// An IPv6 address. There is no zone field: a link-local address is scoped by
// the interface column of whichever table carries it.
message Ipv6Address {
  // The 16 address octets in network byte order. Must be present; omit the
  // containing field instead.
  bytes octets = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 16
  ];
}

// An IP address of either family. The arm is the family: consumers switch on
// it rather than inferring it from a payload length.
message IpAddress {
  oneof family {
    option (buf.validate.oneof).required = true;

    Ipv4Address v4 = 1;
    Ipv6Address v6 = 2;
  }
}

// A canonical IPv4 network prefix. Every host bit beyond the prefix length is
// zero.
message Ipv4Prefix {
  // Hex formatting preserves network bit order while exposing boundary
  // nibbles to CEL, which cannot index bytes directly.
  option (buf.validate.message).cel = {
    id: "ipv4_prefix.masked"
    message: "address must have zero host bits beyond length"
    expression:
      "!has(this.address) || !has(this.length) || "
      "!has(this.address.octets) || this.address.octets.size() != 4 || this.length > 32u || "
      "("
      "'%x'.format([this.address.octets]).substring(int((this.length + 3u) / 4u)).matches('^0*$') && "
      "("
      "this.length % 4u == 0u || "
      "this.length % 4u == 1u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[08]$') || "
      "this.length % 4u == 2u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[048c]$') || "
      "this.length % 4u == 3u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[02468ace]$')"
      ")"
      ")"
  };

  // The masked network address. It must be present.
  Ipv4Address address = 1 [(buf.validate.field).required = true];
  // The prefix length in bits. It must be present; zero denotes the default
  // route.
  uint32 length = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 32
  ];
}

// A canonical IPv6 network prefix. Every host bit beyond the prefix length is
// zero.
message Ipv6Prefix {
  // Hex formatting preserves network bit order while exposing boundary
  // nibbles to CEL, which cannot index bytes directly.
  option (buf.validate.message).cel = {
    id: "ipv6_prefix.masked"
    message: "address must have zero host bits beyond length"
    expression:
      "!has(this.address) || !has(this.length) || "
      "!has(this.address.octets) || this.address.octets.size() != 16 || this.length > 128u || "
      "("
      "'%x'.format([this.address.octets]).substring(int((this.length + 3u) / 4u)).matches('^0*$') && "
      "("
      "this.length % 4u == 0u || "
      "this.length % 4u == 1u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[08]$') || "
      "this.length % 4u == 2u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[048c]$') || "
      "this.length % 4u == 3u && '%x'.format([this.address.octets]).substring(int(this.length / 4u), int(this.length / 4u + 1u)).matches('^[02468ace]$')"
      ")"
      ")"
  };

  // The masked network address. It must be present.
  Ipv6Address address = 1 [(buf.validate.field).required = true];
  // The prefix length in bits. It must be present; zero denotes the default
  // route.
  uint32 length = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 128
  ];
}

// A canonical IP network prefix of either family. Each arm bounds its own
// length and requires every host bit to be zero.
message IpPrefix {
  oneof family {
    option (buf.validate.oneof).required = true;

    Ipv4Prefix v4 = 1;
    Ipv6Prefix v6 = 2;
  }
}

// An inclusive range of IPv4 addresses. Start must not follow end.
message Ipv4Range {
  option (buf.validate.message).cel = {
    id: "ipv4_range.start_le_end"
    message: "start must not follow end"
    expression: "!has(this.start) || !has(this.end) || this.start.octets <= this.end.octets"
  };

  // The inclusive lower bound. Must be present; omit the containing field
  // instead.
  Ipv4Address start = 1 [(buf.validate.field).required = true];
  // The inclusive upper bound. Must be present; omit the containing field
  // instead.
  Ipv4Address end = 2 [(buf.validate.field).required = true];
}

// An inclusive range of IPv6 addresses. Start must not follow end.
message Ipv6Range {
  option (buf.validate.message).cel = {
    id: "ipv6_range.start_le_end"
    message: "start must not follow end"
    expression: "!has(this.start) || !has(this.end) || this.start.octets <= this.end.octets"
  };

  // The inclusive lower bound. Must be present; omit the containing field
  // instead.
  Ipv6Address start = 1 [(buf.validate.field).required = true];
  // The inclusive upper bound. Must be present; omit the containing field
  // instead.
  Ipv6Address end = 2 [(buf.validate.field).required = true];
}

// An inclusive IP address range. The arm makes a mixed-family range
// unrepresentable.
message IpRange {
  oneof family {
    option (buf.validate.oneof).required = true;

    Ipv4Range v4 = 1;
    Ipv6Range v6 = 2;
  }
}

// The preferred and valid lifetimes of an address acquired through SLAAC or
// DHCP. A present duration is an unsigned 32-bit whole-second protocol value;
// the reserved 0xffffffff sentinel maps to absence and means infinite, as in
// RFC 4861 section 4.6.2
// (https://www.rfc-editor.org/rfc/rfc4861.html#section-4.6.2) and RFC 8415
// section 7.7 (https://www.rfc-editor.org/rfc/rfc8415.html#section-7.7).
// An empty message therefore means both lifetimes are infinite; omit the
// containing IpLifetime field when no lifetime was observed. A protocol with
// only one finite lease duration sets both fields to that duration.
message IpLifetime {
  option (buf.validate.message).cel = {
    id: "ip_lifetime.preferred_le_valid"
    message: "preferred lifetime must not exceed valid lifetime"
    expression: "!has(this.valid) || (has(this.preferred) && this.preferred <= this.valid)"
  };

  // The preferred-use duration. Once elapsed, the address is deprecated but
  // remains usable by existing flows. Absent means infinite.
  google.protobuf.Duration preferred = 1 [
    (buf.validate.field).duration.gte = {seconds: 0},
    (buf.validate.field).duration.lte = {seconds: 4294967294},
    (buf.validate.field).cel = {
      id: "ip_lifetime.preferred_whole_seconds"
      message: "preferred lifetime must be a whole number of seconds"
      expression: "this == duration(string(this.getSeconds()) + 's')"
    }
  ];
  // The duration until the address becomes invalid and is removed. Absent
  // means infinite.
  google.protobuf.Duration valid = 2 [
    (buf.validate.field).duration.gte = {seconds: 0},
    (buf.validate.field).duration.lte = {seconds: 4294967294},
    (buf.validate.field).cel = {
      id: "ip_lifetime.valid_whole_seconds"
      message: "valid lifetime must be a whole number of seconds"
      expression: "this == duration(string(this.getSeconds()) + 's')"
    }
  ];
}
