edition = "2024";

package flowseer.net.addr.v1;

import "buf/validate/validate.proto";
import "flowseer/net/addr/v1/ipv4_address.proto";
import "flowseer/net/addr/v1/ipv6_address.proto";

// An IP address of either family. The arm is the family: consumers switch on
// it rather than inferring it from a payload length.
message IpAddress {
  oneof family {
    option (buf.validate.oneof).required = true;

    Ipv4Address v4 = 1;
    Ipv6Address v6 = 2;
  }
}
