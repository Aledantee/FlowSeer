edition = "2024";

package flowseer.net.protocol.dhcp.v1;

// DHCPv4 message types (RFC 2132 §9.6, RFC 3203, RFC 4388, RFC 6926, RFC 7724).
enum Dhcpv4MessageType {
  DHCPV4_MESSAGE_TYPE_UNSPECIFIED = 0;
  // DHCPDISCOVER (RFC 2132).
  DHCPV4_MESSAGE_TYPE_DISCOVER = 1;
  // DHCPOFFER (RFC 2132).
  DHCPV4_MESSAGE_TYPE_OFFER = 2;
  // DHCPREQUEST (RFC 2132).
  DHCPV4_MESSAGE_TYPE_REQUEST = 3;
  // DHCPDECLINE (RFC 2132).
  DHCPV4_MESSAGE_TYPE_DECLINE = 4;
  // DHCPACK (RFC 2132).
  DHCPV4_MESSAGE_TYPE_ACK = 5;
  // DHCPNAK (RFC 2132).
  DHCPV4_MESSAGE_TYPE_NAK = 6;
  // DHCPRELEASE (RFC 2132).
  DHCPV4_MESSAGE_TYPE_RELEASE = 7;
  // DHCPINFORM (RFC 2132).
  DHCPV4_MESSAGE_TYPE_INFORM = 8;
  // DHCPFORCERENEW (RFC 3203).
  DHCPV4_MESSAGE_TYPE_FORCERENEW = 9;
  // DHCPLEASEQUERY (RFC 4388).
  DHCPV4_MESSAGE_TYPE_LEASEQUERY = 10;
  // DHCPLEASEUNASSIGNED (RFC 4388).
  DHCPV4_MESSAGE_TYPE_LEASEUNASSIGNED = 11;
  // DHCPLEASEUNKNOWN (RFC 4388).
  DHCPV4_MESSAGE_TYPE_LEASEUNKNOWN = 12;
  // DHCPLEASEACTIVE (RFC 4388).
  DHCPV4_MESSAGE_TYPE_LEASEACTIVE = 13;
  // DHCPBULKLEASEQUERY (RFC 6926).
  DHCPV4_MESSAGE_TYPE_BULKLEASEQUERY = 14;
  // DHCPLEASEQUERYDONE (RFC 6926).
  DHCPV4_MESSAGE_TYPE_LEASEQUERYDONE = 15;
  // DHCPACTIVELEASEQUERY (RFC 7724).
  DHCPV4_MESSAGE_TYPE_ACTIVELEASEQUERY = 16;
  // DHCPLEASEQUERYSTATUS (RFC 7724).
  DHCPV4_MESSAGE_TYPE_LEASEQUERYSTATUS = 17;
  // DHCPTLS (RFC 7724).
  DHCPV4_MESSAGE_TYPE_TLS = 18;
}
