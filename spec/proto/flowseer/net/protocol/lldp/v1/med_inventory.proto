edition = "2024";

package flowseer.net.protocol.lldp.v1;

import option "buf/validate/validate.proto";

// The LLDP-MED inventory TLVs a neighbor announced. Each value is an
// SnmpAdminString of up to 32 octets, and each is absent when the neighbor
// sent no such TLV. Mirrors lldpXMedRemInventoryEntry (LLDP-EXT-MED-MIB:1078).
message MedInventory {
  // The hardware revision. Mirrors lldpXMedRemHardwareRev (LLDP-EXT-MED-MIB:1100).
  string hardware_revision = 1 [(buf.validate.field).string.max_bytes = 32];
  // The firmware revision. Mirrors lldpXMedRemFirmwareRev (LLDP-EXT-MED-MIB:1111).
  string firmware_revision = 2 [(buf.validate.field).string.max_bytes = 32];
  // The software revision. Mirrors lldpXMedRemSoftwareRev (LLDP-EXT-MED-MIB:1122).
  string software_revision = 3 [(buf.validate.field).string.max_bytes = 32];
  // The serial number. Mirrors lldpXMedRemSerialNum (LLDP-EXT-MED-MIB:1133).
  string serial_number = 4 [(buf.validate.field).string.max_bytes = 32];
  // The manufacturer name. Mirrors lldpXMedRemMfgName (LLDP-EXT-MED-MIB:1144).
  string manufacturer_name = 5 [(buf.validate.field).string.max_bytes = 32];
  // The model name. Mirrors lldpXMedRemModelName (LLDP-EXT-MED-MIB:1155).
  string model_name = 6 [(buf.validate.field).string.max_bytes = 32];
  // The asset identifier. Mirrors lldpXMedRemAssetID (LLDP-EXT-MED-MIB:1166).
  string asset_id = 7 [(buf.validate.field).string.max_bytes = 32];
}
