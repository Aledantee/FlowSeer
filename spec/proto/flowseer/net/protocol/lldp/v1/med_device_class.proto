edition = "2024";

package flowseer.net.protocol.lldp.v1;

// The LLDP-MED device class a system announces. Integers are the
// LldpXMedDeviceClass values (LLDP-EXT-MED-MIB:88-115), which the capabilities TLV
// carries.
enum MedDeviceClass {
  // The device has capabilities no LLDP-MED class covers.
  MED_DEVICE_CLASS_NOT_DEFINED = 0;
  // A generic endpoint (class I).
  MED_DEVICE_CLASS_ENDPOINT_CLASS1 = 1;
  // A media endpoint (class II).
  MED_DEVICE_CLASS_ENDPOINT_CLASS2 = 2;
  // A communication device endpoint (class III).
  MED_DEVICE_CLASS_ENDPOINT_CLASS3 = 3;
  // A network connectivity device, such as a switch.
  MED_DEVICE_CLASS_NETWORK_CONNECTIVITY = 4;
}
