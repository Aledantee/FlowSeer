edition = "2024";

package flowseer.net.protocol.lldp.v1;

// The power source an LLDP-MED extended power via MDI TLV announces. The
// values for power sourcing equipment and for a powered device are one enum
// because the TLV carries both in one field whose meaning follows the power
// type. Mirrors lldpXMedRemXPoEPSEPowerSource (LLDP-EXT-MED-MIB:1344) and
// lldpXMedRemXPoEPDPowerSource (LLDP-EXT-MED-MIB:1442).
enum MedPowerSource {
  // The power source was not reported or is unknown.
  MED_POWER_SOURCE_UNSPECIFIED = 0;
  // Power sourcing equipment on its primary source.
  MED_POWER_SOURCE_PSE_PRIMARY = 1;
  // Power sourcing equipment on its backup source.
  MED_POWER_SOURCE_PSE_BACKUP = 2;
  // A powered device drawing power from power sourcing equipment.
  MED_POWER_SOURCE_PD_FROM_PSE = 3;
  // A powered device on local power.
  MED_POWER_SOURCE_PD_LOCAL = 4;
  // A powered device on local power and power from power sourcing equipment.
  MED_POWER_SOURCE_PD_LOCAL_AND_PSE = 5;
}
