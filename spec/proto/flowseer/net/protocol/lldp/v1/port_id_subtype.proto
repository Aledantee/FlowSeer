edition = "2024";

package flowseer.net.protocol.lldp.v1;

// How the octets of a port identifier are encoded. Integers map directly to
// the port identifier subtypes assigned by IEEE Std 802.1AB
// (https://standards.ieee.org/ieee/802.1AB/7268/) and mirrored by the
// LLDP-MIB textual convention LldpPortIdSubtype. Unnamed values remain valid
// subtypes.
enum PortIdSubtype {
  // Subtype 0 is reserved and never appears on the wire. Absence of the
  // containing port identifier, not this value, means unobserved.
  PORT_ID_SUBTYPE_RESERVED = 0;
  // The alias of an interface, an IF-MIB ifAlias.
  PORT_ID_SUBTYPE_INTERFACE_ALIAS = 1;
  // The alias of a port or backplane component, an ENTITY-MIB
  // entPhysicalAlias.
  PORT_ID_SUBTYPE_PORT_COMPONENT = 2;
  // An IEEE 802 EUI-48 address in its six-octet binary form.
  PORT_ID_SUBTYPE_MAC_ADDRESS = 3;
  // A network address: one octet of IANA address family number followed by
  // the address of that family.
  PORT_ID_SUBTYPE_NETWORK_ADDRESS = 4;
  // The name of an interface, an IF-MIB ifName.
  PORT_ID_SUBTYPE_INTERFACE_NAME = 5;
  // A DHCP relay agent circuit identifier, RFC 3046 sub-option 1.
  PORT_ID_SUBTYPE_AGENT_CIRCUIT_ID = 6;
  // An identifier assigned locally by the reporting device.
  PORT_ID_SUBTYPE_LOCAL = 7;
}
