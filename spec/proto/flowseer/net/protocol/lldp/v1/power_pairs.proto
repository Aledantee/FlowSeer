edition = "2024";

package flowseer.net.protocol.lldp.v1;

// The wire pairs that carry power over MDI. The integers are the RFC 3621
// pethPsePortPowerPairs values (https://www.rfc-editor.org/rfc/rfc3621.html).
enum PowerPairs {
  // The pairs were not reported.
  POWER_PAIRS_UNSPECIFIED = 0;
  // Power rides the signal pairs (Alternative A).
  POWER_PAIRS_SIGNAL = 1;
  // Power rides the spare pairs (Alternative B).
  POWER_PAIRS_SPARE = 2;
}
