edition = "2024";

package flowseer.net.protocol.stp.v1;

import "flowseer/net/protocol/stp/v1/bridge_id.proto";
import "flowseer/net/protocol/stp/v1/forwarding_state.proto";
import "flowseer/net/protocol/stp/v1/port_role.proto";
import option "buf/validate/validate.proto";
import option "flowseer/net/key/v1/key.proto";

// Observed state of one port in one MSTI, keyed by MSTID and interface name.
// A port's CIST state is its PortState. Mirrors ieee8021MstpPortEntry
// (IEEE8021-MSTP-MIB-202211080000Z:819).
message MstPort {
  // MSTID of the instance, 1 to 4094. Must be present. Mirrors
  // ieee8021MstpPortMstId (IEEE8021-MSTP-MIB-202211080000Z:858).
  uint32 mst_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 4094
  ];
  // Device-local name of the interface. Must be present.
  string interface_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(flowseer.net.key.v1.interface_name) = true
  ];
  // Port role in the MSTI. Mirrors ieee8021MstpPortRole
  // (IEEE8021-MSTP-MIB-202211080000Z:965).
  PortRole role = 3;
  // Forwarding state of the port in the MSTI. Mirrors ieee8021MstpPortState
  // (IEEE8021-MSTP-MIB-202211080000Z:887).
  ForwardingState state = 4;
  // Port priority for the MSTI (0..240). Mirrors ieee8021MstpPortPriority
  // (IEEE8021-MSTP-MIB-202211080000Z:903).
  uint32 priority = 5 [(buf.validate.field).uint32.lte = 240];
  // Operational port path cost for the MSTI (1..200000000). Mirrors
  // ieee8021MstpPortPathCost (IEEE8021-MSTP-MIB-202211080000Z:914).
  uint32 path_cost = 6 [
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 200000000
  ];
  // Administrative port path cost for the MSTI (0..200000000). Zero is the
  // automatic default. Mirrors ieee8021MstpPortAdminPathCost
  // (IEEE8021-MSTP-MIB-202211080000Z:990).
  uint32 admin_path_cost = 7 [(buf.validate.field).uint32.lte = 200000000];
  // Regional root component of the port's MSTI port priority vector. Absent
  // means the port has received no BPDU. Mirrors ieee8021MstpPortDesignatedRoot
  // (IEEE8021-MSTP-MIB-202211080000Z:924).
  BridgeId designated_root = 8;
  // Internal root path cost component of the port's MSTI port priority
  // vector. Mirrors ieee8021MstpPortDesignatedCost
  // (IEEE8021-MSTP-MIB-202211080000Z:934).
  uint32 designated_cost = 9;
  // Designated bridge component of the port's MSTI port priority vector.
  // Absent means the port has received no BPDU. Mirrors
  // ieee8021MstpPortDesignatedBridge (IEEE8021-MSTP-MIB-202211080000Z:944).
  BridgeId designated_bridge = 10;
  // Designated port identifier component of the port's MSTI port priority
  // vector (0..65535). Mirrors ieee8021MstpPortDesignatedPort
  // (IEEE8021-MSTP-MIB-202211080000Z:955).
  uint32 designated_port = 11 [(buf.validate.field).uint32.lte = 65535];
  // Whether the port's disputed variable is set for the MSTI. Mirrors
  // ieee8021MstpPortDisputed (IEEE8021-MSTP-MIB-202211080000Z:979).
  bool disputed = 12;
}
