edition = "2024";

package flowseer.net.protocol.stp.v1;

import option "buf/validate/validate.proto";
import option "flowseer/net/key/v1/key.proto";
import option "flowseer/net/switching/v1/vlan_id.proto";

// The VLANs an MSTP bridge allocates to one spanning tree, keyed by network
// instance and MSTID. Each VLAN belongs to exactly one tree of a bridge.
// Mirrors ieee8021MstpVlanV2Entry (IEEE8021-MSTP-MIB-202211080000Z:1254) and
// the ieee8021MstpVids0..3 bitmaps (:390-444).
message MstVlanMap {
  // Network instance whose bridge holds the map. Must be present.
  string network_instance = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(flowseer.net.key.v1.network_instance_name) = true
  ];
  // MSTID the VLANs are allocated to, 0 to 4094; 0 is the CIST. Must be
  // present. Mirrors ieee8021MstpVlanV2MstId
  // (IEEE8021-MSTP-MIB-202211080000Z:1289), without its SPVID marker 4095.
  uint32 mst_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.lte = 4094
  ];
  // VLAN identifiers allocated to the tree. Empty means none.
  repeated uint32 vlan_ids = 3 [(buf.validate.field).repeated = {
    unique: true
    items: {
      uint32: {[flowseer.net.switching.v1.vlan_id]: true}
    }
  }];
}
