edition = "2024";

package flowseer.net.protocol.ospf.v1;

import "buf/validate/validate.proto";
import "flowseer/net/addr/v1/ip.proto";
import "flowseer/net/protocol/ospf/v1/ospf_neighbor_state.proto";
import option "flowseer/net/key/v1/key.proto";

// An OSPF neighbor router conversation (RFC 2328 §10, RFC 5340 §4, OSPF-MIB ospfNbrEntry).
message OspfNeighbor {
  option (buf.validate.message).cel = {
    id: "ospf_neighbor.instance_id_is_v3"
    message: "instance_id is valid only for OSPF version 3"
    expression: "!has(this.instance_id) || this.version == 3u"
  };
  option (buf.validate.message).cel = {
    id: "ospf_neighbor.address_family"
    message: "neighbor_address must be IPv4 for OSPF version 2 and IPv6 for OSPF version 3"
    expression:
      "!has(this.neighbor_address) || "
      "(this.version == 2u ? has(this.neighbor_address.v4) : has(this.neighbor_address.v6))"
  };

  // The local interface name this neighbor conversation is observed on. Must be present.
  string interface_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(flowseer.net.key.v1.interface_name) = true
  ];
  // The OSPF version: 2 for OSPFv2 or 3 for OSPFv3. Must be present.
  uint32 version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 2,
    (buf.validate.field).uint32.lte = 3
  ];
  // The protocol instance name. Must be present.
  string protocol_instance = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(flowseer.net.key.v1.protocol_instance_name) = true
  ];
  // The OSPFv3 interface instance identifier (RFC 5340 §2.4, OSPFV3-MIB Ospfv3IfInstIdTC).
  // Valid only for OSPF version 3.
  uint32 instance_id = 4 [(buf.validate.field).uint32.lte = 255];
  // The neighbor router identifier in dotted-quad integer form (OSPF-MIB ospfNbrRtrId). Must be present.
  uint32 neighbor_router_id = 5 [(buf.validate.field).required = true];
  // The IP address of the neighbor router.
  flowseer.net.addr.v1.IpAddress neighbor_address = 6;
  // The operational state of the relationship with this neighbor.
  OspfNeighborState state = 7;
  // The priority of this neighbor for designated router election (OSPF-MIB ospfNbrPriority, 0 to 255).
  uint32 priority = 8 [(buf.validate.field).uint32.lte = 255];
}
