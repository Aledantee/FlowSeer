edition = "2024";

package flowseer.net.protocol.cdp.v1;

import "flowseer/net/addr/v1/ip.proto";
import "flowseer/net/phy/v1/ethernet_duplex.proto";
import "flowseer/net/protocol/cdp/v1/capability.proto";
import "google/protobuf/duration.proto";
import option "buf/validate/validate.proto";
import option "flowseer/net/key/v1/key.proto";
import option "flowseer/net/switching/v1/vlan_id.proto";

// One CDP announcement a device holds from a neighboring device, as seen on
// one of the device's own interfaces, keyed by (local_interface_name,
// device_id). Every field other than the local interface name is what the
// neighbor announced. Mirrors cdpCacheEntry of CISCO-CDP-MIB
// (https://github.com/cisco/cisco-mibs/blob/main/v2/CISCO-CDP-MIB.my;
// spec/yang/cisco/iosxe/2611/MIBS/CISCO-CDP-MIB.yang:419-740).
message Neighbor {
  // The device-local name of the interface the announcement arrived on. Must
  // be present. Mirrors cdpCacheIfIndex (CISCO-CDP-MIB.yang:430), resolved to a name.
  string local_interface_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(flowseer.net.key.v1.interface_name) = true
  ];
  // The name the neighbor calls itself in its Device-ID TLV. Must be present.
  // Mirrors cdpCacheDeviceId (CISCO-CDP-MIB.yang:493) and the IOS-XE device-name, never the
  // IOS-XE numeric device-id.
  string device_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  // The name of the neighbor's own port. Absent means the announcement
  // carried no Port-ID TLV. Mirrors cdpCacheDevicePort (CISCO-CDP-MIB.yang:504).
  string port_id = 3 [(buf.validate.field).string.max_len = 255];
  // The neighbor's hardware platform. Absent means the announcement carried
  // no Platform TLV. Mirrors cdpCachePlatform (CISCO-CDP-MIB.yang:516).
  string platform = 4 [(buf.validate.field).string.max_len = 255];
  // The neighbor's software version text. Absent means the announcement
  // carried no Version TLV. Mirrors cdpCacheVersion (CISCO-CDP-MIB.yang:482), which a
  // Version TLV can outrun.
  string software_version = 5 [(buf.validate.field).string.max_len = 1024];
  // The capabilities the neighbor announced. An empty list means none were
  // announced. Mirrors cdpCacheCapabilities (CISCO-CDP-MIB.yang:527).
  repeated Capability capabilities = 6 [(buf.validate.field).repeated.unique = true];
  // The neighbor's VTP management domain, up to 32 octets. Absent means the
  // announcement carried no VTP Management Domain TLV. Mirrors
  // cdpCacheVTPMgmtDomain (CISCO-CDP-MIB.yang:543).
  string vtp_management_domain = 7 [(buf.validate.field).string.max_bytes = 32];
  // The native VLAN of the neighbor's port. Absent means the announcement
  // carried no Native VLAN TLV, which the MIB spells 0. Mirrors
  // cdpCacheNativeVLAN (CISCO-CDP-MIB.yang:558).
  uint32 native_vlan_id = 8 [(buf.validate.field).uint32.(flowseer.net.switching.v1.vlan_id) = true];
  // The duplex mode of the neighbor's port. Absent means the announcement
  // carried no Duplex TLV, which the MIB spells unknown. Mirrors
  // cdpCacheDuplex (CISCO-CDP-MIB.yang:569).
  flowseer.net.phy.v1.EthernetDuplex duplex = 9;
  // The addresses the neighbor announced in its Address TLV. An empty list
  // means none were announced, or none were IPv4 or IPv6. Mirrors
  // cdpCacheAddress (CISCO-CDP-MIB.yang:466).
  repeated flowseer.net.addr.v1.IpAddress addresses = 10;
  // The addresses the neighbor announced for management. An empty list means
  // none were announced, or none were IPv4 or IPv6. Mirrors
  // cdpCachePrimaryMgmtAddr (CISCO-CDP-MIB.yang:671) and cdpCacheSecondaryMgmtAddr (CISCO-CDP-MIB.yang:700).
  repeated flowseer.net.addr.v1.IpAddress management_addresses = 11;
  // The voice VLAN the neighbor announced in its Appliance VLAN-ID TLV, kept
  // as sent, 0 and 4095 included. Absent means no such TLV. Mirrors
  // cdpCacheVlanID (CISCO-CDP-MIB.yang:603).
  uint32 appliance_vlan_id = 12 [(buf.validate.field).uint32.lte = 4095];
  // The power the neighbor announced it consumes. Absent means no Power
  // Consumption TLV. Mirrors cdpCachePowerConsumption (CISCO-CDP-MIB.yang:616), in
  // milliwatts.
  uint64 power_consumption_nanowatts = 13;
  // The largest datagram the neighbor announced it can send or receive.
  // Absent means no MTU TLV. Mirrors cdpCacheMTU (CISCO-CDP-MIB.yang:628).
  uint64 mtu_bytes = 14;
  // The neighbor's system name. Absent means no System Name TLV. Mirrors
  // cdpCacheSysName (CISCO-CDP-MIB.yang:639).
  string system_name = 15 [(buf.validate.field).string.max_len = 255];
  // The neighbor's SNMP system object identifier in dotted form. Absent
  // means no System Object ID TLV. Mirrors cdpCacheSysObjectID (CISCO-CDP-MIB.yang:652).
  string system_object_id = 16 [(buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]+)+$"];
  // The neighbor's physical location. Absent means no Location TLV. Mirrors
  // cdpCachePhysLocation (CISCO-CDP-MIB.yang:720).
  string physical_location = 17 [(buf.validate.field).string.max_len = 255];
  // The hold time the neighbor announced in the one-octet TTL of the CDP
  // header (Wireshark epan/dissectors/packet-cdp.c:307 at commit
  // 16c09df25f262e2e1b432521aba7eb6a3ea4afe3), with the meaning of the LLDP
  // neighbor's time_to_live. Absent means the source did not report it,
  // including a source that reports only the time remaining.
  google.protobuf.Duration time_to_live = 18 [
    (buf.validate.field).duration.gte = {},
    (buf.validate.field).duration.lte = {seconds: 255}
  ];
  // The CDP version of the announcement, 1 or 2. Absent means the source did
  // not report it. Mirrors rlCdpCacheCdpVersion
  // (spec/mib/cisco/smb/CISCOSBCDP.mib:301).
  uint32 protocol_version = 19 [
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 2
  ];
}
