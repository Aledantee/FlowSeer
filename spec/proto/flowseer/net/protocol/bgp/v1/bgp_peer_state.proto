edition = "2024";

package flowseer.net.protocol.bgp.v1;

// The state of the BGP peer connection (BGP4-MIB bgpPeerState, RFC 4271 §8.2.2).
// Values keep the MIB integers (1 to 6); the registry assigns nothing at zero.
enum BgpPeerState {
  // The peer state was not reported.
  BGP_PEER_STATE_UNSPECIFIED = 0;
  // Connection is idle (idle, 1).
  BGP_PEER_STATE_IDLE = 1;
  // Waiting for TCP connection (connect, 2).
  BGP_PEER_STATE_CONNECT = 2;
  // Waiting for TCP connection to complete (active, 3).
  BGP_PEER_STATE_ACTIVE = 3;
  // OPEN message has been sent (opensent, 4).
  BGP_PEER_STATE_OPEN_SENT = 4;
  // OPEN message received, waiting for KEEPALIVE (openconfirm, 5).
  BGP_PEER_STATE_OPEN_CONFIRM = 5;
  // BGP connection is established (established, 6).
  BGP_PEER_STATE_ESTABLISHED = 6;
}
