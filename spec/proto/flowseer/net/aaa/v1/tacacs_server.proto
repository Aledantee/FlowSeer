edition = "2024";

package flowseer.net.aaa.v1;

import option "buf/validate/validate.proto";

// The TACACS+ settings of an AAA server. Mirrors OpenConfig's tacacs container
// (openconfig-aaa-tacacs.yang:88-118) without its secret-key leaves.
message TacacsServer {
  // The TCP port. Absent means unreported, not the RFC 8907 default of 49.
  uint32 port = 1 [(buf.validate.field).uint32.lte = 65535];
}
