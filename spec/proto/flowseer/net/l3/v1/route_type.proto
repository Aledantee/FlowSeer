edition = "2024";

package flowseer.net.l3.v1;

// The forwarding action or destination class of a route. The normalized
// values cover RFC 4292 route types and widely implemented rtnetlink actions.
enum RouteType {
  // The type was explicitly reported as unknown. An unreported type is
  // represented by an absent field instead.
  ROUTE_TYPE_UNSPECIFIED = 0;
  // Forward matching packets toward one or more next hops.
  ROUTE_TYPE_UNICAST = 1;
  // Deliver matching packets to the local protocol stack.
  ROUTE_TYPE_LOCAL = 2;
  // Discard matching packets without notifying the sender.
  ROUTE_TYPE_BLACKHOLE = 3;
  // Discard matching packets and report the destination as unreachable.
  ROUTE_TYPE_UNREACHABLE = 4;
  // Discard matching packets and report an administratively prohibited path.
  ROUTE_TYPE_PROHIBIT = 5;
  // Stop lookup in this table and continue with the next applicable table.
  ROUTE_TYPE_THROW = 6;
  // A multicast forwarding entry.
  ROUTE_TYPE_MULTICAST = 7;
  // A link broadcast destination.
  ROUTE_TYPE_BROADCAST = 8;
  // An anycast destination assigned to the local system.
  ROUTE_TYPE_ANYCAST = 9;
  // An action or destination class outside the normalized categories.
  ROUTE_TYPE_OTHER = 10;
}
