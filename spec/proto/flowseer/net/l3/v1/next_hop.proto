edition = "2024";

package flowseer.net.l3.v1;

import "flowseer/net/addr/v1/ip.proto";
import option "buf/validate/validate.proto";

// One forwarding choice for a route. A route carries multiple NextHop values
// for ECMP; address-only, interface-only, and address-plus-interface forms are
// all valid. The address family may differ from the destination family for
// protocols that support an extended next-hop encoding.
message NextHop {
  option (buf.validate.message).cel = {
    id: "next_hop.address_or_interface"
    message: "a next hop must identify an address or interface"
    expression: "has(this.address) || has(this.interface_name)"
  };

  // The gateway address. Absent means forwarding is interface-only or the
  // route source did not expose a gateway.
  flowseer.net.addr.v1.IpAddress address = 1;

  // The device-reported egress interface name. Absent means recursive
  // resolution determines the interface or the source did not report it.
  string interface_name = 2 [(buf.validate.field).string.min_len = 1];

  // Relative load-sharing weight. Absent means equal cost or a device default;
  // when present it must be at least one.
  uint32 weight = 3 [(buf.validate.field).uint32.gte = 1];

  // Routing table used to resolve this next hop. Absent means resolution uses
  // the route's own table.
  string routing_table_name = 4 [(buf.validate.field).string.min_len = 1];
}
