edition = "2024";

package flowseer.net.l3.v1;

// Reachability state of a neighbor-cache entry. Values 1 through 6 match the
// state codes standardized by RFC 8335 and the IPv6 NUD states in RFC 4861;
// ARP implementations may expose the closest equivalent state.
enum NeighborState {
  // The state was explicitly reported as unknown. An unreported state is
  // represented by an absent field instead.
  NEIGHBOR_STATE_UNSPECIFIED = 0;
  // Address resolution is in progress and no link-layer address is known.
  NEIGHBOR_STATE_INCOMPLETE = 1;
  // Forward-path reachability was recently confirmed.
  NEIGHBOR_STATE_REACHABLE = 2;
  // Reachability is no longer confirmed, but the cached mapping remains in
  // use until traffic triggers verification.
  NEIGHBOR_STATE_STALE = 3;
  // Traffic used a stale entry and the device is waiting before probing.
  NEIGHBOR_STATE_DELAY = 4;
  // The device is actively sending unicast reachability probes.
  NEIGHBOR_STATE_PROBE = 5;
  // Resolution or reachability probes were exhausted.
  NEIGHBOR_STATE_FAILED = 6;
  // The mapping has been invalidated but remains visible in the source table.
  NEIGHBOR_STATE_INVALID = 7;
}
