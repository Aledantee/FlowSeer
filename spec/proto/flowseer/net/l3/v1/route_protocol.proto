edition = "2024";

package flowseer.net.l3.v1;

// The protocol or mechanism that supplied a route. Direct and static are
// pseudo-protocols in the sense used by RFC 8349; the remaining values cover
// common sources reported by routing stacks and forwarding MIBs.
enum RouteProtocol {
  // The protocol was explicitly reported as unknown. An unreported protocol
  // is represented by an absent field instead.
  ROUTE_PROTOCOL_UNSPECIFIED = 0;
  // A directly connected prefix.
  ROUTE_PROTOCOL_CONNECTED = 1;
  // Operator or controller configuration.
  ROUTE_PROTOCOL_STATIC = 2;
  // A route installed by the operating-system kernel.
  ROUTE_PROTOCOL_KERNEL = 3;
  // An ICMP redirect.
  ROUTE_PROTOCOL_ICMP_REDIRECT = 4;
  // Border Gateway Protocol.
  ROUTE_PROTOCOL_BGP = 5;
  // Open Shortest Path First, for either IPv4 or IPv6.
  ROUTE_PROTOCOL_OSPF = 6;
  // Intermediate System to Intermediate System.
  ROUTE_PROTOCOL_ISIS = 7;
  // Routing Information Protocol, for either IPv4 or IPv6.
  ROUTE_PROTOCOL_RIP = 8;
  // Enhanced Interior Gateway Routing Protocol.
  ROUTE_PROTOCOL_EIGRP = 9;
  // Babel routing protocol.
  ROUTE_PROTOCOL_BABEL = 10;
  // A default route learned through DHCP.
  ROUTE_PROTOCOL_DHCP = 11;
  // A default or more-specific route learned from an IPv6 Router
  // Advertisement.
  ROUTE_PROTOCOL_ROUTER_ADVERTISEMENT = 12;
  // A source outside the normalized categories.
  ROUTE_PROTOCOL_OTHER = 13;
}
