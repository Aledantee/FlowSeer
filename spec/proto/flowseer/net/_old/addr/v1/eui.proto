edition = "2024";

package flowseer.net.addr.v1;

import option "buf/validate/validate.proto";

// A 48-bit IEEE MAC address (EUI-48). EUI-48 is defined by the IEEE
// Registration Authority; see
// https://standards.ieee.org/products-programs/regauth/.
message Eui48Address {
  // The 6 address octets in canonical wire order, most significant first.
  // Absent is invalid; omit the containing field instead.
  bytes octets = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 6
  ];
}

// A 64-bit IEEE MAC address (EUI-64). EUI-64 is defined by the IEEE
// Registration Authority; see
// https://standards.ieee.org/products-programs/regauth/.
message Eui64Address {
  // The 8 address octets in canonical wire order, most significant first.
  // Absent is invalid; omit the containing field instead.
  bytes octets = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 8
  ];
}

// An IEEE Extended Unique Identifier of either width
// (https://standards.ieee.org/products-programs/regauth/). The arm is the
// width: consumers switch on it rather than inferring it from a payload
// length, and each arm carries its own size rule.
message EuiAddress {
  oneof kind {
    option (buf.validate.oneof).required = true;

    // A 48-bit address.
    Eui48Address eui48 = 1;
    // A 64-bit address.
    Eui64Address eui64 = 2;
  }
}
