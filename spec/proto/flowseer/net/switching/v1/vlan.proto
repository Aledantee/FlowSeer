edition = "2024";

package flowseer.net.switching.v1;

import "flowseer/net/switching/v1/vlan_registration.proto";
import option "buf/validate/validate.proto";
import option "flowseer/net/switching/v1/vlan_id.proto";

// A VLAN database row. Interface membership is held only by the embedding
// interface's switchport facet, so the two directions cannot drift.
message Vlan {
  // The IEEE 802.1Q VLAN identifier
  // (https://standards.ieee.org/ieee/802.1Q/10323/). Must be present;
  // omit the containing Vlan when no identifier is available.
  uint32 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.(flowseer.net.switching.v1.vlan_id) = true
  ];
  // The device-reported VLAN name. Absent means no name was reported; an empty
  // string means the source explicitly reported an empty name.
  string name = 2;
  // How the VLAN was registered in the bridge. Absent means the source did
  // not report whether the entry is permanent or dynamic.
  VlanRegistration registration = 3;
}
