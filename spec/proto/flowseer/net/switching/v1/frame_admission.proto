edition = "2024";

package flowseer.net.switching.v1;

// Which Ethernet frame-tag forms a switchport admits at ingress. The three
// policies follow the acceptable-frame-types parameter of IEEE 802.1Q
// (https://standards.ieee.org/ieee/802.1Q/10323/).
enum FrameAdmission {
  // The source explicitly reported an unknown policy. Absence means unreported.
  FRAME_ADMISSION_UNSPECIFIED = 0;
  // Admit tagged, priority-tagged, and untagged frames.
  FRAME_ADMISSION_ALL = 1;
  // Admit only frames carrying a nonzero VLAN identifier.
  FRAME_ADMISSION_TAGGED_ONLY = 2;
  // Admit only untagged frames and priority-tagged frames with VID zero.
  FRAME_ADMISSION_UNTAGGED_AND_PRIORITY_TAGGED_ONLY = 3;
}
