edition = "2024";

package flowseer.net.flow.v1;

import "google/protobuf/duration.proto";
import option "buf/validate/validate.proto";
import option "flowseer/net/key/v1/key.proto";

// A counter poller on an interface. Mirrors sFlowCpEntry (SFLOW-MIB:487-564)
// for interface data sources. A poller the MIB reports with interval 0 or
// receiver 0 is disabled and has no row.
message SflowPoller {
  // The polled interface, the sFlowCpDataSource. Must be present.
  string interface_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(flowseer.net.key.v1.interface_name) = true
  ];
  // The poller instance on the interface, sFlowCpInstance. Absent means
  // unreported.
  uint32 instance = 2;
  // The index of the SflowReceiver the counters go to, sFlowCpReceiver. Must
  // be present.
  uint32 receiver_index = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 65535
    }
  ];
  // The longest time between counter samples, sFlowCpInterval. Must be
  // present.
  google.protobuf.Duration interval = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration.gte = {seconds: 1}
  ];
}
