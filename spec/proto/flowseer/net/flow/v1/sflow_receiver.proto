edition = "2024";

package flowseer.net.flow.v1;

import "flowseer/net/addr/v1/ip.proto";
import option "buf/validate/validate.proto";

// An sFlow collector a device sends datagrams to. Mirrors sFlowRcvrEntry
// (SFLOW-MIB:241-379). A receiver the MIB reports with address 0.0.0.0 is
// unclaimed and has no row.
message SflowReceiver {
  // The receiver's index, sFlowRcvrIndex. Samplers and pollers name it.
  // Must be present.
  uint32 index = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 65535
    }
  ];
  // The collector's address, sFlowRcvrAddress. Must be present.
  flowseer.net.addr.v1.IpAddress address = 2 [(buf.validate.field).required = true];
  // The collector's UDP port, sFlowRcvrPort. Absent means unreported, not
  // the MIB default of 6343.
  uint32 port = 3 [(buf.validate.field).uint32.lte = 65535];
  // The largest datagram the device sends, sFlowRcvrMaximumDatagramSize.
  // Absent means unreported.
  uint64 max_datagram_size_bytes = 4;
  // The sFlow datagram version sent, sFlowRcvrDatagramVersion. Absent means
  // unreported.
  uint32 datagram_version = 5;
}
