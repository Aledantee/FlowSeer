edition = "2024";

package flowseer.net.flow.v1;

import option "buf/validate/validate.proto";
import option "flowseer/net/key/v1/key.proto";

// A packet flow sampler on an interface. Mirrors sFlowFsEntry
// (SFLOW-MIB:385-480) for interface data sources. A sampler the MIB reports
// with sampling rate 0 or receiver 0 is disabled and has no row.
message SflowSampler {
  // The sampled interface, the sFlowFsDataSource. Must be present.
  string interface_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(flowseer.net.key.v1.interface_name) = true
  ];
  // The sampler instance on the interface, sFlowFsInstance. Absent means
  // unreported.
  uint32 instance = 2;
  // The index of the SflowReceiver the samples go to, sFlowFsReceiver. Must
  // be present.
  uint32 receiver_index = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 65535
    }
  ];
  // One packet in this many is sampled, sFlowFsPacketSamplingRate. Must be
  // present.
  uint32 sampling_rate = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1
  ];
  // The most bytes copied from a sampled packet, sFlowFsMaximumHeaderSize.
  // Absent means unreported.
  uint64 max_header_size_bytes = 5;
}
