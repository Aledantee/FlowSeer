edition = "2024";

package flowseer.net.l2.v1;

import "buf/validate/validate.proto";
import "flowseer/net/l2/v1/vlan_status.proto";

extend buf.validate.UInt32Rules {
  bool vlan_id = 50000 [(buf.validate.predefined).cel = {
    id: "uint32.vlan_id"
    message: "value must be a usable IEEE 802.1Q VLAN identifier"
    expression: "!rule || (this >= 1u && this <= 4094u)"
  }];
}

// A VLAN database row. Interface membership is held only by the embedding
// interface's switchport facet, so the two directions cannot drift.
message Vlan {
  // The IEEE 802.1Q VLAN identifier. Absent is invalid; omit the containing
  // Vlan when no identifier is available.
  uint32 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.(vlan_id) = true
  ];
  // The device-reported VLAN name. Absent means no name was reported; an empty
  // string means the source explicitly reported an empty name.
  string name = 2;
  // The VLAN's observed lifetime. Absent means no status was reported.
  VlanStatus status = 3;
}
