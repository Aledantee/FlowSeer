edition = "2024";

package flowseer.net.l2.v1;

// How a unicast forwarding-database entry was created or is owned. The
// vocabulary normalizes the ownership cases of the dot1qTpFdbStatus object
// of the RFC 4363 Q-BRIDGE-MIB
// (https://www.rfc-editor.org/rfc/rfc4363.html) — other, learned, self, and
// mgmt map to OTHER, DYNAMIC, SELF, and STATIC — while REMOTE is a
// FlowSeer-normalized extension for overlay and controller planes. The
// integer numbering is FlowSeer's own and does not mirror the MIB.
enum FdbEntryKind {
  // The source explicitly reported an unknown kind. Absence means unreported.
  FDB_ENTRY_KIND_UNSPECIFIED = 0;
  // A kind outside the normalized cases.
  FDB_ENTRY_KIND_OTHER = 1;
  // Learned dynamically from source MAC addresses.
  FDB_ENTRY_KIND_DYNAMIC = 2;
  // Configured by an operator or controller.
  FDB_ENTRY_KIND_STATIC = 3;
  // Owned by the local bridge or CPU.
  FDB_ENTRY_KIND_SELF = 4;
  // Learned through a remote-control or overlay plane.
  FDB_ENTRY_KIND_REMOTE = 5;
}
