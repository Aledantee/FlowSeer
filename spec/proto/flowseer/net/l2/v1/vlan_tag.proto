edition = "2024";

package flowseer.net.l2.v1;

import "flowseer/net/packet/v1/ether_type.proto";
import option "buf/validate/validate.proto";
import option "flowseer/net/l2/v1/vlan_id.proto";

// One exact IEEE 802.1Q VLAN tag observed on the wire, carrying the TPID,
// PCP, DEI, and VID fields defined by IEEE 802.1Q
// (https://standards.ieee.org/ieee/802.1Q/10323/). Every field is
// structurally present in an encoded tag; configuration predicates use
// separate types.
message VlanTag {
  // The tag protocol identifier. Absent is invalid; open EtherType values are
  // accepted when they fall in the structural EtherType range.
  flowseer.net.packet.v1.EtherType tpid = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.(flowseer.net.packet.v1.ether_type) = true
  ];
  // The 12-bit VID. Absent is invalid; zero is a valid priority-tagged value
  // and 4095 is reserved.
  uint32 vlan_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.(flowseer.net.l2.v1.vlan_tag_vid) = true
  ];
  // The three-bit priority code point. Absent is invalid; zero is valid.
  uint32 pcp = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.(flowseer.net.l2.v1.vlan_pcp) = true
  ];
  // The drop-eligible indicator. Absent is invalid; false is a real wire value.
  bool dei = 4 [(buf.validate.field).required = true];
}
