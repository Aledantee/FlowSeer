edition = "2024";

package flowseer.net.l2.v1;

// How a VLAN entry was registered in a bridge's VLAN database. The values
// normalize the Q-BRIDGE-MIB registration and persistence distinctions.
enum VlanRegistration {
  // The source explicitly reported an unknown registration mechanism. An
  // unreported value is represented by an absent field.
  VLAN_REGISTRATION_UNSPECIFIED = 0;
  // A registration mechanism outside the normalized cases.
  VLAN_REGISTRATION_OTHER = 1;
  // A static entry that survives bridge restarts.
  VLAN_REGISTRATION_PERMANENT = 2;
  // A protocol-learned entry that may age out.
  VLAN_REGISTRATION_DYNAMIC = 3;
}
