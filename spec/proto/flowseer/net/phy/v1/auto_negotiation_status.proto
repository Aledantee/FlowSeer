edition = "2024";

package flowseer.net.phy.v1;

// Current progress of Ethernet auto-negotiation.
enum AutoNegotiationStatus {
  // The source explicitly reported an unknown status. Absence means unreported.
  AUTO_NEGOTIATION_STATUS_UNSPECIFIED = 0;
  // Auto-negotiation is administratively disabled or not running.
  AUTO_NEGOTIATION_STATUS_DISABLED = 1;
  // Link partners are exchanging capabilities.
  AUTO_NEGOTIATION_STATUS_NEGOTIATING = 2;
  // Auto-negotiation completed successfully.
  AUTO_NEGOTIATION_STATUS_COMPLETE = 3;
  // Auto-negotiation terminated without agreement.
  AUTO_NEGOTIATION_STATUS_FAILED = 4;
}
