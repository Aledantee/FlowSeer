edition = "2024";

package flowseer.net.phy.v1;

import "flowseer/net/phy/v1/poe_role.proto";
import "flowseer/net/phy/v1/poe_status.proto";
import option "buf/validate/validate.proto";

// Power over Ethernet attributes for one physical link. Presence of the
// containing message means the source supplied PoE information.
message PoeFacet {
  option (buf.validate.message).cel = {
    id: "poe_facet.delivery_requires_support"
    message: "PoE cannot deliver power when support is explicitly false"
    expression:
      "!has(this.supported) || this.supported || !has(this.status) || "
      "this.status != flowseer.net.phy.v1.PoeStatus.POE_STATUS_DELIVERING_POWER"
  };

  reserved 4, 6;
  reserved power_draw_milliwatts, allocated_power_milliwatts;

  // Whether the port supports PoE. Absent means capability was not reported;
  // false means the source explicitly reported no support.
  bool supported = 1;
  // Whether this port supplies or consumes power. Absent means no role was
  // reported.
  PoeRole role = 2;
  // The IEEE 802.3 power class number, per the PSE/PD classification of
  // IEEE 802.3 and its 802.3bt extensions
  // (https://standards.ieee.org/ieee/802.3/10422/). Absent means no class
  // was reported.
  uint32 power_class = 3;
  // The measured power draw in nanowatts. Absent means no measurement was
  // reported; zero is an explicit zero-power measurement.
  uint64 power_draw_nanowatts = 7;
  // Current delivery status. Absent means the source did not report it.
  PoeStatus status = 5;
  // Power allocated to the port in nanowatts. Absent means no allocation was
  // reported; zero is an explicit zero-power allocation.
  uint64 allocated_power_nanowatts = 8;
}
