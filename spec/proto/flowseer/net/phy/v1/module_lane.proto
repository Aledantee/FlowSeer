edition = "2024";

package flowseer.net.phy.v1;

import "flowseer/net/measure/v1/sensor.proto";
import option "buf/validate/validate.proto";

// One lane of a pluggable module and its diagnostics, per the SFF-8472
// diagnostic monitoring page (https://members.snia.org/document/dl/25916)
// and the CMIS lane-specific monitors
// (https://www.oiforum.com/technical-work/hot-topics/cmis/). A
// single-channel module has one lane with index 1.
message ModuleLane {
  reserved 3, 4, 5;

  // The lane number, counted from 1. Must be present.
  uint32 index = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gt = 0
  ];
  // The nominal wavelength of the lane's laser in nanometers. Absent means
  // unreported or not applicable; zero is invalid when present.
  uint32 wavelength_nanometers = 2 [(buf.validate.field).uint32.gt = 0];
  // Transmitted optical power. SFF-8472 reports it linearly in tenths of a
  // microwatt, which the nanowatt unit carries without loss; zero is a real
  // measurement of no light. Absent means unreported.
  flowseer.net.measure.v1.Power tx_power = 6;
  // Received optical power, in the same unit as tx_power. Absent means
  // unreported.
  flowseer.net.measure.v1.Power rx_power = 7;
  // Laser bias current. SFF-8472 reports it in steps of two microamperes,
  // which the microampere unit carries without loss. Absent means
  // unreported.
  flowseer.net.measure.v1.Current bias = 8;
}
