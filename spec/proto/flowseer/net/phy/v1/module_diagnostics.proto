edition = "2024";

package flowseer.net.phy.v1;

import "flowseer/net/measure/v1/sensor.proto";

// Module-level diagnostic measurements of a pluggable module, per the
// SFF-8472 diagnostic monitoring page
// (https://members.snia.org/document/dl/25916). Per-lane measurements live
// on the module's lanes.
message ModuleDiagnostics {
  reserved 1, 2;

  // Internal module temperature. SFF-8472 reports it in 1/256 degree steps,
  // which the millidegree unit carries to within four thousandths of a
  // degree. Absent means unreported.
  flowseer.net.measure.v1.Temperature temperature = 3;
  // Module supply voltage. SFF-8472 reports it in steps of one hundred
  // microvolts, which the microvolt unit carries without loss. Absent means
  // unreported.
  flowseer.net.measure.v1.Voltage voltage = 4;
}
