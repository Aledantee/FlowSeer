edition = "2024";

package flowseer.net.phy.v1;

// The connector of a pluggable module. Integers are the connector values of
// the SFF-8024 connector registry
// (https://members.snia.org/document/dl/26423), so a value the registry
// assigns after this file was written remains valid and is carried unnamed.
// Zero is the registry's own unknown code.
enum ModuleConnector {
  // Unknown or unspecified, the registry's zero code.
  MODULE_CONNECTOR_UNKNOWN = 0;
  // SC.
  MODULE_CONNECTOR_SC = 1;
  // Fibre Channel style 1 copper.
  MODULE_CONNECTOR_FC_STYLE1_COPPER = 2;
  // Fibre Channel style 2 copper.
  MODULE_CONNECTOR_FC_STYLE2_COPPER = 3;
  // BNC or TNC.
  MODULE_CONNECTOR_BNC_TNC = 4;
  // Fibre Channel coax headers.
  MODULE_CONNECTOR_FC_COAX = 5;
  // Fiber jack.
  MODULE_CONNECTOR_FIBER_JACK = 6;
  // LC.
  MODULE_CONNECTOR_LC = 7;
  // MT-RJ.
  MODULE_CONNECTOR_MT_RJ = 8;
  // MU.
  MODULE_CONNECTOR_MU = 9;
  // SG.
  MODULE_CONNECTOR_SG = 10;
  // Optical pigtail.
  MODULE_CONNECTOR_OPTICAL_PIGTAIL = 11;
  // MPO with one row of 12 fibers.
  MODULE_CONNECTOR_MPO_SINGLE_ROW12 = 12;
  // MPO with two rows of 16 fibers.
  MODULE_CONNECTOR_MPO_DUAL_ROW16 = 13;
  // HSSDC II.
  MODULE_CONNECTOR_HSSDC_II = 32;
  // Copper pigtail.
  MODULE_CONNECTOR_COPPER_PIGTAIL = 33;
  // RJ45.
  MODULE_CONNECTOR_RJ45 = 34;
  // No separable connector, as on a direct-attach cable.
  MODULE_CONNECTOR_NONE = 35;
  // MXC with two rows of 16 fibers.
  MODULE_CONNECTOR_MXC_DUAL_ROW16 = 36;
  // CS.
  MODULE_CONNECTOR_CS = 37;
  // SN.
  MODULE_CONNECTOR_SN = 38;
  // MPO with two rows of 12 fibers.
  MODULE_CONNECTOR_MPO_DUAL_ROW12 = 39;
  // MPO with one row of 16 fibers.
  MODULE_CONNECTOR_MPO_SINGLE_ROW16 = 40;
}
