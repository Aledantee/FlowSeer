edition = "2024";

package flowseer.net.phy.v1;

import option "buf/validate/validate.proto";

// An optical power measurement and the module's thresholds for it, in
// nanowatts. SFF-8472 (https://members.snia.org/document/dl/25916) reports
// power linearly in tenths of a microwatt, which this unit carries without
// loss; consumers derive decibel-milliwatts. Zero is a real measurement of
// no light. Each threshold is absent when the module does not report it;
// present thresholds must be ordered.
message OpticalPower {
  option (buf.validate.message).cel = {
    id: "optical_power.thresholds_ordered"
    message: "power thresholds must satisfy low alarm <= low warning <= high warning <= high alarm"
    expression:
      "(!has(this.low_alarm_nanowatts) || !has(this.low_warning_nanowatts) || "
      "this.low_alarm_nanowatts <= this.low_warning_nanowatts) && "
      "(!has(this.low_warning_nanowatts) || !has(this.high_warning_nanowatts) || "
      "this.low_warning_nanowatts <= this.high_warning_nanowatts) && "
      "(!has(this.high_warning_nanowatts) || !has(this.high_alarm_nanowatts) || "
      "this.high_warning_nanowatts <= this.high_alarm_nanowatts)"
  };

  // The measured power. Absent means unreported.
  uint32 value_nanowatts = 1;
  // Power at or above which the module raises a high alarm.
  uint32 high_alarm_nanowatts = 2;
  // Power at or above which the module raises a high warning.
  uint32 high_warning_nanowatts = 3;
  // Power at or below which the module raises a low warning.
  uint32 low_warning_nanowatts = 4;
  // Power at or below which the module raises a low alarm.
  uint32 low_alarm_nanowatts = 5;
}
