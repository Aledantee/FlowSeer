edition = "2024";

// The service an operator calls to create, provision, and retire edges.
// Authorized as the operator; an edge never calls it.
package flowseer.api.edge.v1;

import "flowseer/model/edge/v1/edge.proto";
import "flowseer/model/edge/v1/provisioning.proto";
import "google/protobuf/timestamp.proto";
import option "buf/validate/validate.proto";

service EdgeAdminService {
  // Creates a pending edge and issues its first setup key.
  rpc CreateEdge(CreateEdgeRequest) returns (CreateEdgeResponse);
  // Issues a fresh setup key to a pending or retired edge, replacing any
  // unused one. A retired edge returns to pending.
  rpc IssueSetupKey(IssueSetupKeyRequest) returns (IssueSetupKeyResponse);
  // Revokes an unused setup key.
  rpc RevokeSetupKey(RevokeSetupKeyRequest) returns (RevokeSetupKeyResponse);
  // Retires an edge. Its key is refused from the next call on.
  rpc RetireEdge(RetireEdgeRequest) returns (RetireEdgeResponse);
  rpc GetEdge(GetEdgeRequest) returns (GetEdgeResponse);
  rpc ListEdges(ListEdgesRequest) returns (ListEdgesResponse);
}

message CreateEdgeRequest {
  // Operator-assigned display name. Unset means none. When set, must not
  // be empty.
  string name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Free-text description. Unset means none. When set, must not be empty.
  string description = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2048
  ];
  // When the first setup key stops being accepted; must lie in the future.
  // Unset means 180 days from issue.
  google.protobuf.Timestamp setup_key_expires_at = 3 [(buf.validate.field).timestamp.gt_now = true];
}

message CreateEdgeResponse {
  // The created edge. Must be present.
  flowseer.model.edge.v1.EdgeRecord edge = 1 [(buf.validate.field).required = true];
  // What to ship with the edge. Shown once; the setup key is not
  // retrievable afterwards. Must be present.
  flowseer.model.edge.v1.EdgeProvisioning provisioning = 2 [(buf.validate.field).required = true];
}

message IssueSetupKeyRequest {
  // The edge to issue a key to. Must be present.
  flowseer.model.edge.v1.EdgeGlobalRef edge = 1 [(buf.validate.field).required = true];
  // When the key stops being accepted; must lie in the future. Unset means
  // 180 days from issue.
  google.protobuf.Timestamp expires_at = 2 [(buf.validate.field).timestamp.gt_now = true];
}

message IssueSetupKeyResponse {
  // The edge after issue. Must be present.
  flowseer.model.edge.v1.EdgeRecord edge = 1 [(buf.validate.field).required = true];
  // What to ship with the edge. Shown once. Must be present.
  flowseer.model.edge.v1.EdgeProvisioning provisioning = 2 [(buf.validate.field).required = true];
}

message RevokeSetupKeyRequest {
  // The edge whose unused setup key to revoke. Must be present.
  flowseer.model.edge.v1.EdgeGlobalRef edge = 1 [(buf.validate.field).required = true];
}

message RevokeSetupKeyResponse {
  // The edge after revocation. Must be present.
  flowseer.model.edge.v1.EdgeRecord edge = 1 [(buf.validate.field).required = true];
}

message RetireEdgeRequest {
  // The edge to retire. Must be present.
  flowseer.model.edge.v1.EdgeGlobalRef edge = 1 [(buf.validate.field).required = true];
}

message RetireEdgeResponse {
  // The edge after retirement. Must be present.
  flowseer.model.edge.v1.EdgeRecord edge = 1 [(buf.validate.field).required = true];
  // The lanes the retirement orphaned, in device-id order. Retirement ends no
  // mutation, so each of these is work only an operator can end, through
  // DeviceService.AbandonMutation with the device and the sequence named
  // here. DeviceService.ListEdgeOpenMutations answers the same question with
  // the phase each mutation stopped at and its whole recorded state. Empty
  // means the edge held none.
  repeated OrphanedLane orphaned = 2 [(buf.validate.field).repeated.max_items = 1000];
}

// One mutation left open on a device the retired edge hosted.
message OrphanedLane {
  // The device, as DeviceLocalRef.id spells it. This API does not depend on
  // the device API — the dependency runs the other way, since a device
  // reference names the edge responsible for it — so the device is named here
  // by identifier rather than by reference. Must be present.
  string device_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The sequence AbandonMutation takes. Must be present and at least 1.
  uint64 sequence = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gte = 1
  ];
}

message GetEdgeRequest {
  // Must be present.
  flowseer.model.edge.v1.EdgeGlobalRef edge = 1 [(buf.validate.field).required = true];
}

message GetEdgeResponse {
  // Must be present.
  flowseer.model.edge.v1.EdgeRecord edge = 1 [(buf.validate.field).required = true];
}

message ListEdgesRequest {
  // Edges per page. Unset means the service default; never more than 500.
  uint32 page_size = 1 [
    (buf.validate.field).uint32.gt = 0,
    (buf.validate.field).uint32.lte = 500
  ];
  // Opaque token from the previous page. Unset means the first page.
  string page_token = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 1024
  ];
}

message ListEdgesResponse {
  // The page of edges in the service's stable order. Empty means the
  // listing is exhausted.
  repeated flowseer.model.edge.v1.EdgeRecord edges = 1;
  // Token for the next page. Unset means this was the last page.
  string next_page_token = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 1024
  ];
}
