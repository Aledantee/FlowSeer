edition = "2024";

// The edge family — the enrolled edge process through which FlowSeer runs
// integrations inside a site's network. An edge is the host, not an
// integration: the integrations it runs point at it.
package flowseer.api.edge.v1;

import "google/protobuf/timestamp.proto";
import option "buf/validate/validate.proto";

// The local reference to an edge.
message EdgeLocalRef {
  // FlowSeer-assigned edge identifier. Must be present.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// The global reference to an edge.
message EdgeGlobalRef {
  // The edge's own key. Must be present.
  EdgeLocalRef edge = 1 [(buf.validate.field).required = true];
}

// Where an edge stands between creation and retirement. Lifecycle and
// contact are separate axes: contact follows the heartbeat and heals on
// its own, while a lifecycle change is an enrollment or an operator action.
enum EdgeLifecycle {
  // No lifecycle named. State and events reject the zero value.
  EDGE_LIFECYCLE_UNSPECIFIED = 0;
  // Created with a setup key and not yet enrolled.
  EDGE_LIFECYCLE_PENDING = 1;
  // Enrolled; the edge holds a registered key and may call the edge service.
  EDGE_LIFECYCLE_ENROLLED = 2;
  // Retired by an operator. Its key is refused from the next call on; the
  // row and its history remain, and a new setup key returns it to pending.
  EDGE_LIFECYCLE_RETIRED = 3;
}

// How recently an enrolled edge was heard from. Derived from the last
// heartbeat against the tenant's thresholds; never set by hand.
enum EdgeContact {
  // No contact named. Enrolled state rejects the zero value.
  EDGE_CONTACT_UNSPECIFIED = 0;
  // Heartbeats arrive on schedule.
  EDGE_CONTACT_ACTIVE = 1;
  // Heartbeats missed past the stale threshold.
  EDGE_CONTACT_STALE = 2;
  // Silent past the dormant threshold. Still enrolled; the next heartbeat
  // returns it to active.
  EDGE_CONTACT_DORMANT = 3;
}

// What became of an issued setup key.
enum SetupKeyStatus {
  // No status named. Setup keys reject the zero value.
  SETUP_KEY_STATUS_UNSPECIFIED = 0;
  // Issued and usable for one enrollment.
  SETUP_KEY_STATUS_ISSUED = 1;
  // Used by an enrollment.
  SETUP_KEY_STATUS_CONSUMED = 2;
  // Revoked by an operator before use.
  SETUP_KEY_STATUS_REVOKED = 3;
  // Passed its expiry before use.
  SETUP_KEY_STATUS_EXPIRED = 4;
}

// The record of one setup key: the public half of what the operator was
// shown once. The key string itself and its hash never appear here.
message SetupKey {
  option (buf.validate.message).cel = {
    id: "setup_key.expires_after_issue"
    message: "expires_at must be after issued_at"
    expression: "!has(this.issued_at) || !has(this.expires_at) || this.expires_at > this.issued_at"
  };

  // The key's identifier, the middle segment of the key string. Safe to log.
  // Must be present.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z2-7]{26}$"
  ];
  // What became of the key. Must be present; the zero value is rejected.
  SetupKeyStatus status = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // When the key was issued. Must be present.
  google.protobuf.Timestamp issued_at = 3 [(buf.validate.field).required = true];
  // When an unused key stops being accepted. Must be present.
  google.protobuf.Timestamp expires_at = 4 [(buf.validate.field).required = true];
}

// The intended definition of one edge: what the operator calls it.
message EdgeConfig {
  // The ref to this edge. Must be present.
  EdgeGlobalRef ref = 1 [(buf.validate.field).required = true];
  // Operator-assigned display name. Unset means none was assigned. When
  // set, must not be empty.
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Free-text description of the edge. Unset means none was provided.
  // When set, must not be empty.
  string description = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2048
  ];
}

// The observed side of one edge: the key it registered, the setup key it
// was issued, and where it stands.
message EdgeState {
  option (buf.validate.message).cel = {
    id: "edge_state.enrolled_has_key"
    message: "an enrolled edge carries its public key"
    expression: "this.lifecycle != 2 || has(this.public_key)"
  };
  option (buf.validate.message).cel = {
    id: "edge_state.enrolled_has_contact"
    message: "an enrolled edge names its contact"
    expression: "this.lifecycle != 2 || this.contact != 0"
  };

  // The ref to this edge. Must be present.
  EdgeGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The edge's lifecycle. Must be present; the zero value is rejected.
  EdgeLifecycle lifecycle = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // How recently the edge was heard from. Unset means never enrolled; must
  // be present while the lifecycle is enrolled.
  EdgeContact contact = 3 [(buf.validate.field).enum = {defined_only: true}];
  // The edge's registered Ed25519 public key, 32 bytes. Unset means no
  // enrollment has registered one; must be present while the lifecycle is
  // enrolled.
  bytes public_key = 4 [(buf.validate.field).bytes.len = 32];
  // The most recently issued setup key. Unset means none was ever issued.
  SetupKey setup_key = 5;
  // When the current key was registered. Unset means never enrolled.
  google.protobuf.Timestamp enrolled_at = 6;
  // When the last authenticated call arrived. Unset means never enrolled.
  google.protobuf.Timestamp last_seen_at = 7;
}

// One transition of an edge's lifecycle.
message EdgeEvent {
  option (buf.validate.message).cel = {
    id: "edge_event.lifecycle_changes"
    message: "an edge event must change the lifecycle"
    expression: "!has(this.from) || this.from != this.to"
  };

  // The ref to the edge that changed. Must be present.
  EdgeGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The lifecycle before the transition. Unset means the edge was created.
  // The zero value is rejected.
  EdgeLifecycle from = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The lifecycle after the transition. Must be present; the zero value is
  // rejected.
  EdgeLifecycle to = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}
