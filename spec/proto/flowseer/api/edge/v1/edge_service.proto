edition = "2024";

// The service an edge calls. Enroll is the only call without an assertion;
// every other call carries a signed assertion in the Authorization header
// and is authorized as the edge that assertion names.
package flowseer.api.edge.v1;

import "flowseer/api/edge/v1/edge.proto";
import "flowseer/api/edge/v1/key_proof.proto";
import "google/protobuf/timestamp.proto";
import option "buf/validate/validate.proto";

service EdgeService {
  // Consumes a setup key and registers the edge's key. Repeating the call
  // with the same setup key and the same public key returns the same
  // answer; the same setup key with another public key is refused.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Replaces the calling edge's registered key with the one the proof
  // names. The old key is refused from the next call on. A call whose
  // proof names the key already registered succeeds without change, so an
  // edge that lost the response can repeat the call with either key.
  rpc Rekey(RekeyRequest) returns (RekeyResponse);
  // Reports that the edge is alive and returns central's clock.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message EnrollRequest {
  // The setup key string from the edge's provisioning. Must be present.
  string setup_key = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^fse1_[a-z2-7]{26}_[a-z2-7]{52}$"
  ];
  // Proof of possession of the key being registered, bound to the setup
  // key's identifier. Must be present.
  KeyProof proof = 2 [(buf.validate.field).required = true];
}

message EnrollResponse {
  // The enrolled edge. Must be present.
  EdgeGlobalRef edge = 1 [(buf.validate.field).required = true];
  // Central's clock when it answered; the edge trusts it for assertion
  // timestamps until its own clock is synchronized. Must be present.
  google.protobuf.Timestamp server_time = 2 [(buf.validate.field).required = true];
  // The audience value the edge puts in every assertion. Must be present.
  string audience = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The trust anchors to accept from now on, same encoding as in the
  // provisioning; replaces the shipped set. At least one is required.
  repeated bytes trust_anchors = 4 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 8,
    (buf.validate.field).repeated.items.bytes.len = 32
  ];
}

message RekeyRequest {
  // Proof of possession of the new key, bound to the nonce of this call's
  // assertion. Must be present.
  KeyProof proof = 1 [(buf.validate.field).required = true];
}

message RekeyResponse {
  // Central's clock when it answered. Must be present.
  google.protobuf.Timestamp server_time = 1 [(buf.validate.field).required = true];
}

message HeartbeatRequest {
  // The edge agent's build version, as the binary reports it. Must be
  // present.
  string agent_version = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Since when the edge has been holding data it could not deliver. Unset
  // means nothing is buffered.
  google.protobuf.Timestamp buffering_since = 2;
}

message HeartbeatResponse {
  // Central's clock when it answered. Must be present.
  google.protobuf.Timestamp server_time = 1 [(buf.validate.field).required = true];
}
