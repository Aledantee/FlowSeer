edition = "2024";

// The two device-credential lifecycles decision 9 of the verified-device-
// access record describes: a read credential for reads and preflight, and
// a one-use submission grant that opens only after central's checkpoint
// and carries the authority pulses the edge checks before each command.
// Both ride these authenticated Connect calls and never the bus.
package flowseer.api.edge.v1;

import "flowseer/device/policy/v1/handle.proto";
import "google/protobuf/timestamp.proto";
import option "buf/validate/validate.proto";

// One device credential as delivered to an edge: the pinned handle naming
// which version it is, and the opaque material itself.
message DeviceCredential {
  // Names the credential version this material is. Must be present.
  flowseer.device.policy.v1.CredentialHandle credential = 1 [(buf.validate.field).required = true];
  // The credential material: a password, a community string, or a key,
  // shaped by whatever protocol the binding uses. Must be present.
  bytes material = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.min_len = 1
  ];
}

// Requests a read credential for a binding, under the device's pinned
// access policy. The device and the binding are named as opaque
// identifiers rather than typed refs, because api/inventory imports
// api/edge and importing api/inventory back here would cycle the graph.
message AcquireReadCredentialRequest {
  // The device the credential is for. Must be present.
  string device_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The integration binding the credential is scoped to. Must be present.
  string binding_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The access policy version the operation was admitted under. Must be
  // present.
  flowseer.device.policy.v1.AccessPolicyHandle access_policy = 3 [(buf.validate.field).required = true];
}

message AcquireReadCredentialResponse {
  // Must be present.
  DeviceCredential credential = 1 [(buf.validate.field).required = true];
  // The host trust version to require while using this credential. Must be
  // present.
  flowseer.device.policy.v1.HostTrustHandle host_trust = 2 [(buf.validate.field).required = true];
  // When this credential stops being valid. There is no standing lease;
  // the edge acquires a fresh one for the next read. Must be present.
  google.protobuf.Timestamp expires_at = 3 [(buf.validate.field).required = true];
}

// Opens the stream that delivers a submission credential for one mutation
// sequence, once central has checkpointed POSSIBLY_APPLIED, and carries the
// authority pulses that follow it.
message OpenDeviceSubmissionRequest {
  // The device the mutation targets. Must be present.
  string device_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The integration binding running the mutation. Must be present.
  string binding_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // The device's lane sequence this submission is for, matching
  // flowseer.integration.device.v1.ExecuteRequest.sequence. Must be present
  // and at least 1.
  uint64 sequence = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gte = 1
  ];
}

// Whether the edge may still submit the command it holds a grant for.
enum SubmissionAuthority {
  SUBMISSION_AUTHORITY_UNSPECIFIED = 0;
  // The edge may proceed until this pulse's deadline.
  SUBMISSION_AUTHORITY_AUTHORIZED = 1;
  // Central has withdrawn authority; the edge must not submit or continue
  // submitting.
  SUBMISSION_AUTHORITY_REVOKED = 2;
}

// The one-use submission credential, delivered exactly once as the first
// message on the stream.
message SubmissionGrant {
  // Must be present.
  DeviceCredential credential = 1 [(buf.validate.field).required = true];
  // The host trust version to require while submitting. Must be present.
  flowseer.device.policy.v1.HostTrustHandle host_trust = 2 [(buf.validate.field).required = true];
  // By when the whole submission must complete. The edge treats this as a
  // monotonic bound: no later pulse on this stream lowers it. Must be
  // present.
  google.protobuf.Timestamp deadline = 3 [(buf.validate.field).required = true];
}

// A liveness and authority check the edge reads before running the next
// command in the sequence it holds a grant for.
message AuthorityPulse {
  // Must be present; the zero value is rejected.
  SubmissionAuthority authority = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The current deadline. Must be present.
  google.protobuf.Timestamp deadline = 2 [(buf.validate.field).required = true];
}

message OpenDeviceSubmissionResponse {
  // Exactly one update. The first message on the stream is always grant;
  // every later message is pulse.
  oneof update {
    option (buf.validate.oneof).required = true;

    SubmissionGrant grant = 1;
    AuthorityPulse pulse = 2;
  }
}
