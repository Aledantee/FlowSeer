edition = "2024";

// The link family — one observed adjacency between two interfaces, derived
// by the inventory service from LLDP or CDP announcements, LACP partner
// information, or forwarding-table inference. Deliberately partial: there
// is no LinkConfig, because nobody intends a link; the intended
// counterpart is a Cable, and the service reconciles the two. A link is
// top-level and holds both ends as ordinary fields. Link has not joined
// EntityType; nothing may name one through an EntityRef.
package flowseer.api.inventory.v1;

import "flowseer/api/inventory/v1/cable.proto";
import "flowseer/api/inventory/v1/device.proto";
import "google/protobuf/timestamp.proto";
import option "buf/validate/validate.proto";

// The local reference to a link.
message LinkLocalRef {
  // FlowSeer-assigned link identifier. Must be present.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// The global reference to a link.
message LinkGlobalRef {
  // The link's own key. Must be present.
  LinkLocalRef link = 1 [(buf.validate.field).required = true];
}

// Which observation the link is derived from.
enum LinkSource {
  // No source named. Links reject the zero value.
  LINK_SOURCE_UNSPECIFIED = 0;
  LINK_SOURCE_LLDP = 1;
  LINK_SOURCE_CDP = 2;
  // The LACP partner system and port on an aggregation member.
  LINK_SOURCE_LACP = 3;
  // Inferred from where a peer's MAC address is learned; weaker than an
  // announcement, because an intermediate unmanaged switch hides.
  LINK_SOURCE_FDB_INFERENCE = 4;
}

// Whether the link is still being observed.
enum LinkStatus {
  // No status named. Links reject the zero value.
  LINK_STATUS_UNSPECIFIED = 0;
  // The latest observation still reports it.
  LINK_STATUS_ACTIVE = 1;
  // Not reported for longer than the announcement's own time to live but
  // not yet past the tenant's threshold.
  LINK_STATUS_STALE = 2;
  // Past the threshold; kept so that a cable documented against it still
  // resolves.
  LINK_STATUS_GONE = 3;
}

// A system on the far end of a link that is not in the inventory,
// identified as the announcing protocol identifies it.
message ForeignSystem {
  // The chassis identifier as the announcement rendered it. Must be
  // present.
  string chassis_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The system name the announcement carried. Unset means it carried
  // none.
  string system_name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
}

// One end of a link: which system, and which of its interfaces.
message LinkEnd {
  // The interface name as the system on this end spells it: the local
  // interface for an inventoried device, the announced port identifier for
  // a foreign one. Must be present.
  string interface_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  // The system on this end. Exactly one arm.
  oneof system {
    option (buf.validate.oneof).required = true;

    // An inventoried device.
    DeviceGlobalRef device = 10;
    // A system the inventory does not hold.
    ForeignSystem foreign = 11;
  }
}

// The observed definition of one link: its two ends, what reported it,
// and when.
message LinkState {
  option (buf.validate.message).cel = {
    id: "link_state.ends_differ"
    message: "a link's two ends are different interfaces"
    expression: "!has(this.a) || !has(this.b) || this.a != this.b"
  };
  option (buf.validate.message).cel = {
    id: "link_state.seen_ordered"
    message: "last_seen is not before first_seen"
    expression: "!has(this.first_seen) || !has(this.last_seen) || this.last_seen >= this.first_seen"
  };

  // The ref to this link. Must be present.
  LinkGlobalRef ref = 1 [(buf.validate.field).required = true];
  // One end. Must be present. Which end is a and which is b carries no
  // meaning; the service compares ends as a set.
  LinkEnd a = 2 [(buf.validate.field).required = true];
  // The other end. Must be present.
  LinkEnd b = 3 [(buf.validate.field).required = true];
  // Which observation the link is derived from. Must be present; the zero
  // value is rejected.
  LinkSource source = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Whether the link is still being observed. Must be present; the zero
  // value is rejected.
  LinkStatus status = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // When the link was first observed. Must be present.
  google.protobuf.Timestamp first_seen = 6 [(buf.validate.field).required = true];
  // When the link was last reported. Must be present.
  google.protobuf.Timestamp last_seen = 7 [(buf.validate.field).required = true];
  // The documented cable the service reconciled this link to. Unset means
  // no cable matches, which is itself a finding.
  CableGlobalRef cable = 8;
}

// One transition of a link, carried as the observed definition before and
// after.
message LinkEvent {
  option (buf.validate.message).cel = {
    id: "link_event.before_matches_ref"
    message: "the before side must describe the entity the event names"
    expression:
      "!has(this.before) || !has(this.ref) || !has(this.before.ref) || "
      "this.before.ref.link.id == this.ref.link.id"
  };
  option (buf.validate.message).cel = {
    id: "link_event.after_matches_ref"
    message: "the after side must describe the entity the event names"
    expression:
      "!has(this.after) || !has(this.ref) || !has(this.after.ref) || "
      "this.after.ref.link.id == this.ref.link.id"
  };
  option (buf.validate.message).cel = {
    id: "link_event.one_side"
    message: "an event carries at least one side"
    expression: "has(this.before) || has(this.after)"
  };

  // The ref to the link that changed. Must be present.
  LinkGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The observed definition before the transition. Unset means the link
  // was first observed.
  LinkState before = 2;
  // The observed definition after the transition. Unset means the service
  // forgot the link.
  LinkState after = 3;
}
