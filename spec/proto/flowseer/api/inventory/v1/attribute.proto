edition = "2024";

// The attribute definition family — what an attribute is called, what type
// its values carry, how many values an assignment holds, and where it may
// attach — and the assignment family that carries the values themselves.
//
// Both families are deliberately partial: a definition and an assignment
// are pure operator intent with nothing observed or derived, so neither
// splits intent from state. Each family is its entity message plus its
// Event; there is no AttributeConfig, AttributeState, AttributeValueConfig,
// or AttributeValueState.
package flowseer.api.inventory.v1;

import "flowseer/api/inventory/v1/entity.proto";
import option "buf/validate/validate.proto";

// The local reference to an attribute definition.
message AttributeLocalRef {
  // FlowSeer-assigned definition identifier. Must be present.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// The global reference to an attribute definition.
message AttributeGlobalRef {
  // The definition's own key. Must be present.
  AttributeLocalRef attribute = 1 [(buf.validate.field).required = true];
}

// A free-text value type. Values parse as text of 1 to 2048 characters,
// enforced on the payload arm of AttributeValuePayload.
message StringType {}

// A numeric value type. Values carry the Number variant: an exact int64
// integer or a finite double.
message NumberType {}

// A closed-vocabulary value type: the operator defines the vocabulary as
// data on the definition and extends it with an ordinary update. A value
// carries one of these keys, and the key string is what survives a retype
// to string.
message EnumType {
  // The allowed value keys. Must hold at least one key; keys are stable
  // machine identifiers, never localized, unique within the list.
  repeated string values = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 256
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
        pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
      }
    }
  }];
}

// An entity-reference value type. Values point at an existing entity of the
// declared kind; the server checks existence at write time, and deleting
// the referenced entity silently removes the values that point at it.
message ReferenceType {
  // The kind referenced values must point at. Must be present; the zero
  // value is rejected.
  EntityType kind = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      not_in: [0]
    }
  ];
}

// The intended definition of one attribute: its display name, its value
// type, the entity kinds it may attach to, and the bounds on how many
// values one assignment holds.
//
// Constraints that need more state than this message carries are enforced
// by the inventory service: min_items never exceeds max_items, and every
// edit that can invalidate existing values — changing the type, removing
// an enum key, removing a target kind, tightening the value-count bounds
// below what an assignment already holds, or deleting the definition — is
// gated by an explicit operator decision to drop the invalidated values or
// abandon the edit. Survival under a type change is deterministic: only
// the enum-key-to-string conversion preserves values; every other type
// pair invalidates.
message Attribute {
  // The ref to this definition. Must be present.
  AttributeGlobalRef ref = 1 [(buf.validate.field).required = true];
  // Operator-assigned display name. Reads carry it localized per the RPC's
  // language header when a translation exists; otherwise it comes back in
  // English. The translation mapping is server-side and never part of the
  // payload.
  // Must be present.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Free-text description of what the attribute measures. Unset means none
  // was provided.
  // When set, must not be empty.
  string description = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2048
  ];
  // The entity kinds that may carry this attribute's values. Must hold at
  // least one kind; a write against any other kind is rejected.
  repeated EntityType targets = 5 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 16
    unique: true
    items: {
      enum: {
        not_in: [0]
      }
    }
  }];
  // The fewest values one assignment of this attribute may hold. Must be
  // present.
  uint32 min_items = 6 [(buf.validate.field).required = true];
  // The most values one assignment of this attribute may hold. Must be present.
  uint32 max_items = 7 [(buf.validate.field).required = true];

  // The type every value of this attribute must parse under. Exactly one
  // arm is set; the arm is the type, so consumers switch on it instead of
  // probing payloads.
  oneof type {
    option (buf.validate.oneof).required = true;

    // Values are free text.
    StringType string_type = 10;
    // Values are numbers.
    NumberType number_type = 11;
    // Values are keys from the definition's closed vocabulary.
    EnumType enum_type = 12;
    // Values are references to entities of one declared kind.
    ReferenceType reference_type = 13;
  }
}

// One transition of an attribute definition. Provenance and timing ride the
// event envelope, never this message.
message AttributeEvent {
  option (buf.validate.message).cel = {
    id: "attribute_event.has_side"
    message: "an attribute event must carry a before or an after"
    expression: "has(this.before) || has(this.after)"
  };
  option (buf.validate.message).cel = {
    id: "attribute_event.before_matches_ref"
    message: "the before side must describe the entity the event names"
    expression: "!has(this.before) || !has(this.ref) || !has(this.before.ref) || this.before.ref.attribute.id == this.ref.attribute.id"
  };
  option (buf.validate.message).cel = {
    id: "attribute_event.after_matches_ref"
    message: "the after side must describe the entity the event names"
    expression: "!has(this.after) || !has(this.ref) || !has(this.after.ref) || this.after.ref.attribute.id == this.ref.attribute.id"
  };

  // The ref to the definition that changed. Must be present.
  AttributeGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The intended definition before the transition. Unset means the
  // definition was created.
  Attribute before = 2;
  // The intended definition after the transition. Unset means the
  // definition was deleted.
  Attribute after = 3;
}

// The local reference to an attribute value assignment.
message AttributeValueLocalRef {
  // FlowSeer-assigned assignment identifier. Must be present.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// The global reference to an attribute value assignment.
message AttributeValueGlobalRef {
  // The assignment's own key. Must be present.
  AttributeValueLocalRef attribute_value = 1 [(buf.validate.field).required = true];
}

// A number as either of two precisions. The arm is part of the value:
// consumers switch on it instead of guessing whether a float carries an
// exact count. In JSON, the integer arm serializes as a string and the
// decimal arm as a number, so JSON consumers convert by arm.
message Number {
  // The precision the value was written in. Exactly one arm is set.
  oneof precision {
    option (buf.validate.oneof).required = true;

    // An exact integer.
    int64 integer = 1;
    // A finite floating-point number. NaN and infinities are rejected;
    // they have no meaning as an attribute value and poison comparisons.
    double decimal = 2 [(buf.validate.field).double.finite = true];
  }
}

// One value under the definition's declared type. The arm must match the
// definition — text under StringType, a number under NumberType, a
// vocabulary key under EnumType, a reference under ReferenceType — which
// needs the definition and is checked by the inventory service, not here.
message AttributeValuePayload {
  // The value itself. Exactly one arm is set.
  oneof value {
    option (buf.validate.oneof).required = true;

    // Free text, capped at the 2048 characters StringType declares.
    string text = 1 [(buf.validate.field).string = {
      min_len: 1
      max_len: 2048
    }];
    // A number.
    Number number = 2;
    // One key from the definition's closed vocabulary, in the same shape
    // EnumType constrains its keys to. Membership in the vocabulary is
    // checked by the service.
    string enum_key = 3 [(buf.validate.field).string = {
      min_len: 1
      max_len: 64
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
    }];
    // A reference to an existing entity of the definition's declared kind.
    // Existence and kind are checked by the service at write time; deleting
    // the referenced entity later removes this value from its owner without
    // prompting.
    EntityRef reference = 4;
  }
}

// The intended values one entity carries for one attribute: the assignment
// joining owner, definition, and payloads. Attachment implies a value;
// there is no valueless assignment.
//
// Rules that need more state than this message carries are enforced by the
// inventory service: at most one assignment exists per owner and
// definition, the owner's kind must be among the definition's targets,
// every payload must parse under the definition's type, and the payload
// count must fall within the definition's declared min_items and
// max_items. An assignment
// shares its owner's lifecycle and disappears with it, and disappears when
// a cascade removes its last value.
message AttributeValue {
  // The ref to this assignment. Must be present.
  AttributeValueGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The entity carrying the values. Must be present. The kind is dynamic,
  // which is what EntityRef exists for; the assignment is owned by exactly
  // this entity.
  EntityRef owner = 2 [(buf.validate.field).required = true];
  // The definition the values are written under. Must be present. The kind
  // is statically known, so the typed ref applies.
  AttributeGlobalRef attribute = 3 [(buf.validate.field).required = true];
  // The values themselves. Must hold at least one payload.
  repeated AttributeValuePayload values = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 128
  }];
}

// One transition of an assignment. Provenance and timing ride the event
// envelope, never this message — a cascade removal, an operator delete,
// and a drop during a definition retype all look like a deletion here, and
// the envelope says which happened.
message AttributeValueEvent {
  option (buf.validate.message).cel = {
    id: "attribute_value_event.has_side"
    message: "an attribute value event must carry a before or an after"
    expression: "has(this.before) || has(this.after)"
  };
  option (buf.validate.message).cel = {
    id: "attribute_value_event.before_matches_ref"
    message: "the before side must describe the entity the event names"
    expression:
      "!has(this.before) || !has(this.ref) || !has(this.before.ref) || "
      "this.before.ref.attribute_value.id == this.ref.attribute_value.id"
  };
  option (buf.validate.message).cel = {
    id: "attribute_value_event.after_matches_ref"
    message: "the after side must describe the entity the event names"
    expression:
      "!has(this.after) || !has(this.ref) || !has(this.after.ref) || "
      "this.after.ref.attribute_value.id == this.ref.attribute_value.id"
  };

  // The ref to the assignment that changed. Must be present.
  AttributeValueGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The intended assignment before the transition. Unset means it was
  // created.
  AttributeValue before = 2;
  // The intended assignment after the transition. Unset means it was
  // deleted.
  AttributeValue after = 3;
}
