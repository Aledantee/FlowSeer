edition = "2024";

// The binding family — one path to a device through one integration.
// Deliberately partial: there is no BindingConfig, because bindings are
// created by discovery and correlation and carry nothing an operator
// intends.
package flowseer.api.inventory.v1;

import "flowseer/api/inventory/v1/capability.proto";
import "flowseer/api/inventory/v1/device.proto";
import "flowseer/api/inventory/v1/integration.proto";
import "flowseer/net/addr/v1/ip.proto";
import "google/protobuf/timestamp.proto";
import option "buf/validate/validate.proto";

// The local reference to a binding.
message BindingLocalRef {
  // FlowSeer-assigned binding identifier. Must be present.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// The global reference to a binding.
message BindingGlobalRef {
  // The binding's own key. Must be present.
  BindingLocalRef binding = 1 [(buf.validate.field).required = true];
}

// Where a binding stands, from first sighting to retirement. Machine-owned
// end to end: reachability flaps and heals with nobody acting, and none of
// these values ever means the device is removed.
enum BindingStatus {
  // No status named. State and events reject the zero value.
  BINDING_STATUS_UNSPECIFIED = 0;
  // A new sighting not yet confirmed by an identity read.
  BINDING_STATUS_CANDIDATE = 1;
  // An identity read succeeded over this path.
  BINDING_STATUS_VERIFIED = 2;
  // Some requests over this path are failing.
  BINDING_STATUS_DEGRADED = 3;
  // No request over this path is getting through. Offline, never removed.
  BINDING_STATUS_UNREACHABLE = 4;
  // Retired with its integration, by the platform dropping the device, or
  // by an operator action. The row and its history remain.
  BINDING_STATUS_RETIRED = 5;
}

// What kind of failure a degraded or unreachable binding is seeing. The
// kinds ask for different responses, so consumers must not collapse them.
enum BindingFailureKind {
  // No failure kind named.
  BINDING_FAILURE_KIND_UNSPECIFIED = 0;
  // Requests get no answer at all.
  BINDING_FAILURE_KIND_TIMEOUT = 1;
  // The endpoint answers and rejects the credential.
  BINDING_FAILURE_KIND_AUTH_FAILED = 2;
  // The host answers on the wire but the management protocol does not. A
  // credential or configuration problem, never evidence toward
  // DEVICE_LIFECYCLE_MISSING.
  BINDING_FAILURE_KIND_MANAGEMENT_UNRESPONSIVE = 3;
}

// The protocol spoken at one management endpoint.
enum ManagementProtocol {
  // No protocol named. Endpoints reject the zero value.
  MANAGEMENT_PROTOCOL_UNSPECIFIED = 0;
  MANAGEMENT_PROTOCOL_SNMP = 1;
  MANAGEMENT_PROTOCOL_SSH = 2;
  MANAGEMENT_PROTOCOL_NETCONF = 3;
  MANAGEMENT_PROTOCOL_RESTCONF = 4;
  MANAGEMENT_PROTOCOL_GNMI = 5;
  MANAGEMENT_PROTOCOL_HTTP = 6;
}

// A directly-addressed management endpoint.
message ManagementEndpoint {
  // The management address. Must be present.
  flowseer.net.addr.v1.IpAddress ip = 1 [(buf.validate.field).required = true];
  // The transport port. Must be present.
  uint32 port = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 65535
  ];
  // The management protocol spoken at the endpoint. Must be present; the
  // zero value is rejected.
  ManagementProtocol protocol = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// The observed side of one binding: which device it reaches through which
// integration, at what address, and how the path is doing.
message BindingState {
  // The ref to this binding. Must be present.
  BindingGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The device this binding reaches. Must be present.
  DeviceGlobalRef device = 2 [(buf.validate.field).required = true];
  // The integration mediating this binding. Must be present.
  IntegrationGlobalRef integration = 3 [(buf.validate.field).required = true];
  // The binding's status. Must be present; the zero value is rejected.
  BindingStatus status = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Capability areas verified reachable over this binding. Unset means
  // capability discovery has not run yet.
  CapabilitySet capabilities = 5;
  // When a request over this binding last succeeded. Unset means none has
  // succeeded yet.
  google.protobuf.Timestamp last_success = 6;
  // When the binding became unreachable. Set only while the status is
  // BINDING_STATUS_UNREACHABLE.
  google.protobuf.Timestamp unreachable_since = 7;
  // The kind of failure the binding is currently seeing. Unset means it is
  // not failing. The zero value is rejected.
  BindingFailureKind failure_kind = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The integration-local address the device answers on.
  oneof address {
    option (buf.validate.oneof).required = true;

    // The platform's own identifier for the device, as the platform
    // spells it.
    string platform_id = 10 [
      (buf.validate.field).string.min_len = 1,
      (buf.validate.field).string.max_len = 256
    ];
    // The network endpoint, for kinds that reach the device directly.
    ManagementEndpoint endpoint = 11;
  }
}

// One transition of a binding, carried as the observed side before and
// after. Provenance and timing ride the event envelope, never this
// message.
message BindingEvent {
  option (buf.validate.message).cel = {
    id: "binding_event.has_side"
    message: "a binding event must carry a before or an after"
    expression: "has(this.before) || has(this.after)"
  };
  option (buf.validate.message).cel = {
    id: "binding_event.before_matches_ref"
    message: "the before side must describe the entity the event names"
    expression:
      "!has(this.before) || !has(this.ref) || !has(this.before.ref) || "
      "this.before.ref.binding.id == this.ref.binding.id"
  };
  option (buf.validate.message).cel = {
    id: "binding_event.after_matches_ref"
    message: "the after side must describe the entity the event names"
    expression:
      "!has(this.after) || !has(this.ref) || !has(this.after.ref) || "
      "this.after.ref.binding.id == this.ref.binding.id"
  };

  // The ref to the binding that changed. Must be present.
  BindingGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The observed side before the transition. Unset means the binding was
  // created.
  BindingState before = 2;
  // The observed side after the transition. Unset means the binding was
  // removed; retiring is an ordinary transition, not a removal.
  BindingState after = 3;
}
