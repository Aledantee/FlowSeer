edition = "2024";

// The integration-scope family — the platform's own hierarchy (a Meraki
// network, a SmartZone zone, a site's subnet), mirrored generically.
// Deliberately partial: there is no IntegrationScopeConfig, because scopes
// are synced from the platform and nothing about them is intended.
package flowseer.api.inventory.v1;

import "flowseer/api/inventory/v1/integration.proto";
import option "buf/validate/validate.proto";

// The local reference to a scope within its integration.
message IntegrationScopeLocalRef {
  // The platform's identifier for this scope, as the platform spells it.
  // Must be present.
  string platform_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
}

// The global reference to a scope.
message IntegrationScopeGlobalRef {
  // The owning integration. Must be present.
  IntegrationGlobalRef integration = 1 [(buf.validate.field).required = true];
  // The scope's own key. Must be present.
  IntegrationScopeLocalRef scope = 2 [(buf.validate.field).required = true];
}

// The observed definition of one scope: where the platform's hierarchy
// places it and what the platform calls it.
message IntegrationScopeState {
  option (buf.validate.message).cel = {
    id: "integration_scope_state.parent_same_integration"
    message: "a scope's parent must belong to the same integration"
    expression:
      "!has(this.ref) || !has(this.parent) || "
      "this.parent.integration.integration.id == this.ref.integration.integration.id"
  };
  option (buf.validate.message).cel = {
    id: "integration_scope_state.parent_not_self"
    message: "a scope cannot be its own parent"
    expression:
      "!has(this.ref) || !has(this.parent) || "
      "this.parent.scope.platform_id != this.ref.scope.platform_id"
  };

  // The ref to this scope. Must be present.
  IntegrationScopeGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The ref to the parent scope. Unset means this scope is a root of the
  // platform's hierarchy.
  IntegrationScopeGlobalRef parent = 2;
  // The platform's name for the scope. Must be present.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The kind-specific label for what the scope is, as the platform spells
  // it. Unset means the platform does not type its scopes.
  string type_label = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

// One transition of a scope, carried as the observed definition before and
// after. Provenance and timing ride the event envelope, never this
// message.
message IntegrationScopeEvent {
  option (buf.validate.message).cel = {
    id: "integration_scope_event.has_side"
    message: "a scope event must carry a before or an after"
    expression: "has(this.before) || has(this.after)"
  };
  option (buf.validate.message).cel = {
    id: "integration_scope_event.before_matches_ref"
    message: "the before side must describe the entity the event names"
    expression:
      "!has(this.before) || !has(this.ref) || !has(this.before.ref) || "
      "(this.before.ref.scope.platform_id == this.ref.scope.platform_id && "
      "this.before.ref.integration.integration.id == this.ref.integration.integration.id)"
  };
  option (buf.validate.message).cel = {
    id: "integration_scope_event.after_matches_ref"
    message: "the after side must describe the entity the event names"
    expression:
      "!has(this.after) || !has(this.ref) || !has(this.after.ref) || "
      "(this.after.ref.scope.platform_id == this.ref.scope.platform_id && "
      "this.after.ref.integration.integration.id == this.ref.integration.integration.id)"
  };

  // The ref to the scope that changed. Must be present.
  IntegrationScopeGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The observed definition before the transition. Unset means the scope
  // appeared in the platform's hierarchy.
  IntegrationScopeState before = 2;
  // The observed definition after the transition. Unset means the scope
  // left the platform's hierarchy.
  IntegrationScopeState after = 3;
}
