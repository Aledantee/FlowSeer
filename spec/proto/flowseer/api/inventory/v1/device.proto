edition = "2024";

// The device family — the physical box FlowSeer manages, independent of
// every integration that reaches it.
package flowseer.api.inventory.v1;

import "flowseer/api/inventory/v1/location.proto";
import "flowseer/device/policy/v1/handle.proto";
import "flowseer/net/addr/v1/eui.proto";
import option "buf/validate/validate.proto";

// The local reference to a device.
message DeviceLocalRef {
  // FlowSeer-assigned device identifier. Must be present.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// The global reference to a device.
message DeviceGlobalRef {
  // The device's own key. Must be present.
  DeviceLocalRef device = 1 [(buf.validate.field).required = true];
}

// Where a device stands in FlowSeer's knowledge of the estate. Lifecycle
// and reachability are separate axes: reachability is per binding and heals
// on its own, while a lifecycle change is an operator action or the
// missing-threshold policy.
enum DeviceLifecycle {
  // No lifecycle named. State and events reject the zero value.
  DEVICE_LIFECYCLE_UNSPECIFIED = 0;
  // Part of the managed estate.
  DEVICE_LIFECYCLE_ACTIVE = 1;
  // Every binding unreachable past the tenant's threshold. A system-set
  // suspicion about FlowSeer's knowledge, not a claim about the box; it
  // asks someone to look.
  DEVICE_LIFECYCLE_MISSING = 2;
  // Removed from service by a person or an explicit policy, never inferred
  // from the wire going quiet. The device keeps its history and refs; a
  // reappearing serial un-retires it instead of creating a duplicate.
  DEVICE_LIFECYCLE_RETIRED = 3;
}

// Who resolves a difference between the device and the configuration
// FlowSeer holds for it.
enum DeviceManagementMode {
  // No mode named. Config rejects the zero value.
  DEVICE_MANAGEMENT_MODE_UNSPECIFIED = 0;
  // A person owns the device's configuration. A managed field that changed
  // without a FlowSeer mutation blocks further mutations until an operator
  // accepts the observed state, restores the expected one, or replaces the
  // interrupted intent.
  DEVICE_MANAGEMENT_MODE_OPERATOR_MANAGED = 1;
  // FlowSeer owns the device's configuration. A managed field that changed
  // without a FlowSeer mutation is restored by an ordinary sequenced
  // reconciliation intent.
  DEVICE_MANAGEMENT_MODE_AUTHORITATIVE = 2;
}

// The intended definition of one device: what the operator calls it and
// how its configuration is governed.
message DeviceConfig {
  option (buf.validate.message).cel = {
    id: "device_config.rack_fields_need_location"
    message: "rack_position and rack_face are set only with a location"
    expression: "(!has(this.rack_position) && !has(this.rack_face)) || has(this.location)"
  };

  // The ref to this device. Must be present.
  DeviceGlobalRef ref = 1 [(buf.validate.field).required = true];
  // Operator-assigned display name. Unset means none was assigned;
  // consumers fall back to observed identity. When set, must not be empty.
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Free-text description of the device. Unset means none was provided.
  // When set, must not be empty.
  string description = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2048
  ];
  // Who resolves drift between the device and FlowSeer's expected
  // configuration. Must be present; the zero value is rejected.
  DeviceManagementMode management_mode = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The access policy governing reads and writes to this device, pinned to
  // a version. Must be present.
  flowseer.device.policy.v1.AccessPolicyHandle access_policy = 5 [(buf.validate.field).required = true];
  // Where the operator says the device is, as a FlowSeer-owned location.
  // Unset means nobody has placed it; a Placement under an integration
  // scope is the platform's answer and never substitutes for this one.
  LocationGlobalRef location = 6;
  // The lowest rack unit the device occupies, counted from 1 at the bottom
  // of the rack. Set only when location names a rack. Unset means the
  // position within the rack is not recorded.
  uint32 rack_position = 7 [
    (buf.validate.field).uint32.gte = 1,
    (buf.validate.field).uint32.lte = 100
  ];
  // Which face of the rack the device is mounted on. Set only when location
  // names a rack.
  RackFace rack_face = 8 [(buf.validate.field).enum.defined_only = true];
}

// The observed side of one device: the identity read off the box, what
// the box is, and the lifecycle FlowSeer holds for it. Serial and base MAC
// are correlation data the service merges sightings on, never the ref's
// key; addresses and platform ids are binding data and never appear here.
// Vendor, model, and software version are the whole-box reading; the
// per-part reading is the component tree in component.proto.
message DeviceState {
  // The ref to this device. Must be present.
  DeviceGlobalRef ref = 1 [(buf.validate.field).required = true];
  // Vendor serial number as the device reports it. Unset means no identity
  // read has yielded one yet.
  string serial = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  // Chassis base MAC as the device reports it. Unset means the device does
  // not expose one.
  flowseer.net.addr.v1.Eui48Address base_mac = 3;
  // The device's lifecycle. Must be present; the zero value is rejected.
  DeviceLifecycle lifecycle = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The device's own host name, as it reports it (sysName in RFC 3418).
  // Unset means no read has yielded one.
  string hostname = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  // The maker of the box, as the device or the reaching platform spells it.
  // Unset means no read has yielded one.
  string vendor = 6 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // The product model, as the device spells it (entPhysicalModelName of
  // the chassis in RFC 6933, or the platform's model field). Unset means no
  // read has yielded one.
  string model = 7 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // The chassis hardware revision, as the device spells it. Unset means the
  // device does not report one.
  string hardware_revision = 8 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  // The running software version, as the device spells it. This is the
  // human-readable version string; the fingerprint a mutation pins is on
  // the provenance and access status, not here. Unset means no read has
  // yielded one.
  string software_version = 9 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // The device's sysObjectID (RFC 3418) in dotted decimal, when it speaks
  // SNMP. The vendor identity tables key on it. Unset means the device did
  // not report one.
  string sys_object_id = 10 [
    (buf.validate.field).string.max_len = 256,
    (buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]+)*$"
  ];
}

// One transition of a device's lifecycle.
message DeviceEvent {
  option (buf.validate.message).cel = {
    id: "device_event.lifecycle_changes"
    message: "a device event must change the lifecycle"
    expression: "!has(this.from) || this.from != this.to"
  };

  // The ref to the device that changed. Must be present.
  DeviceGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The lifecycle before the transition. Unset means the device entered
  // the inventory. The zero value is rejected.
  DeviceLifecycle from = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The lifecycle after the transition. Must be present; the zero value is
  // rejected.
  DeviceLifecycle to = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}
