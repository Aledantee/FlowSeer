edition = "2024";

// The durable audit record of what an operator did: OperatorActionEvent and its
// detail kinds. Deliberately partial: there is no OperatorActionConfig or
// OperatorActionState, because this package is a pure event stream with no
// queryable current-state entity of its own.
package flowseer.event.operator.v1;

import "flowseer/model/capture/v1/capture_session.proto";
import "flowseer/model/edge/v1/edge.proto";
import "flowseer/model/identity/v1/access.proto";
import "flowseer/model/identity/v1/operator.proto";
import "flowseer/model/identity/v1/tenant.proto";
import "google/protobuf/timestamp.proto";
import option "buf/validate/validate.proto";

// The operator action recorded.
enum OperatorAction {
  OPERATOR_ACTION_UNSPECIFIED = 0;
  OPERATOR_ACTION_EDGE_CREATE = 1;
  OPERATOR_ACTION_SETUP_KEY_ISSUE = 2;
  OPERATOR_ACTION_SETUP_KEY_REVOKE = 3;
  OPERATOR_ACTION_EDGE_RETIRE = 4;
  OPERATOR_ACTION_EDGE_GET = 5;
  OPERATOR_ACTION_EDGE_LIST = 6;
  OPERATOR_ACTION_CAPTURE_FULL_PAYLOAD_CREATE = 7;
  OPERATOR_ACTION_CAPTURE_TAIL = 8;
  OPERATOR_ACTION_CAPTURE_DOWNLOAD = 9;
  OPERATOR_ACTION_TENANT_CREATE = 10;
  OPERATOR_ACTION_MEMBER_ENROLL = 11;
  OPERATOR_ACTION_MEMBER_REMOVE = 12;
  OPERATOR_ACTION_ROLE_CREATE = 13;
  OPERATOR_ACTION_ROLE_DELETE = 14;
  OPERATOR_ACTION_ROLE_ASSIGN = 15;
  OPERATOR_ACTION_ROLE_UNASSIGN = 16;
  OPERATOR_ACTION_PARTNER_CONNECT = 17;
  OPERATOR_ACTION_PARTNER_DISCONNECT = 18;
  OPERATOR_ACTION_FULL_PAYLOAD_GRANT = 19;
  OPERATOR_ACTION_FULL_PAYLOAD_REVOKE = 20;
}

// The outcome of an attempted operator action.
enum OperatorActionOutcome {
  OPERATOR_ACTION_OUTCOME_UNSPECIFIED = 0;
  OPERATOR_ACTION_OUTCOME_SUCCEEDED = 1;
  OPERATOR_ACTION_OUTCOME_DENIED = 2;
  OPERATOR_ACTION_OUTCOME_FAILED = 3;
}

// The operator started an action.
message OperatorActionAttempted {}

// The operator action completed.
message OperatorActionCompleted {
  option (buf.validate.message).cel = {
    id: "operator_action_completed.error_type_matches_outcome"
    message: "error_type is set if and only if outcome is not succeeded"
    expression: "has(this.error_type) == (this.outcome != 1)"
  };

  // The outcome of the action. Must be present; the zero value is rejected.
  OperatorActionOutcome outcome = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The error type classification when the action did not succeed. Set if and
  // only if outcome is not succeeded.
  string error_type = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

// A role and the relations included in an operator action object.
message OperatorActionRole {
  // The role identity. Must be present.
  flowseer.model.identity.v1.RoleGlobalRef role = 1 [(buf.validate.field).required = true];
  // The role's relations. A deletion record names the role and has no
  // relations. When present, the list contains one to four distinct, defined
  // relations.
  repeated flowseer.model.identity.v1.TenantRelation relations = 2 [
    (buf.validate.field).repeated.max_items = 4,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.enum.defined_only = true,
    (buf.validate.field).repeated.items.enum.not_in = 0
  ];
}

// A role assignment included in an operator action object.
message OperatorActionRoleAssignment {
  // The role assigned. Must be present.
  flowseer.model.identity.v1.RoleGlobalRef role = 1 [(buf.validate.field).required = true];
  // The member assigned. Must be present.
  flowseer.model.identity.v1.OperatorRef member = 2 [(buf.validate.field).required = true];
}

// A partner link and the relations included in an operator action object.
message OperatorActionPartner {
  option (buf.validate.message).cel = {
    id: "operator_action_partner.relations_exclude_admin"
    message: "partner relations must not include admin"
    expression: "this.relations.all(r, int(r) != 1)"
  };

  // The provider tenant. Must be present.
  flowseer.model.identity.v1.TenantGlobalRef tenant = 1 [(buf.validate.field).required = true];
  // The relations granted to the provider. Must contain one to three
  // distinct, defined non-admin relations.
  repeated flowseer.model.identity.v1.TenantRelation relations = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 3,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.enum.defined_only = true,
    (buf.validate.field).repeated.items.enum.not_in = 0
  ];
}

// A full-payload grant included in an operator action object.
message OperatorActionFullPayloadGrant {
  // The member granted access. Must be present.
  flowseer.model.identity.v1.OperatorRef member = 1 [(buf.validate.field).required = true];
  // When the grant expires. Must be present.
  google.protobuf.Timestamp expires_at = 2 [(buf.validate.field).required = true];
}

// One durable audit record for an operator action. An attempted event is
// delivered before the handler runs. A completed event is delivered after the
// handler returns.
message OperatorActionEvent {
  // FlowSeer-assigned event identifier, unique for deduplication. Must be present.
  string event_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Identifier joining the attempt and completion of one call. Must be present.
  string call_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // When the event occurred. Must be present.
  google.protobuf.Timestamp occurred_at = 3 [(buf.validate.field).required = true];
  // The operator who performed the action. Must be present.
  flowseer.model.identity.v1.OperatorRef operator = 4 [(buf.validate.field).required = true];
  // The action being performed. Must be present; the zero value is rejected.
  OperatorAction action = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Optional target object of the action. Unset when the action has no target
  // or when a target created by the action is not known yet.
  oneof object {
    flowseer.model.edge.v1.EdgeGlobalRef edge = 10;
    flowseer.model.capture.v1.CaptureSessionGlobalRef capture_session = 11;
    flowseer.model.identity.v1.TenantGlobalRef tenant = 12;
    flowseer.model.identity.v1.OperatorRef member = 13;
    OperatorActionRole role = 14;
    OperatorActionRoleAssignment role_assignment = 15;
    OperatorActionPartner partner = 16;
    OperatorActionFullPayloadGrant full_payload_grant = 17;
  }

  // Exactly one detail kind.
  oneof detail {
    option (buf.validate.oneof).required = true;

    OperatorActionAttempted attempted = 20;
    OperatorActionCompleted completed = 21;
  }
}
