edition = "2024";

package flowseer.ip.v1;

import "flowseer/ip/v1/address_origin.proto";
import "flowseer/ip/v1/address_status.proto";
import "flowseer/net/addr/v1/ip.proto";
import option "buf/validate/validate.proto";

// An IP address and network prefix assigned to one device-local interface.
// This is a table row, not an address value: canonical address, prefix, scope,
// and lifetime types remain in flowseer.net.addr.v1.
message InterfaceAddress {
  option (buf.validate.message).cel = {
    id: "interface_address.family_matches"
    message: "address and prefix must use the same IP family"
    expression: "!has(this.address) || !has(this.prefix) || has(this.address.v4) == has(this.prefix.v4)"
  };

  // The device-reported interface name. Absent or empty is invalid; omit the
  // containing InterfaceAddress when no interface identity is available.
  string interface_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The assigned host address. Absent is invalid; omit the containing
  // InterfaceAddress when no assignment was observed.
  flowseer.net.addr.v1.IpAddress address = 2 [(buf.validate.field).required = true];

  // The canonical network prefix containing the assigned address. Absent is
  // invalid. Membership is checked by consumers because validation has no
  // reusable bit-prefix comparison for the two byte-address values.
  flowseer.net.addr.v1.IpPrefix prefix = 3 [(buf.validate.field).required = true];

  // How the address was assigned. Absent means the source did not report an
  // origin.
  AddressOrigin origin = 4;

  // Current usability of the address. Absent means the source did not report
  // a status.
  AddressStatus status = 5;

  // Coarse routing or topology scope. Absent means the source did not report
  // a scope and FlowSeer has not classified one.
  flowseer.net.addr.v1.IpScope scope = 6;

  // Preferred and valid lease lifetimes. Absent means no lifetime information
  // was observed; a present empty value means both lifetimes are infinite.
  flowseer.net.addr.v1.IpLifetime lifetime = 7;
}
