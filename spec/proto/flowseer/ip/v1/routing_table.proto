edition = "2024";

package flowseer.ip.v1;

import "flowseer/net/addr/v1/ip.proto";
import option "buf/validate/validate.proto";

// A Routing Information Base descriptor. Routes refer to it by name so the
// table metadata is represented once rather than copied into every row. Each
// table carries one address family, as specified by RFC 8349.
message RoutingTable {
  // The device-local table or RIB name. Absent or empty is invalid; omit the
  // containing RoutingTable when no table identity is available.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The address family stored in the table. Absent and UNSPECIFIED are invalid
  // because a RIB cannot mix address families.
  flowseer.net.addr.v1.IpVersion address_family = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      not_in: [0]
    }
  ];

  // Whether this is the default RIB for its address family. Absent means the
  // source did not report which table is the default; false is an explicit
  // non-default designation.
  bool is_default = 3;

  // Device-supplied description. Absent means none was reported; an empty
  // string means the source explicitly reported an empty description.
  string description = 4;
}
