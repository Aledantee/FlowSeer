edition = "2024";

// The execution envelope between central and the integration that runs one
// device's lane: what central dispatches, what the edge reports back, and
// the checkpoint and terminal-result acknowledgements the central journal
// barrier requires.
// Every message here is scoped to a channel already addressed to one device
// and one edge, so nothing here carries a device or edge ref; MutationIntent
// carries its own device ref for the mutation case, and a TypedRead needs
// none because the transport supplies it.
package flowseer.integration.device.v1;

import "flowseer/device/access/v1/interface.proto";
import "flowseer/device/access/v1/operation.proto";
import "flowseer/errs/v1/error.proto";
import "google/protobuf/timestamp.proto";
import option "buf/validate/validate.proto";

// Central's dispatch of one operation to the edge hosting the device's lane.
message ExecuteRequest {
  // The device's lane sequence this operation was admitted at. Must be
  // present and at least 1.
  uint64 sequence = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gte = 1
  ];
  // By when the edge must complete the operation. Must be present.
  google.protobuf.Timestamp deadline = 2 [(buf.validate.field).required = true];
  // De-duplicates a resubmission of this dispatch after a connection
  // interruption. Must be present.
  string idempotency_key = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Exactly one operation.
  oneof operation {
    option (buf.validate.oneof).required = true;

    flowseer.device.access.v1.MutationIntent mutation = 10;
    flowseer.device.access.v1.TypedRead read = 11;
  }
}

// What the edge reports back after running one ExecuteRequest.
message ExecuteResult {
  // The sequence this result answers. Must be present and at least 1.
  uint64 sequence = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gte = 1
  ];
  // The phase the edge reached before returning. Must be present; the zero
  // value is rejected.
  flowseer.device.access.v1.OperationPhase phase_reached = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Exactly one outcome.
  oneof outcome {
    option (buf.validate.oneof).required = true;

    flowseer.device.access.v1.InterfaceObservation observation = 10;
    flowseer.errs.v1.ErrorPayload error = 11;
  }
}

// Central's durable record that a command may reach the device, sent before
// submission so a lost connection cannot become a duplicate command.
message CheckpointRequest {
  // The sequence entering POSSIBLY_APPLIED. Must be present and at least 1.
  uint64 sequence = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gte = 1
  ];
}

// The edge's acknowledgement that it received the checkpoint and may submit
// the command.
message CheckpointAck {
  // The sequence acknowledged. Must be present and at least 1.
  uint64 sequence = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gte = 1
  ];
}

// Central's durable acknowledgement that it holds the mutation's terminal
// disposition, which frees the device's lane for the next sequence.
message TerminalResultAck {
  // The sequence whose terminal disposition central now holds. Must be
  // present and at least 1.
  uint64 sequence = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gte = 1
  ];
  // The disposition central recorded. Must be present; the zero value is
  // rejected.
  flowseer.device.access.v1.Disposition disposition = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}
