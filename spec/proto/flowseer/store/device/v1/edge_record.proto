edition = "2024";

// What the device service stores about one edge beyond its public record:
// the digest of the setup key it was issued. Storage, not a boundary; the
// record itself is the model/edge triad and needs none of its own.
package flowseer.store.device.v1;

import "flowseer/model/edge/v1/edge.proto";
import option "buf/validate/validate.proto";

message StoredEdge {
  // Must be present.
  flowseer.model.edge.v1.EdgeRecord record = 1 [(buf.validate.field).required = true];
  // SHA-256 of the whole setup key string most recently issued. It outlives
  // the key's consumption, because a repeated enrollment must recognize the
  // key it already consumed and answer with the same identity; it is cleared
  // when the key is revoked or the edge retired. Unset means no key was
  // issued, or the one issued was withdrawn.
  bytes setup_key_hash = 2 [(buf.validate.field).bytes.len = 32];
}
