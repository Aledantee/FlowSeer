edition = "2024";

// Central's durable record of one device's lane: the open mutation, what
// the edge has confirmed about it, the open reads, and the expected and
// last observed state per managed interface. Storage the device service
// writes to its own bucket, not a boundary any other process reads. Not an
// entity: nothing configures or observes a lane record, so there is no
// triad and no ref pair.
package flowseer.store.device.v1;

import "flowseer/api/inventory/v1/device.proto";
import "flowseer/device/access/v1/interface.proto";
import "flowseer/device/access/v1/operation.proto";
import "flowseer/errs/v1/error.proto";
import "google/protobuf/timestamp.proto";
import option "buf/validate/validate.proto";

message DeviceLaneRecord {
  option (buf.validate.message).cel = {
    id: "device_lane_record.mutation_has_admission_time"
    message: "an open mutation carries its admission time"
    expression: "has(this.mutation) == has(this.admitted_at)"
  };
  option (buf.validate.message).cel = {
    id: "device_lane_record.sequences_under_watermark"
    message: "no open sequence exceeds the high watermark"
    expression: "(!has(this.mutation) || !has(this.mutation.sequence) || this.mutation.sequence <= this.high_watermark) && this.open_reads.all(k, this.open_reads[k].sequence <= this.high_watermark) && this.hold_resolution_pending.all(s, s <= this.high_watermark)"
  };
  option (buf.validate.message).cel = {
    id: "device_lane_record.confirmations_need_a_mutation"
    message: "dispatch and checkpoint facts exist only for an open mutation"
    expression: "has(this.mutation) || (!this.dispatched && !this.dispatch_confirmed && !this.checkpoint_confirmed && !has(this.last_reported_phase))"
  };

  // Must be present.
  flowseer.api.inventory.v1.DeviceGlobalRef device = 1 [(buf.validate.field).required = true];
  // The highest sequence assigned on this device, to mutations and reads
  // alike. Implicit presence: zero and never assigned are one state.
  uint64 high_watermark = 2 [features.field_presence = IMPLICIT];
  // The mutation that holds the lane. Unset means the lane is free.
  flowseer.device.access.v1.MutationState mutation = 3;
  // When the open mutation was admitted; carried on a resumed dispatch as
  // the start of its delayed-apply horizon. Set exactly with mutation.
  google.protobuf.Timestamp admitted_at = 4;
  // Whether the edge ever reported the open mutation admitted. Survives
  // an edge restart, unlike the confirmations below. Implicit presence.
  bool dispatched = 5 [features.field_presence = IMPLICIT];
  // The phase the edge last reported for the open mutation. Unset means no
  // report yet. The zero value is rejected.
  flowseer.device.access.v1.OperationPhase last_reported_phase = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Whether the current dispatch of the open mutation is confirmed by the
  // edge. Cleared when the edge reports onboarded. Implicit presence.
  bool dispatch_confirmed = 7 [features.field_presence = IMPLICIT];
  // Whether the edge acknowledged the checkpoint. Cleared when the edge
  // reports onboarded. Implicit presence.
  bool checkpoint_confirmed = 8 [features.field_presence = IMPLICIT];
  // The sequence whose hold resolution central recorded and the edge has
  // not yet confirmed. Unset means none is owed. This alone derives the
  // hold row; an edge reporting onboarded leaves it as it is, since the
  // resolution is re-sent and a restarted edge acknowledges it without a
  // hold to clear. A set, not one value: a restore admits a new intent at the
  // next sequence while the abandoned sequence's hold is still unacknowledged,
  // so more than one hold can be pending at once, and abandoning an
  // un-dispatched intent adds its sequence here rather than replacing what is
  // already pending.
  repeated uint64 hold_resolution_pending = 9 [(buf.validate.field).repeated = {
    unique: true
    max_items: 64
    items: {
      uint64: {gte: 1}
    }
  }];
  // Reads in flight, keyed by the interface name the device spells.
  map<string, OpenRead> open_reads = 10 [(buf.validate.field).map = {
    max_pairs: 256
    keys: {
      string: {
        min_len: 1
        max_len: 64
        pattern: "^[A-Za-z0-9][A-Za-z0-9 ./:_-]*$"
      }
    }
  }];
  // The description central expects per managed interface, keyed by
  // interface name. An interface absent here is not managed.
  map<string, string> expected_descriptions = 11 [(buf.validate.field).map = {
    max_pairs: 256
    keys: {
      string: {
        min_len: 1
        max_len: 64
        pattern: "^[A-Za-z0-9][A-Za-z0-9 ./:_-]*$"
      }
    }
    values: {
      string: {
        max_len: 64
        pattern: "^[ -~]*$"
      }
    }
  }];
  // The last complete observation per managed interface, keyed by
  // interface name.
  map<string, flowseer.device.access.v1.InterfaceObservation> last_observations = 12 [(buf.validate.field).map = {
    max_pairs: 256
    keys: {
      string: {
        min_len: 1
        max_len: 64
        pattern: "^[A-Za-z0-9][A-Za-z0-9 ./:_-]*$"
      }
    }
  }];
  // The firmware fingerprint the edge last reported. Unset means no probe
  // has been reported yet.
  string firmware_fingerprint = 13 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // The most recent idempotency keys and the sequences they were admitted
  // at, oldest first; a resubmission with a listed key returns its
  // sequence's state instead of admitting again, once its intent is shown
  // to be the one the key was admitted with.
  repeated IdempotencyEntry idempotency = 14 [(buf.validate.field).repeated.max_items = 64];
}

// One read in flight, or just finished, on the device's lane.
message OpenRead {
  // Must be present and at least 1.
  uint64 sequence = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gte = 1
  ];
  // Must be present.
  flowseer.device.access.v1.TypedRead read = 2 [(buf.validate.field).required = true];
  // After this the read is closed with a deadline error and its row is no
  // longer owed. Must be present.
  google.protobuf.Timestamp deadline = 3 [(buf.validate.field).required = true];
  // The key every dispatch of this read carries, minted once when the
  // entry opens, so a re-sent dispatch is the same read. Must be present.
  string idempotency_key = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // The read's outcome once it closed, kept for the waiter until the next
  // write removes the entry. Unset means the read is still open.
  oneof outcome {
    flowseer.device.access.v1.InterfaceObservation observation = 10;
    flowseer.errs.v1.ErrorPayload error = 11;
  }
}

// One admitted idempotency key.
message IdempotencyEntry {
  // Must be present.
  string idempotency_key = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Must be present and at least 1.
  uint64 sequence = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint64.gte = 1
  ];
  // A digest of the intent this key was admitted with, so a key that returns
  // a recorded state is a key whose intent matched. The caller promises that
  // one key means one intent; central cannot take that on trust, because a
  // resubmission that differs would otherwise be answered with a description
  // of the new intent attached to a sequence that did something else. Eight
  // bytes: this detects a client reusing a key by mistake, not a forger.
  // Must be present.
  bytes intent_digest = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 8
  ];
  // How the sequence ended, recorded when its mutation closed and the record
  // stopped holding it. Unset while the mutation is still open, when the
  // record itself carries the state. It is what a resubmission after the
  // close reads: without it the answer is a bare released, which an operator
  // cannot tell from success. The zero value is rejected.
  flowseer.device.access.v1.Disposition disposition = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
