edition = "2024";

// The durable envelope used by the service-local bus. Its package name,
// message name, field numbers, and enum numbers are persisted identities;
// changing any of them requires a queued-data migration.
package flowseer.service.v1;

import option "buf/validate/validate.proto";

// How the bus routes and interprets a persisted message.
enum MessageKind {
  // No kind named. Persisted messages reject this value.
  MESSAGE_KIND_UNSPECIFIED = 0;
  // Work addressed to one module mailbox.
  MESSAGE_KIND_COMMAND = 1;
  // One durable copy of an event for a snapshotted subscriber.
  MESSAGE_KIND_EVENT = 2;
  // A correlated response delivered through an ordinary module mailbox.
  MESSAGE_KIND_REPLY = 3;
}

// A protobuf payload and the routing context needed to resume its delivery.
// Binary readers must preserve unknown fields so newer writers can add
// envelope data without making queued records unreadable by older binaries.
message Message {
  // The routing kind. Must be present; the zero and unknown values are
  // rejected before persistence or handler delivery.
  MessageKind kind = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Stable identifier for this message and every redelivery of it. Must be
  // present as a UUID.
  string message_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Stable identifier shared by messages in one request flow. Unset starts
  // an uncorrelated flow; when set, it must be a UUID.
  string correlation_id = 3 [(buf.validate.field).string.uuid = true];
  // Stable identifier of the message that caused this one. Unset means there
  // is no parent message; when set, it must be a UUID.
  string causation_id = 4 [(buf.validate.field).string.uuid = true];
  // Canonical logical path of the publishing module. Must be present. Each
  // slash-separated segment is lower snake case.
  string source_path = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9]*(?:_[a-z0-9]+)*(?:/[a-z][a-z0-9]*(?:_[a-z0-9]+)*)*$"
  ];
  // Canonical logical path of the durable target mailbox. Must be present.
  // Event fan-out stores one envelope for each snapshotted subscriber.
  string target_path = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9]*(?:_[a-z0-9]+)*(?:/[a-z][a-z0-9]*(?:_[a-z0-9]+)*)*$"
  ];
  // Fully-qualified protobuf name used by the allowlisted payload resolver.
  // Must be present.
  string type_name = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256,
    (buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)+$"
  ];
  // Binary protobuf message named by type_name. Must be present; an empty
  // value is valid for a payload whose fields are all unset.
  bytes payload = 8 [(buf.validate.field).required = true];
  // W3C traceparent header captured when the message is published. Unset
  // means the publisher supplied no trace context.
  string traceparent = 9 [
    (buf.validate.field).string.max_len = 128,
    (buf.validate.field).string.pattern = "^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}(?:-.+)?$"
  ];
  // W3C tracestate header captured beside traceparent. Unset means the
  // publisher supplied no vendor trace state.
  string tracestate = 10 [(buf.validate.field).string.max_len = 512];
}
