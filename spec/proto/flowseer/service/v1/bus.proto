edition = "2024";

// Durable control records for a service-local bus. These messages are private
// runtime storage contracts rather than public API request or response types.
package flowseer.service.v1;

import "flowseer/service/v1/message.proto";
import option "buf/validate/validate.proto";

// One statically declared subscription in a runtime manifest.
message SubscriptionContract {
  // The routing kind used by this subscription.
  MessageKind kind = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The canonical protobuf full name accepted by the handler.
  string type_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256,
    (buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)+$"
  ];
  // Prior persisted names that remain decodable as type_name.
  repeated string aliases = 3 [
    (buf.validate.field).repeated.max_items = 256,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.max_len = 256,
    (buf.validate.field).repeated.items.string.pattern = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)+$"
  ];
  // Committed retries allowed after the initial handler call.
  uint32 retries = 4 [(buf.validate.field).uint32.lte = 100];
}

// The persisted identity and delivery contract for one leaf module.
message ModuleContract {
  // Canonical slash-separated module path.
  string path = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9]*(?:_[a-z0-9]+)*(?:/[a-z][a-z0-9]*(?:_[a-z0-9]+)*)*$"
  ];
  // Collision-free path token used in private subjects.
  string path_token = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 340,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]+$"
  ];
  // Stable JetStream durable consumer name.
  string durable_name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[a-z0-9_-]+$"
  ];
  // Static subscriptions in declaration order.
  repeated SubscriptionContract subscriptions = 4;
  // Fixed mailbox worker bound.
  uint32 delivery_concurrency = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 64
    }
  ];
}

// The complete persisted routing and broker contract for one service binary.
message RuntimeManifest {
  // Service tenancy namespace.
  string service_namespace = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  // Service identity within service_namespace.
  string service_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  // Private JetStream domain derived from the service identity.
  string domain = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^v1_[a-z2-7]+$"
  ];
  // Fully-qualified durable envelope name.
  string envelope_type = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256,
    (buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)+$"
  ];
  // Runtime envelope encoding version.
  uint32 envelope_version = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1
  ];
  // Private subject encoding version.
  uint32 subject_version = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1
  ];
  // Exact embedded NATS server version that last committed the manifest.
  string nats_version = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+].+)?$"
  ];
  // Static leaf contracts, including currently disabled leaves.
  repeated ModuleContract modules = 8 [(buf.validate.field).repeated.min_items = 1];
}

// The last durable phase completed by an idempotent reconciliation.
enum ReconciliationPhase {
  // No phase recorded. Persisted records reject this value.
  RECONCILIATION_PHASE_UNSPECIFIED = 0;
  // Previous and desired manifests were durably prepared.
  RECONCILIATION_PHASE_PREPARED = 1;
  // Mailbox stream changes were completed.
  RECONCILIATION_PHASE_MAILBOX_STREAM = 2;
  // Metadata stream changes were completed.
  RECONCILIATION_PHASE_METADATA_STREAM = 3;
  // Durable consumer changes were completed.
  RECONCILIATION_PHASE_CONSUMERS = 4;
  // The desired manifest became the committed generation.
  RECONCILIATION_PHASE_COMMITTED = 5;
}

// A resumable manifest transition stored before any broker mutation.
message ReconciliationRecord {
  // Previously committed manifest. It is absent for the first generation.
  RuntimeManifest previous = 1;
  // Desired manifest for the starting binary.
  RuntimeManifest desired = 2 [(buf.validate.field).required = true];
  // SHA-256 of the deterministic desired encoding.
  bytes desired_checksum = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.len = 32
  ];
  // Last completed reconciliation phase.
  ReconciliationPhase phase = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// The stable provenance sidecar checked before a NATS version opens a store.
message StoreProvenance {
  // Sidecar layout version.
  uint32 format_version = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).uint32.gte = 1
  ];
  // NATS server version allowed to open this store without an operator backup.
  string nats_version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+].+)?$"
  ];
  // Service namespace that owns the store.
  string service_namespace = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Service name that owns the store.
  string service_name = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // JetStream domain that owns the store.
  string domain = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^v1_[a-z2-7]+$"
  ];
}

// The durable terminal intent for a mailbox delivery.
enum SettlementState {
  // No state recorded. Persisted records reject this value.
  SETTLEMENT_STATE_UNSPECIFIED = 0;
  // The next handler retry was durably counted.
  SETTLEMENT_STATE_RETRY = 1;
  // Successful handling is awaiting confirmed broker acknowledgement.
  SETTLEMENT_STATE_ACKNOWLEDGE = 2;
  // Terminal discard is awaiting confirmed broker acknowledgement.
  SETTLEMENT_STATE_DISCARD = 3;
}

// Retry and settlement state that survives delivery-process interruption.
message Settlement {
  // Canonical target mailbox path.
  string target_path = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9]*(?:_[a-z0-9]+)*(?:/[a-z][a-z0-9]*(?:_[a-z0-9]+)*)*$"
  ];
  // Stable UUID of the logical message.
  string message_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Number of committed retry transitions.
  uint32 retry_count = 3;
  // Stable UUID for deduplicating disposition telemetry.
  string disposition_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  // Durable action to resume.
  SettlementState state = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}
