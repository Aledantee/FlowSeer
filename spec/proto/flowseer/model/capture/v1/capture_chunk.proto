edition = "2024";

// The chunk frames both capture services share: CapturePacketChunk is what
// an edge uploads and what an operator tails, CaptureArtifactChunk is what
// an operator downloads. Kept in their own file so CaptureService and
// CaptureEdgeService both import this file instead of importing each other.
//
// CapturePacketChunk is bounded by construction, not by a CEL sum over a
// repeated field: PacketRecord.data caps each packet at 65535 octets and
// this file caps the packet count at 4096, so the chunk's worst case is
// their product.
package flowseer.model.capture.v1;

import "flowseer/model/capture/v1/capture_session.proto";
import "flowseer/net/capture/v1/capture_counters.proto";
import "flowseer/net/capture/v1/packet_record.proto";
import option "buf/validate/validate.proto";

// One bounded slice of a session's packets, in delivery order.
message CapturePacketChunk {
  // The session this chunk belongs to. Must be present.
  CaptureSessionGlobalRef session = 1 [(buf.validate.field).required = true];
  // The sequence of the first packet in this chunk. Must be present.
  uint64 first_sequence = 2 [(buf.validate.field).required = true];
  // The packets carried in this chunk, in sequence order starting at
  // first_sequence.
  repeated flowseer.net.capture.v1.PacketRecord packets = 3 [(buf.validate.field).repeated = {max_items: 4096}];
  // Pipeline counters as of this chunk. Unset means none observed yet.
  flowseer.net.capture.v1.CaptureCounters counters = 4;
  // Whether this is the last chunk of the stream. Unset means more chunks
  // follow.
  bool final = 5;
}

// One bounded slice of a session's stored pcapng artifact.
message CaptureArtifactChunk {
  // Byte offset of this chunk within the stored artifact. Must be present.
  uint64 offset = 1 [(buf.validate.field).required = true];
  // The artifact bytes at this offset. Must be present.
  bytes data = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).bytes.max_len = 1048576
  ];
  // Whether this is the last chunk of the stream. Unset means more chunks
  // follow.
  bool final = 3;
}
