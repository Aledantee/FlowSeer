edition = "2024";

// The integration family — a configured adapter instance: the cloud
// tenant, controller, or site-local network through which FlowSeer reaches
// devices. Kind-configuration messages such as LocalNetworkConfig and
// ThirdPartyConfig are arms of IntegrationConfig's kind oneof, not entity
// families; no State or Event exists for them.
package flowseer.model.inventory.v1;

import "flowseer/api/edge/v1/edge.proto";
import "flowseer/net/addr/v1/ip.proto";
import option "buf/validate/validate.proto";

// The local reference to an integration.
message IntegrationLocalRef {
  // FlowSeer-assigned integration identifier. Must be present.
  string id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

// The global reference to an integration.
message IntegrationGlobalRef {
  // The integration's own key. Must be present.
  IntegrationLocalRef integration = 1 [(buf.validate.field).required = true];
}

// Where an integration stands between creation and retirement.
enum IntegrationLifecycle {
  // No lifecycle named. State and events reject the zero value.
  INTEGRATION_LIFECYCLE_UNSPECIFIED = 0;
  // Created but not yet verified against the platform.
  INTEGRATION_LIFECYCLE_CANDIDATE = 1;
  // The adapter authenticated and read the platform's identity.
  INTEGRATION_LIFECYCLE_VERIFIED = 2;
  // Verification failed; the configuration or credential needs attention.
  INTEGRATION_LIFECYCLE_FAILED = 3;
  // Verified before but currently unhealthy. System-set, for example when
  // a sync drops more devices than the mass-drop threshold allows; clears
  // when syncs succeed again.
  INTEGRATION_LIFECYCLE_DEGRADED = 4;
  // Retired by an operator. Its bindings retire with it; the row and its
  // history remain.
  INTEGRATION_LIFECYCLE_RETIRED = 5;
}

// Configuration of the local-network kind: the devices on the network the
// hosting edge sits in.
message LocalNetworkConfig {
  // Ranges active discovery may sweep. Each entry is an explicit opt-in;
  // empty means passive discovery only.
  repeated flowseer.net.addr.v1.IpPrefix seed_ranges = 1;
}

// Configuration of a third-party kind, typed by the descriptor set the
// kind advertises when it announces. One arm covers every third-party
// kind; a first-party kind gets its own compiled arm instead.
message ThirdPartyConfig {
  // The kind's announced name; matches the announce and selects the
  // advertised descriptor set the payload is checked against. Must be
  // present.
  string kind_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Fully-qualified protobuf name of the config message within that
  // descriptor set. Must be present.
  string type_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256,
    (buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)+$"
  ];
  // The serialized config message of that type. The service builds the
  // type from the advertised descriptor and runs its protovalidate rules,
  // which needs data this message does not contain. Must be present; empty
  // is a config with every field unset.
  bytes value = 3 [(buf.validate.field).required = true];
  // Opaque identifier of the descriptor-set revision the payload was
  // serialized under, as the kind's announce reported it. A payload whose
  // revision does not match the currently advertised set is rejected
  // instead of being reinterpreted. Must be present.
  string descriptor_revision = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

// The intended definition of one integration: what the operator entered
// to attach it.
message IntegrationConfig {
  option (buf.validate.message).cel = {
    id: "integration_config.local_network_names_edge"
    message: "a local-network integration names its hosting edge"
    expression: "!has(this.local_network) || has(this.edge)"
  };

  // The ref to this integration. Must be present.
  IntegrationGlobalRef ref = 1 [(buf.validate.field).required = true];
  // Operator-assigned display name. Unset means none was assigned;
  // consumers fall back to the observed platform name. When set, must not
  // be empty.
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
  // Free-text description of the integration. Unset means none was
  // provided. When set, must not be empty.
  string description = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 2048
  ];
  // Reference into the secret store holding the integration's credential.
  // The credential itself never appears in inventory messages. Must be
  // present.
  string credential_ref = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // Request budget shared by the integration's discovery, facade, and
  // poller traffic, in requests per second. Unset means the kind's default
  // applies.
  uint32 requests_per_second = 5 [(buf.validate.field).uint32.gt = 0];
  // The edge that hosts this integration. Unset means it runs centrally;
  // must be present for the local-network kind.
  flowseer.api.edge.v1.EdgeGlobalRef edge = 6;

  // The kind-specific configuration; the arm identifies the kind.
  // First-party kinds occupy 10 through 18; every third-party kind shares
  // the third_party arm and is told apart by its kind_name.
  oneof kind {
    option (buf.validate.oneof).required = true;

    LocalNetworkConfig local_network = 10;
    ThirdPartyConfig third_party = 19;
  }
}

// The observed side of one integration: the identity the platform
// reported at verification and the lifecycle FlowSeer holds for it.
message IntegrationState {
  option (buf.validate.message).cel = {
    id: "integration_state.verified_names_platform"
    message: "a verified integration names its platform id"
    expression: "this.lifecycle != 2 || has(this.platform_id)"
  };

  // The ref to this integration. Must be present.
  IntegrationGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The integration's lifecycle. Must be present; the zero value is
  // rejected.
  IntegrationLifecycle lifecycle = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The platform's own identifier for what this integration attaches to,
  // as the platform spells it. Unset means no identity read has yielded
  // one yet; must be present while the lifecycle is verified.
  string platform_id = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The platform's own name for it. Unset means no identity read has
  // yielded one yet.
  string platform_name = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // Platform software version as the platform reports it. Unset means the
  // platform does not report one.
  string platform_version = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 128
  ];
}

// One transition of an integration's lifecycle.
message IntegrationEvent {
  option (buf.validate.message).cel = {
    id: "integration_event.lifecycle_changes"
    message: "an integration event must change the lifecycle"
    expression: "!has(this.from) || this.from != this.to"
  };

  // The ref to the integration that changed. Must be present.
  IntegrationGlobalRef ref = 1 [(buf.validate.field).required = true];
  // The lifecycle before the transition. Unset means the integration
  // entered the inventory. The zero value is rejected.
  IntegrationLifecycle from = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The lifecycle after the transition. Must be present; the zero value
  // is rejected.
  IntegrationLifecycle to = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}
