edition = "2024";

// The credential material an edge is handed for one device, shaped for the
// protocol adapter that uses it. Delivered over an authenticated call and
// held only for the operation that acquired it. Not an entity: a store
// resolves material from a handle, nothing observes or configures it, so
// there is no triad and no ref pair.
package flowseer.model.credential.v1;

import option "buf/validate/validate.proto";

// The SNMPv3 authentication protocol. MD5 is absent: legacy management
// protocols are off, and a weak digest is never learned as a fallback.
enum SnmpAuthProtocol {
  SNMP_AUTH_PROTOCOL_UNSPECIFIED = 0;
  SNMP_AUTH_PROTOCOL_SHA1 = 1;
  SNMP_AUTH_PROTOCOL_SHA224 = 2;
  SNMP_AUTH_PROTOCOL_SHA256 = 3;
  SNMP_AUTH_PROTOCOL_SHA384 = 4;
  SNMP_AUTH_PROTOCOL_SHA512 = 5;
}

// The SNMPv3 privacy protocol. DES and 3DES are absent for the same reason
// MD5 is.
enum SnmpPrivProtocol {
  SNMP_PRIV_PROTOCOL_UNSPECIFIED = 0;
  SNMP_PRIV_PROTOCOL_AES128 = 1;
  SNMP_PRIV_PROTOCOL_AES192 = 2;
  SNMP_PRIV_PROTOCOL_AES256 = 3;
}

// An SNMPv3 user with authentication and privacy, the only SNMP security
// level a device may be managed at.
message SnmpV3Credential {
  // The USM user name. Must be present.
  string user = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];
  // Must be present; the zero value is rejected.
  SnmpAuthProtocol auth_protocol = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The authentication passphrase, at least 8 characters per RFC 3414.
  // Must be present.
  string auth_passphrase = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 256
  ];
  // Must be present; the zero value is rejected.
  SnmpPrivProtocol priv_protocol = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The privacy passphrase, at least 8 characters per RFC 3414. Must be
  // present.
  string priv_passphrase = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 256
  ];
}

// A shell login over SSH, authenticated by a password, a private key, or
// both when the device asks for both.
message ShellCredential {
  option (buf.validate.message).cel = {
    id: "shell_credential.authenticator"
    message: "a shell credential carries a password, a private key, or both"
    expression: "has(this.password) || has(this.private_key)"
  };
  option (buf.validate.message).cel = {
    id: "shell_credential.passphrase_needs_key"
    message: "private_key_passphrase is set only with private_key"
    expression: "!has(this.private_key_passphrase) || has(this.private_key)"
  };

  // Must be present.
  string username = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  // The login password. Unset means the login authenticates with the
  // private key alone.
  string password = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The privileged-mode password, for a device that asks for one after
  // login. Unset means the device does not ask.
  string enable_password = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  // The private key in OpenSSH or PEM encoding, as ssh-keygen writes it.
  // Unset means the login authenticates with the password alone.
  bytes private_key = 4 [
    (buf.validate.field).bytes.min_len = 1,
    (buf.validate.field).bytes.max_len = 16384
  ];
  // The passphrase protecting private_key. Unset means the key is not
  // encrypted. Set only with private_key.
  string private_key_passphrase = 5 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
}

// One credential as an adapter consumes it.
message CredentialMaterial {
  // Exactly one shape.
  oneof material {
    option (buf.validate.oneof).required = true;

    SnmpV3Credential snmp_v3 = 1;
    ShellCredential shell = 2;
  }
}
