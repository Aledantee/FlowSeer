edition = "2024";

// Who an authorization check is about. A principal is named by the identity
// provider, not by FlowSeer: it has no ref pair, no triad, and no place in
// EntityType, because nothing FlowSeer stores answers for it.
package flowseer.model.principal.v1;

import option "buf/validate/validate.proto";

// A person, named by the identity provider's stable subject.
message OperatorRef {
  // The subject identifier the identity provider assigns, stable across
  // renames. Must be present.
  string subject = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
}
