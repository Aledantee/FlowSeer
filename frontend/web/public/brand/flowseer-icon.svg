<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2328" />
      <stop offset="50%" stop-color="#061518" />
      <stop offset="100%" stop-color="#02090B" />
    </linearGradient>

    <!-- 112deg Brand Glow Ribbon -->
    <linearGradient id="glowRibbon1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5ECAD8" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#5ECAD8" stop-opacity="0.08" />
      <stop offset="65%" stop-color="#FF451D" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#061518" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Rim Border Light -->
    <linearGradient id="rimLight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#83D9DF" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#5ECAD8" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#FF451D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF451D" stop-opacity="0.05" />
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="pillarCyan1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#83D9DF" />
      <stop offset="50%" stop-color="#5ECAD8" />
      <stop offset="100%" stop-color="#2C8894" />
    </linearGradient>

    <linearGradient id="pillarCyanApex1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7FBFC" />
      <stop offset="25%" stop-color="#83D9DF" />
      <stop offset="65%" stop-color="#5ECAD8" />
      <stop offset="100%" stop-color="#247883" />
    </linearGradient>

    <linearGradient id="pillarCoral1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA885" />
      <stop offset="35%" stop-color="#FF451D" />
      <stop offset="100%" stop-color="#B82C0D" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="bloomCyan1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur" />
    </filter>
    <filter id="bloomCoral1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
  </defs>

  <!-- App Tile Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad1)" />
  <rect width="512" height="512" rx="116" fill="url(#glowRibbon1)" />
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#rimLight1)" stroke-width="2.5" />

  <!-- Subtle Telemetry Grid Lines -->
  <g opacity="0.12" stroke="#5ECAD8" stroke-width="1.5">
    <line x1="80" y1="175" x2="432" y2="175" stroke-dasharray="4 12" />
    <line x1="80" y1="256" x2="432" y2="256" stroke-dasharray="6 10" />
    <line x1="80" y1="337" x2="432" y2="337" stroke-dasharray="4 12" />
  </g>

  <!-- Telemetry Pulse Dots -->
  <g opacity="0.45">
    <circle cx="115" cy="256" r="3" fill="#83D9DF" />
    <circle cx="395" cy="256" r="3" fill="#FF8C61" />
  </g>

  <!-- Centered Kinetic Pillar Group (-13deg skew) -->
  <g transform="translate(256 256) skewX(-13) translate(-256 -256)">
    <!-- Atmospheric Bloom under Bars -->
    <rect x="232" y="102" width="48" height="308" rx="24" fill="#5ECAD8" opacity="0.32" filter="url(#bloomCyan1)" />
    <rect x="306" y="172" width="48" height="168" rx="24" fill="#FF451D" opacity="0.38" filter="url(#bloomCoral1)" />

    <!-- Pillar 1: Cyan Intake Stream (Height 220) -->
    <rect x="158" y="146" width="48" height="220" rx="24" fill="url(#pillarCyan1)" />
    <!-- Pillar 1 Inner Highlight -->
    <rect x="162" y="150" width="16" height="100" rx="8" fill="#FFFFFF" opacity="0.25" />

    <!-- Pillar 2: Peak Telemetry Apex (Height 310) -->
    <rect x="232" y="101" width="48" height="310" rx="24" fill="url(#pillarCyanApex1)" />
    <!-- Pillar 2 Inner Highlight -->
    <rect x="236" y="105" width="18" height="160" rx="9" fill="#FFFFFF" opacity="0.35" />

    <!-- Pillar 3: Action Pulse / Coral (Height 170) -->
    <rect x="306" y="171" width="48" height="170" rx="24" fill="url(#pillarCoral1)" />
    <!-- Pillar 3 Inner Highlight -->
    <rect x="310" y="175" width="16" height="80" rx="8" fill="#FFFFFF" opacity="0.3" />
  </g>
</svg>
