# Shared Serena configuration for FlowSeer.
# Local overrides belong in project.local.yml, which Serena keeps untracked.
project_name: "FlowSeer"

language_servers:
  - go

language_backend: LSP
encoding: "utf-8"
line_ending: "lf"

ignore_all_files_in_gitignore: true
ignored_paths:
  # buf.lock is managed by Buf and is not useful semantic context.
  - "buf.lock"

read_only: true
excluded_tools: []
included_optional_tools: []
fixed_tools: []

ls_workspace_folders:
  - "."
ls_additional_workspace_folders: []
ls_specific_settings:
  go:
    gopls_settings:
      # Semantic queries must never rewrite module manifests as a side effect.
      env:
        GOFLAGS: "-mod=readonly"

initial_prompt: |
  Read AGENTS.md before modifying files and follow every linked convention that
  applies to the area being changed. Never edit generated/, frontend/web/generated/,
  or buf.lock directly; update the source of truth and regenerate. Perform edits in
  an isolated git worktree as required by the repository instructions.

activation_command:
activation_command_timeout: 180
symbol_info_budget:
default_modes:
added_modes:
read_only_memory_patterns: []
ignored_memory_patterns: []
