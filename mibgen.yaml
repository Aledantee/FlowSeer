# mibgen configuration — first-set MIB modules.
#
# Search paths are resolved relative to this file. Module names match
# the MODULE-IDENTITY declarations inside spec/mib/<authority>/<NAME>.

search_paths:
  - spec/mib/ietf
  - spec/mib/ieee
  - spec/mib/mikrotik
  - spec/mib/dlink
  - spec/mib/hp/procurve
  - spec/mib/hp/hh3c
  # Vendor product trees listed only for the sysobjectid identity table.
  - spec/mib/ruckus/icx
  - spec/mib/lancom/lcos
  - spec/mib/cisco/products
  - spec/mib/cisco/smb

modules:
  - name: SNMPv2-SMI
    package: snmpv2smi
  - name: SNMPv2-TC
    package: snmpv2tc
  - name: SNMPv2-CONF
    package: snmpv2conf
  - name: IANAifType-MIB
    package: ianaiftype
  - name: SNMPv2-MIB
    package: snmpv2mib
  # IF-MIB's indicators are all structurally discoverable: ifTable
  # binds its per-row ifLastChange column, and ifStackTable binds the
  # ifStackLastChange scalar via the name-prefix rule.
  - name: IF-MIB
    package: ifmib
  - { name: BRIDGE-MIB,        package: bridgemib }
  - { name: P-BRIDGE-MIB,      package: pbridgemib }
  - { name: Q-BRIDGE-MIB,      package: qbridgemib }
  - name: ENTITY-MIB
    package: entitymib
    # ENTITY-MIB's single entLastChangeTime scalar covers five
    # tables. The scalar's parent (entityGeneral) has multiple table
    # siblings, so structural discovery cannot bind it. Each
    # covered table emits its own EntPhysicalTableIndicator etc.
    # var pointing at the shared scalar.
    indicators:
      - scalar_oid:    "1.3.6.1.2.1.47.1.4.1"   # entLastChangeTime
        covers_tables:
          - "1.3.6.1.2.1.47.1.1.1"              # entPhysicalTable
          - "1.3.6.1.2.1.47.1.2.1"              # entLogicalTable
          - "1.3.6.1.2.1.47.1.3.1"              # entLPMappingTable
          - "1.3.6.1.2.1.47.1.3.2"              # entAliasMappingTable
          - "1.3.6.1.2.1.47.1.3.3"              # entPhysicalContainsTable
  - { name: ENTITY-SENSOR-MIB, package: entitysensormib }
  - { name: ENTITY-STATE-MIB,  package: entitystatemib }
  - { name: IP-MIB,            package: ipmib }
  - { name: HOST-RESOURCES-MIB, package: hostresourcesmib }
  - { name: LLDP-MIB,          package: lldpmib }
  # MIKROTIK-MIB lives under spec/mib/mikrotik/ but imports from the
  # SNMPv2-* base modules under spec/mib/ietf/; gosmi resolves IMPORTS
  # across the combined search_paths regardless of listing order, so no
  # depends_on edge is needed.
  - { name: MIKROTIK-MIB,      package: mikrotik }
  # Physical-layer modules behind flowseer.net.phy.v1. IANA-MAU-MIB is a
  # registry module listed for its typed jack and link-mode bit constants;
  # MAU-MIB's columns resolve to those types only when it is generated too.
  - { name: EtherLike-MIB,      package: etherlikemib }
  - { name: IANA-MAU-MIB,       package: ianamaumib }
  - { name: MAU-MIB,            package: maumib }
  - { name: POWER-ETHERNET-MIB, package: powerethernetmib }
  # Vendor transceiver and DDM modules, each keyed by ifIndex. Their
  # IMPORTS resolve to the vendored DLINK-ID-REC-MIB, HP-ICF-OID, and
  # HH3C-OID-MIB roots under the search paths above.
  - { name: DLINKSW-DDM-MIB,           package: dlinkswddmmib }
  - { name: DLINKSW-SFPINFO-MIB,       package: dlinkswsfpinfomib }
  - { name: HP-ICF-TRANSCEIVER-MIB,    package: hpicftransceivermib }
  - { name: HH3C-TRANSCEIVER-INFO-MIB, package: hh3ctransceiverinfomib }
  # Identity only: the modules below declare product naming nodes and no
  # tables, so their packages are near-empty and their whole value is the
  # entries they add to the sysobjectid table. LCOS-MIB at the end is the
  # exception, and says so itself.
  #
  # FOUNDRY-SN-ROOT-MIB carries the Ruckus ICX (ex-Brocade, ex-Foundry)
  # product families and models under enterprises 1991.
  - { name: FOUNDRY-SN-ROOT-MIB, package: foundrysnroot }
  # HH3C-OID-MIB carries the Comware enterprise and product-family roots
  # (enterprises 25506) that HH3C-PRODUCT-ID-MIB hangs its models off;
  # without it those parents are absent from the identity table.
  - { name: HH3C-OID-MIB,        package: hh3coid }
  - { name: HH3C-PRODUCT-ID-MIB, package: hh3cproductid }
  # CISCO-SMI declares the roots under enterprises 9 — ciscoProducts among
  # them — that CISCO-PRODUCTS-MIB hangs its models off. Without it those
  # parents are absent, and a product OID the products module does not name
  # has no Cisco ancestor to fall back to.
  - { name: CISCO-SMI,           package: ciscosmi }
  # The sysObjectID every IOS, IOS-XE, and NX-OS box reports, Catalyst
  # switches and 9800 wireless controllers included: ~2950 product nodes
  # under ciscoProducts and not one table.
  - { name: CISCO-PRODUCTS-MIB,  package: ciscoproducts }
  # The small-business line (CBS, SG, Catalyst 1200/1300) sits outside
  # ciscoProducts, under enterprises 9.6.1, and reports a per-family OID
  # below the switch001 node this module declares. The families themselves
  # are in no public MIB, so a CBS350 resolves to switch001 rather than to
  # its model — enough to know the vendor and the firmware line.
  - { name: CISCOSB-MIB,         package: ciscosbmib }
  # An AireOS controller reports a sysObjectID under 1.3.6.1.4.1.14179.1.1.4,
  # and no public MIB names those model nodes. AIRESPACE-REF-MIB declares the
  # airespace root alone, so a WLC resolves to it by ancestor — vendor and
  # line, not model. The deeper AIRESPACE-SWITCHING-MIB is deliberately not
  # here: the only ancestor it would add is agentInfoGroup at 14179.1.1, a
  # management-tree group rather than a product, and it carries 16 tables
  # nothing reads. Resolving a controller to that would be more precise and
  # less true.
  - { name: AIRESPACE-REF-MIB,   package: airespaceref }
  # LCOS-MIB carries the LANCOM product nodes (enterprises 2356) together
  # with the whole LCOS status and setup tree, so unlike the identity-only
  # modules above it costs a full package. LANCOM ships one full copy per
  # firmware release under a versioned file name, all declaring the same
  # module name, so the file is pinned to the newest release. A device on
  # older firmware may report a product OID the newest file dropped, which
  # then resolves to the nearest LANCOM ancestor.
  - name: LCOS-MIB
    package: lcosmib
    file: spec/mib/lancom/lcos/LC-UNIFIED-LCOS-10-94-REL-OIDS.mib
