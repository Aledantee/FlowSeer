services:
  postgres:
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: openfga
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:v1.21.0@sha256:2113c664a486b5da8d7a2cdab479e0d4e30639c80fd2c000540f645c1dbc1e55
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:password@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.21.0@sha256:2113c664a486b5da8d7a2cdab479e0d4e30639c80fd2c000540f645c1dbc1e55
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:password@postgres:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_GRPC_TLS_ENABLED: "true"
      OPENFGA_GRPC_TLS_CERT: /etc/openfga/tls.crt
      OPENFGA_GRPC_TLS_KEY: /etc/openfga/tls.key
      OPENFGA_HTTP_TLS_ENABLED: "true"
      OPENFGA_HTTP_TLS_CERT: /etc/openfga/tls.crt
      OPENFGA_HTTP_TLS_KEY: /etc/openfga/tls.key
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_CHECK_QUERY_CACHE_ENABLED: "false"
      OPENFGA_CACHE_CONTROLLER_ENABLED: "false"
    env_file:
      - path: ./secrets/openfga.env
        required: false
    volumes:
      - ./secrets/server.crt:/etc/openfga/tls.crt:ro
      - ./secrets/server.key:/etc/openfga/tls.key:ro
      - ./secrets/ca.crt:/etc/openfga/ca.crt:ro
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8081", "-tls", "-tls-ca-cert=/etc/openfga/ca.crt", "-tls-server-name=localhost"]
      interval: 2s
      timeout: 5s
      retries: 10
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully

  dex:
    image: dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
      - ./secrets/server.crt:/etc/dex/tls.crt:ro
      - ./secrets/server.key:/etc/dex/tls.key:ro
    env_file:
      - path: ./secrets/dex.env
        required: false
    ports:
      - "127.0.0.1:8445:8445"

  # The history store for the lab: one node, plain engines, native protocol on
  # loopback. CLICKHOUSE_USER creates the admin that the migrator connects as,
  # with the password the lab README exports as CLICKHOUSE_ADMIN_PASSWORD. The
  # default is empty so that the plain `docker compose up`, which skips this
  # profile, still parses the file.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8@sha256:9b61e3c635c04ad5bb521eb4f6e61ce7585b5580814e51c25bb9e8292ce43364
    profiles: ["history"]
    environment:
      CLICKHOUSE_USER: flowseer_admin
      CLICKHOUSE_DB: flowseer
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  clickhouse-data:
