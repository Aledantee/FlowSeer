# snmp:* — SNMP integration tiers (test/integration/snmp/).
#
# Run with `task --dir test/integration/snmp <task>` from the repo root.
# `./...` below scopes to this package tree. Each tier is gated by an
# independent build tag, so a bare `go test ./...` runs zero integration tests.
#
# Container/lab lifecycle is owned by each tier's TestMain: running a tier
# brings its agent up and tears it down automatically. See README.md for the
# per-tier walkthrough and prerequisites (Docker; t2 also needs containerlab).

version: '3'

vars:
  # Shared flags for every tier (verbose, never cached).
  GOFLAGS: -v -count=1

tasks:
  conformance:
    desc: 'Conformance corpus merge gate — every catalogued quirk row covered or allowlisted accepted-risk (no Docker; snmp_conformance_complete build tag)'
    cmds:
      - go test -tags=snmp_conformance_complete -count=1 -run TestConformanceCorpusComplete ../../../src/common/snmp/

  t1:
    desc: 'Tier 1 — Net-SNMP snmpd in Docker (USM auth/priv matrix + forged edges)'
    cmds:
      - go test -tags=snmp_integration_t1 {{.GOFLAGS}} ./...

  t2:
    desc: 'Tier 2 — Nokia SR Linux via containerlab (dense-row collector + real-NOS traps)'
    cmds:
      - go test -tags=snmp_integration_t2 {{.GOFLAGS}} ./...

  t3:
    desc: 'Tier 3 — snmpsim .snmprec replay (vendor regression coverage)'
    cmds:
      - go test -tags=snmp_integration_t3 {{.GOFLAGS}} ./...

  t4:
    desc: 'Tier 4 — operator-supplied live device (opt-in; needs SNMP_T4_TARGETS)'
    summary: |
      Runs against a reachable SNMP-enabled device you own. Set SNMP_T4_TARGETS
      to host[:port]@community[,host[:port]@community,...]. No containerisation,
      and deliberately excluded from `snmp:all` because the operator owns the
      device lifecycle.

        SNMP_T4_TARGETS="10.20.0.219@tegi" task snmp:t4
    requires:
      vars: [SNMP_T4_TARGETS]
    cmds:
      - go test -tags=snmp_integration_t4 {{.GOFLAGS}} ./...

  all:
    desc: 'Run t1 → t2 → t3 sequentially (t4 omitted — needs operator-supplied SNMP_T4_TARGETS)'
    cmds:
      - task: t1
      - task: t2
      - task: t3
